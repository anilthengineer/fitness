<!doctype html>
<html lang="tr" data-theme="system">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Fitness</title>
<style>
:root,
[data-theme="light"] {
  --bg: #f4f6f5;
  --surface: #ffffff;
  --surface-2: #edf1ef;
  --border: #d8dfda;
  --text: #17201b;
  --text-muted: #5a6a61;
  --accent: #2e7d5b;
  --accent-strong: #1c5d3f;
  --accent-contrast: #ffffff;
  --accent-soft: #e4f0ea;
  --info: #2b6cb0;
  --warn: #b45309;
  --danger: #c62828;
  --focus: #1f6feb;
  --radius: 12px;
  --shadow: 0 1px 2px rgba(16, 24, 20, 0.08), 0 1px 3px rgba(16, 24, 20, 0.1);
}

[data-theme="dark"] {
  --bg: #0f1412;
  --surface: #151b18;
  --surface-2: #1f2823;
  --border: #2c3830;
  --text: #e6ece8;
  --text-muted: #a7b4ab;
  --accent: #4ea57f;
  --accent-strong: #8ee6b5;
  --accent-contrast: #08130d;
  --accent-soft: #173228;
  --info: #7fb3e6;
  --warn: #f2b25c;
  --danger: #e5484d;
  --focus: #7fb3e6;
  --radius: 12px;
  --shadow: 0 1px 2px rgba(0, 0, 0, 0.55), 0 1px 3px rgba(0, 0, 0, 0.4);
}

[data-theme="system"] {
  --bg: #f4f6f5;
  --surface: #ffffff;
  --surface-2: #edf1ef;
  --border: #d8dfda;
  --text: #17201b;
  --text-muted: #5a6a61;
  --accent: #2e7d5b;
  --accent-strong: #1c5d3f;
  --accent-contrast: #ffffff;
  --accent-soft: #e4f0ea;
  --info: #2b6cb0;
  --warn: #b45309;
  --danger: #c62828;
  --focus: #1f6feb;
  --radius: 12px;
  --shadow: 0 1px 2px rgba(16, 24, 20, 0.08), 0 1px 3px rgba(16, 24, 20, 0.1);
}

@media (prefers-color-scheme: dark) {
  [data-theme="system"] {
    --bg: #0f1412;
    --surface: #151b18;
    --surface-2: #1f2823;
    --border: #2c3830;
    --text: #e6ece8;
    --text-muted: #a7b4ab;
    --accent: #4ea57f;
    --accent-strong: #8ee6b5;
    --accent-contrast: #08130d;
    --accent-soft: #173228;
    --info: #7fb3e6;
    --warn: #f2b25c;
    --danger: #e5484d;
    --focus: #7fb3e6;
    --radius: 12px;
    --shadow: 0 1px 2px rgba(0, 0, 0, 0.55), 0 1px 3px rgba(0, 0, 0, 0.4);
  }
}

*,
*::before,
*::after {
  box-sizing: border-box;
}

html {
  font-size: 16px;
}

body {
  margin: 0;
  min-width: 320px;
  overflow-x: hidden;
  background: var(--bg);
  color: var(--text);
  font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  font-size: 16px;
  line-height: 1.5;
  -webkit-text-size-adjust: 100%;
}

.mono {
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
}

button,
input,
select,
textarea {
  font: inherit;
  color: inherit;
}

a,
button,
input,
select,
textarea,
[role="tab"],
.tab,
label.chip input,
.seg label input {
  touch-action: manipulation;
}

:focus-visible {
  outline: 3px solid var(--focus);
  outline-offset: 2px;
}

.chips input:focus-visible,
.seg input:focus-visible {
  outline: none;
}

.chip input:focus-visible + span,
.seg input:focus-visible + span {
  outline: 3px solid var(--focus);
  outline-offset: 2px;
}

.skip-link {
  position: fixed;
  left: 12px;
  top: -100px;
  z-index: 100;
  background: var(--surface);
  color: var(--text);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 10px 14px;
  box-shadow: var(--shadow);
  text-decoration: none;
}

.skip-link:focus-visible {
  top: 12px;
}

.app {
  min-height: 100dvh;
  background: var(--bg);
}

.sidebar {
  display: none;
}

.main-col {
  min-width: 0;
  width: 100%;
}

.bottom-nav {
  display: none;
}

.topbar {
  position: sticky;
  top: 0;
  z-index: 20;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  min-width: 0;
  padding: 12px 20px;
  background: var(--bg);
}

.topbar-title {
  margin: 0;
  min-width: 0;
  font-size: 1.25rem;
  line-height: 1.3;
  overflow-wrap: anywhere;
}

.topbar-actions {
  display: flex;
  align-items: center;
  gap: 4px;
  flex: none;
}

.view {
  max-width: 1100px;
  margin: 0 auto;
  padding: 16px;
  display: flex;
  flex-direction: column;
  gap: 16px;
  min-width: 0;
  width: 100%;
}

@media (min-width: 900px) {
  .app {
    display: grid;
    grid-template-columns: 240px minmax(0, 1fr);
  }

  .sidebar {
    display: flex;
    flex-direction: column;
    position: sticky;
    top: 0;
    align-self: start;
    height: 100dvh;
    background: var(--surface);
    border-right: 1px solid var(--border);
  }

  .brand {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 16px 16px 10px;
    font-weight: 700;
  }

  .brand svg {
    width: 24px;
    height: 24px;
    flex: none;
  }

  .side-nav {
    display: flex;
    flex-direction: column;
    gap: 2px;
    padding: 8px;
  }

  .bottom-nav {
    display: none;
  }

  .view {
    padding: 20px;
  }
}

.nav-item {
  display: flex;
  align-items: center;
  gap: 10px;
  width: 100%;
  min-height: 40px;
  padding: 10px 12px;
  border: 0;
  border-radius: 10px;
  background: transparent;
  color: var(--text);
  font: inherit;
  text-align: left;
  cursor: pointer;
}

.nav-item svg {
  width: 20px;
  height: 20px;
  flex: none;
}

.nav-label {
  min-width: 0;
  overflow-wrap: anywhere;
}

.nav-item:hover {
  background: var(--surface-2);
}

.nav-item[aria-current="page"] {
  background: var(--accent-soft);
  color: var(--accent-strong);
  font-weight: 600;
}

.bottom-nav {
  position: fixed;
  left: 0;
  right: 0;
  bottom: 0;
  z-index: 30;
  display: grid;
  grid-template-columns: repeat(5, minmax(0, 1fr));
  gap: 2px;
  padding: 6px 6px calc(6px + env(safe-area-inset-bottom));
  background: var(--surface);
  border-top: 1px solid var(--border);
}

.bottom-nav .nav-item {
  flex-direction: column;
  justify-content: center;
  align-items: center;
  gap: 4px;
  min-height: 56px;
  padding: 8px 4px;
  border-radius: 10px;
  font-size: 0.7rem;
  line-height: 1.15;
}

.bottom-nav .nav-item svg {
  width: 22px;
  height: 22px;
}

.bottom-nav .nav-label {
  max-width: 100%;
  overflow-wrap: anywhere;
  text-align: center;
}

body.onboarding-mode .sidebar,
body.onboarding-mode .bottom-nav,
body.onboarding-mode .topbar-actions {
  display: none;
}

body.onboarding-mode .app {
  display: block;
}

body.onboarding-mode .main-col {
  width: 100%;
}

.card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 16px;
  box-shadow: var(--shadow);
  min-width: 0;
}

.card-head {
  display: flex;
  flex-wrap: wrap;
  align-items: flex-start;
  gap: 4px 8px;
  margin-bottom: 10px;
}

.card-title {
  margin: 0;
  font-size: 1.05rem;
  line-height: 1.3;
  overflow-wrap: anywhere;
}

.card-sub {
  margin: 2px 0 0;
  color: var(--text-muted);
  font-size: 0.875rem;
}

.grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(min(300px, 100%), 1fr));
  gap: 16px;
  min-width: 0;
}

.grid > * {
  min-width: 0;
}

.grid-2 {
  display: grid;
  grid-template-columns: 1fr;
  gap: 16px;
  min-width: 0;
}

@media (min-width: 700px) {
  .grid-2 {
    grid-template-columns: repeat(2, minmax(0, 1fr));
  }
}

.row {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 8px;
  min-width: 0;
}

.stack {
  display: flex;
  flex-direction: column;
  gap: 12px;
  min-width: 0;
}

.spacer {
  flex: 1;
}

.muted {
  color: var(--text-muted);
}

.small {
  font-size: 0.875rem;
}

.divider {
  height: 1px;
  margin: 8px 0;
  background: var(--border);
}

.badge {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  min-width: 0;
  padding: 2px 8px;
  border-radius: 999px;
  background: var(--surface-2);
  color: var(--text-muted);
  font-size: 0.75rem;
  line-height: 1.4;
  white-space: nowrap;
}

.badge-ok {
  background: var(--accent-soft);
  color: var(--accent-strong);
}

.badge-warn {
  background: var(--surface-2);
  border: 1px solid var(--warn);
  color: var(--warn);
}

.badge-info {
  background: var(--surface-2);
  border: 1px solid var(--info);
  color: var(--info);
}

.notice {
  padding: 12px;
  border-left: 4px solid var(--info);
  border-radius: var(--radius);
  background: var(--surface-2);
  min-width: 0;
}

@media (min-width: 768px) {
  .notice {
    background: color-mix(in srgb, var(--info) 9%, var(--surface));
  }
}

.notice-warn {
  border-left-color: var(--warn);
  background: var(--surface-2);
}

@media (min-width: 768px) {
  .notice-warn {
    background: color-mix(in srgb, var(--warn) 10%, var(--surface));
  }
}

.notice-info {
  border-left-color: var(--info);
  background: var(--surface-2);
}

@media (min-width: 768px) {
  .notice-info {
    background: color-mix(in srgb, var(--info) 9%, var(--surface));
  }
}

.empty {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 6px;
  padding: 24px;
  border: 1px dashed var(--border);
  border-radius: var(--radius);
  text-align: center;
  min-width: 0;
}

.empty-title {
  font-weight: 600;
}

.empty-text {
  color: var(--text-muted);
}

.kv {
  display: grid;
  grid-template-columns: auto 1fr;
  gap: 4px 16px;
  margin: 0;
  min-width: 0;
}

.kv dt {
  color: var(--text-muted);
  min-width: 0;
  overflow-wrap: anywhere;
}

.kv dd {
  margin: 0;
  min-width: 0;
  overflow-wrap: anywhere;
}

.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  min-height: 40px;
  padding: 8px 14px;
  border: 1px solid var(--border);
  border-radius: 10px;
  background: var(--surface-2);
  color: var(--text);
  font: inherit;
  line-height: 1.3;
  cursor: pointer;
  min-width: 0;
}

.btn svg {
  width: 18px;
  height: 18px;
  flex: none;
}

.btn:hover:not(:disabled) {
  background: var(--border);
}

.btn:active:not(:disabled) {
  transform: translateY(1px);
}

.btn:disabled {
  opacity: 0.55;
  cursor: not-allowed;
}

.btn-primary {
  background: var(--accent);
  color: var(--accent-contrast);
  border-color: transparent;
}

.btn-primary:hover:not(:disabled) {
  background: var(--accent-strong);
}

.btn-danger {
  background: var(--danger);
  color: #fff;
  border-color: transparent;
}

.btn-danger:hover:not(:disabled) {
  filter: brightness(0.93);
}

.btn-ghost {
  background: transparent;
  border-color: transparent;
}

.btn-ghost:hover:not(:disabled) {
  background: var(--surface-2);
}

.btn-sm {
  min-height: 34px;
  padding: 4px 10px;
  font-size: 0.875rem;
}

.btn-block {
  width: 100%;
}

.icon-btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 40px;
  height: 40px;
  padding: 0;
  border: 0;
  border-radius: 10px;
  background: transparent;
  color: var(--text);
  cursor: pointer;
}

.icon-btn svg {
  width: 22px;
  height: 22px;
  flex: none;
}

.icon-btn:hover:not(:disabled) {
  background: var(--surface-2);
}

.icon-btn:disabled {
  opacity: 0.55;
  cursor: not-allowed;
}

.form {
  display: grid;
  grid-template-columns: 1fr;
  gap: 12px 16px;
  min-width: 0;
}

@media (min-width: 700px) {
  .form {
    grid-template-columns: repeat(2, minmax(0, 1fr));
  }
}

.field {
  display: flex;
  flex-direction: column;
  gap: 4px;
  min-width: 0;
}

.field.wide {
  grid-column: 1 / -1;
}

.field label {
  font-size: 0.9rem;
  font-weight: 600;
}

.hint {
  margin: 0;
  color: var(--text-muted);
  font-size: 0.8rem;
}

.error {
  display: block;
  margin: 0;
  color: var(--danger);
  font-size: 0.85rem;
}

.error[hidden] {
  display: none;
}

.input {
  width: 100%;
  min-height: 42px;
  padding: 8px 10px;
  border: 1px solid var(--border);
  border-radius: 8px;
  background: var(--bg);
  color: var(--text);
  font: inherit;
  line-height: 1.4;
  min-width: 0;
}

textarea.input {
  min-height: 80px;
  resize: vertical;
}

select.input {
  appearance: none;
  background-image: linear-gradient(45deg, transparent 50%, var(--text-muted) 50%),
    linear-gradient(135deg, var(--text-muted) 50%, transparent 50%);
  background-position: calc(100% - 16px) 50%, calc(100% - 10px) 50%;
  background-size: 6px 6px, 6px 6px;
  background-repeat: no-repeat;
  padding-right: 28px;
}

.input[aria-invalid="true"] {
  border-color: var(--danger);
}

.check {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  min-width: 0;
}

.check input[type="checkbox"],
.check input[type="radio"] {
  width: 20px;
  height: 20px;
  margin: 0;
  accent-color: var(--accent);
}

.chip-group,
.seg {
  border: 0;
  padding: 0;
  margin: 0;
  min-width: 0;
}

.chip-group legend,
.seg legend {
  padding: 0;
  margin-bottom: 6px;
  font-size: 0.9rem;
  font-weight: 600;
}

.chips {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
}

.chips label,
.chip-group label.chip,
.seg label {
  position: relative;
  display: inline-flex;
  min-width: 0;
  cursor: pointer;
}

.chips input,
.chip-group input,
.seg input {
  position: absolute;
  inset: 0;
  width: 1px;
  height: 1px;
  margin: 0;
  opacity: 0;
  pointer-events: none;
}

.chips span,
.chip-group label.chip span,
.seg label span {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 6px 12px;
  border: 1px solid var(--border);
  border-radius: 999px;
  background: var(--surface);
  color: var(--text);
  line-height: 1.3;
  overflow-wrap: anywhere;
}

.chip-group input:checked + span,
.seg input:checked + span {
  background: var(--accent-soft);
  border-color: var(--accent);
  color: var(--accent-strong);
  font-weight: 600;
}

.form-actions {
  display: flex;
  flex-wrap: wrap;
  justify-content: flex-end;
  gap: 8px;
  grid-column: 1 / -1;
  min-width: 0;
}

.stats {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
  gap: 12px;
  min-width: 0;
}

.stat {
  background: var(--surface-2);
  border-radius: var(--radius);
  padding: 12px;
  min-width: 0;
}

.stat-label {
  color: var(--text-muted);
  font-size: 0.8rem;
}

.stat-value {
  font-size: 1.4rem;
  font-weight: 600;
  line-height: 1.25;
  font-variant-numeric: tabular-nums;
  overflow-wrap: anywhere;
}

.stat-sub {
  color: var(--text-muted);
  font-size: 0.8rem;
}

.meter {
  height: 8px;
  border-radius: 999px;
  background: var(--surface-2);
  overflow: hidden;
  width: 100%;
}

.meter-bar {
  height: 100%;
  background: var(--accent);
  transition: width 180ms ease;
}

.meter.over .meter-bar {
  background: var(--warn);
}

.table-wrap {
  width: 100%;
  overflow-x: auto;
  min-width: 0;
}

.table {
  width: 100%;
  border-collapse: collapse;
  text-align: left;
}

.table th,
.table td {
  padding: 8px;
  border-bottom: 1px solid var(--border);
  vertical-align: top;
  min-width: 0;
}

.table th {
  color: var(--text-muted);
  font-size: 0.8rem;
  font-weight: 600;
}

.table td {
  overflow-wrap: anywhere;
}

.list {
  list-style: none;
  padding: 0;
  margin: 0;
  min-width: 0;
}

.list-item {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 10px 0;
  border-bottom: 1px solid var(--border);
  min-width: 0;
}

.list-item:last-child {
  border-bottom: 0;
}

.li-main {
  flex: 1;
  min-width: 0;
}

.li-title {
  font-weight: 600;
  overflow-wrap: anywhere;
}

.li-sub {
  color: var(--text-muted);
  font-size: 0.85rem;
}

.li-actions {
  display: flex;
  flex-shrink: 0;
  align-items: center;
  gap: 4px;
  min-width: 0;
  flex-wrap: wrap;
}

.tabs {
  display: flex;
  gap: 4px;
  overflow-x: auto;
  border-bottom: 1px solid var(--border);
  min-width: 0;
}

.tab {
  appearance: none;
  border: 0;
  border-bottom: 3px solid transparent;
  background: transparent;
  color: var(--text-muted);
  padding: 10px 14px;
  min-height: 40px;
  font: inherit;
  cursor: pointer;
  white-space: nowrap;
}

.tab[aria-selected="true"] {
  color: var(--accent-strong);
  border-bottom-color: var(--accent);
  font-weight: 600;
}

.date-pager {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 8px;
  min-width: 0;
}

.date-pager input[type="date"] {
  width: auto;
  min-height: 40px;
}

.ex-card {
  background: var(--surface-2);
  border: 1px solid var(--border);
  border-radius: calc(var(--radius) - 4px);
  padding: 12px;
  min-width: 0;
}

.ex-head {
  display: flex;
  flex-wrap: wrap;
  align-items: flex-start;
  justify-content: space-between;
  gap: 8px;
  margin-bottom: 8px;
}

.set-table {
  display: flex;
  flex-direction: column;
  gap: 6px;
  min-width: 0;
}

.set-row {
  display: grid;
  grid-template-columns: 2.2rem 1fr 1fr auto auto;
  align-items: center;
  gap: 8px;
  min-width: 0;
}

.set-row > * {
  min-width: 0;
}

.set-row .input {
  min-height: 36px;
  padding: 6px 8px;
}

.set-row.done {
  background: var(--accent-soft);
  border-radius: 8px;
  padding: 4px;
  margin: -4px;
}

.timer {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 8px;
  min-width: 0;
}

.timer-display {
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
  font-size: 2rem;
  line-height: 1.1;
  min-width: 5ch;
  text-align: center;
  font-variant-numeric: tabular-nums;
}

.prev-perf {
  color: var(--text-muted);
  font-size: 0.85rem;
}

.suggest {
  padding: 10px 12px;
  border-left: 4px solid var(--accent);
  border-radius: var(--radius);
  background: var(--surface-2);
  min-width: 0;
}

@media (min-width: 768px) {
  .suggest {
    background: color-mix(in srgb, var(--accent) 10%, var(--surface));
  }
}

.chart {
  width: 100%;
  min-width: 0;
}

.chart svg {
  display: block;
  width: 100%;
  height: auto;
}

.ch-grid {
  stroke: var(--border);
  stroke-width: 1;
}

.ch-axis {
  stroke: var(--text-muted);
}

.ch-label {
  fill: var(--text-muted);

  border: 1px solid var(--border);

function parseISO(iso) {
  if (typeof iso !== "string" || !/^\d{4}-\d{2}-\d{2}$/.test(iso)) return new Date(NaN);
  const [y, m, d] = iso.split("-").map(Number);

function addDays(iso, n) {

function weekdayISO(iso) {
  const d = parseISO(iso);

  const g = d.getDay();
  return g === 0 ? 7 : g;
}

function startOfWeek(iso) {
  const d = parseISO(iso);
  if (Number.isNaN(d.getTime())) return iso;
  const wd = weekdayISO(iso);
  d.setDate(d.getDate() - ((wd === 0 ? 7 : wd) - 1));
  return toISO(d);
}

  const wd = d.getDay() === 0 ? 7 : d.getDay();
  if (long) return `${d.getDate()} ${months[d.getMonth()]} ${d.getFullYear()}, ${WEEKDAYS[wd]}`;
  return `${d.getDate()} ${monthsShort[d.getMonth()]} ${WEEKDAYS_SHORT[wd]}`;
}

function uid(prefix = "id") {
  const t = Date.now().toString(36);
  const r = Math.random().toString(36).slice(2, 8);
  return `${prefix}_${t}_${r}`;
}

function fmtNum(n, digits = 0) {
  if (n === null || n === undefined || n === "") return "—";
  const x = typeof n === "number" ? n : Number(n);
  if (!Number.isFinite(x)) return "—";
  return x.toLocaleString("tr-TR", { minimumFractionDigits: 0, maximumFractionDigits: digits });
}

function round(n, digits = 0) {
  if (typeof n !== "number" || Number.isNaN(n) || !Number.isFinite(n)) return null;
  const f = Math.pow(10, digits);
  return Math.round((n + Number.EPSILON) * f) / f;
}

function clamp(n, min, max) {
  if (typeof n !== "number" || Number.isNaN(n)) return min;
  return Math.min(Math.max(n, min), max);
}

function parseNum(str) {
  if (str === null || str === undefined) return null;
  let s = String(str).trim();
  if (s === "") return null;
  s = s.replace(",", ".");
  if (!/^-?\d+(\.\d+)?$/.test(s)) return NaN;
  return Number(s);
}

function defaultState() {
  return {
    schemaVersion: SCHEMA_VERSION,
    profile: null,
    settings: { theme: "system" },
    nutrition: { targets: null },
    customFoods: [],
    days: {},
    weights: [],
    plan: null,
    sessions: [],
    menu: null
  };
}

function isPlainObject(v) {
  return v !== null && typeof v === "object" && !Array.isArray(v);
}

function migrate(obj) {
  if (!isPlainObject(obj)) throw new Error("invalid");
  if (typeof obj.schemaVersion === "number" && obj.schemaVersion > SCHEMA_VERSION) throw new Error("newer");

  const state = defaultState();
  state.schemaVersion = typeof obj.schemaVersion === "number" ? obj.schemaVersion : SCHEMA_VERSION;

  state.profile = isPlainObject(obj.profile) ? obj.profile : null;

  const settings = isPlainObject(obj.settings) ? obj.settings : {};
  state.settings = {
    theme: ["system", "light", "dark"].includes(settings.theme) ? settings.theme : "system"
  };

  const nutrition = isPlainObject(obj.nutrition) ? obj.nutrition : {};
  state.nutrition = { targets: isPlainObject(nutrition.targets) ? nutrition.targets : null };

  state.customFoods = Array.isArray(obj.customFoods) ? obj.customFoods.slice() : [];
  state.days = isPlainObject(obj.days) ? obj.days : {};

  if (Array.isArray(obj.weights)) {
    const byDate = {};
    for (const w of obj.weights) {
      if (!isPlainObject(w)) continue;
      if (typeof w.date !== "string" || !/^\d{4}-\d{2}-\d{2}$/.test(w.date)) continue;
      const kg = Number(w.kg);
      if (!Number.isFinite(kg) || kg <= 0) continue;
      const waistCm = w.waistCm != null && w.waistCm !== "" && Number.isFinite(Number(w.waistCm)) ? Number(w.waistCm) : null;
      byDate[w.date] = { date: w.date, kg, waistCm };
    }
    state.weights = Object.keys(byDate).sort().map((date) => byDate[date]);
  } else {
    state.weights = [];
  }

  state.plan = isPlainObject(obj.plan) ? obj.plan : null;
  state.sessions = Array.isArray(obj.sessions) ? obj.sessions.slice() : [];
  state.menu = isPlainObject(obj.menu) ? obj.menu : null;

  return state;
}

const APP = {
  state: null,
  ui: {
    view: "today",
    date: todayISO(),
    tab: {},
    loadError: null
  }
};

function loadState() {
  let raw;
  try {
    raw = localStorage.getItem(STORAGE_KEY);
  } catch (e) {
    APP.ui.loadError = "Tarayıcı depolamasına erişilemiyor. Kayıtlar bu oturumda saklanamayabilir.";
    APP.state = defaultState();
    return;
  }

  if (raw === null || raw === "") {
    APP.state = defaultState();
    return;
  }

  let parsed;
  try {
    parsed = JSON.parse(raw);
  } catch (e) {
    try {
      localStorage.setItem("fitnessApp.corrupt-" + Date.now(), raw);
    } catch (e2) {}
    APP.ui.loadError = "Kayıtlı veriler okunamadı (bozuk olabilir). Eski veri ayrı bir anahtara yedeklendi; uygulama boş verilerle başladı. Yedekten geri yükleyebilirsin.";
    APP.state = defaultState();
    return;
  }

  if (isPlainObject(parsed) && typeof parsed.schemaVersion === "number" && parsed.schemaVersion > SCHEMA_VERSION) {
    APP.ui.loadError = "Kayıtlar bu uygulamanın daha yeni bir sürümüyle oluşturulmuş. Veri kaybını önlemek için kayıt yapılmayacak.";
    APP.ui.readOnly = true;
    APP.state = defaultState();
    return;
  }

  try {
    APP.state = migrate(parsed);
  } catch (e) {
    if (e && e.message === "newer") {
      APP.ui.loadError = "Kayıtlar bu uygulamanın daha yeni bir sürümüyle oluşturulmuş. Veri kaybını önlemek için kayıt yapılmayacak.";
      APP.ui.readOnly = true;
    } else {
      APP.ui.loadError = "Kayıtlı veriler okunamadı (bozuk olabilir). Eski veri ayrı bir anahtara yedeklendi; uygulama boş verilerle başladı. Yedekten geri yükleyebilirsin.";
      try {
        localStorage.setItem("fitnessApp.corrupt-" + Date.now(), raw);
      } catch (e2) {}
    }
    APP.state = defaultState();
  }
}

function saveState() {
  if (APP.ui.readOnly) {
    toast("Kayıtlar okunur; bu modda kayıt yapılamıyor.", "err");
    return false;
  }
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(APP.state));
    return true;
  } catch (e) {
    toast("Kayıt yapılamadı: tarayıcı depolaması dolu veya erişilemiyor. Yedek indirip yer açmayı dene.", "err");
    return false;
  }
}

function commit() {
  const ok = saveState();
  rerender();
  return ok;
}

function validateBackup(obj) {
  const errors = [];
  const add = (m) => { if (errors.length < 10) errors.push(m); };
  const dateRe = /^\d{4}-\d{2}-\d{2}$/;

  if (!isPlainObject(obj)) {
    add("Yedek dosyası geçersiz: veri bir nesne değil.");
    return errors;
  }

  if (typeof obj.schemaVersion !== "number" || !Number.isFinite(obj.schemaVersion)) {
    add("Yedek sürümü geçersiz.");
  } else if (obj.schemaVersion > SCHEMA_VERSION) {
    add("Yedek bu sürümden yeni.");
  }

  if (obj.profile !== null && obj.profile !== undefined) {
    if (!isPlainObject(obj.profile)) {
      add("Profil verisi geçersiz.");
    } else {
      const p = obj.profile;
      if (!Number.isFinite(Number(p.age))) add("Profil yaş alanı geçersiz.");
      if (!Number.isFinite(Number(p.heightCm))) add("Profil boy alanı geçersiz.");
      if (!Number.isFinite(Number(p.weightKg))) add("Profil kilo alanı geçersiz.");
    }
  }

  if (!isPlainObject(obj.days)) {
    add("Günlük kayıtlar geçersiz.");
  } else {
    for (const key of Object.keys(obj.days)) {
      if (!dateRe.test(key)) {
        add(`Gün anahtarı geçersiz: ${key}`);
        continue;
      }
      const day = obj.days[key];
      if (!isPlainObject(day) || !Array.isArray(day.meals)) {
        add(`Gün verisi geçersiz: ${key}`);
      }
      if (errors.length >= 10) break;
    }
  }

  if (!Array.isArray(obj.weights)) {
    add("Kilo kayıtları geçersiz.");
  } else {
    obj.weights.forEach((w, i) => {
      if (errors.length >= 10) return;
      if (!isPlainObject(w) || typeof w.date !== "string" || !dateRe.test(w.date) || !Number.isFinite(Number(w.kg)) || Number(w.kg) <= 0) {
        add(`Kilo kaydı #${i + 1} geçersiz.`);
      }
    });
  }

  if (!Array.isArray(obj.sessions)) {
    add("Antrenman kayıtları geçersiz.");
  } else {
    obj.sessions.forEach((s, i) => {
      if (errors.length >= 10) return;
      if (!isPlainObject(s) || !s.id || typeof s.date !== "string" || !dateRe.test(s.date) || !Array.isArray(s.exercises)) {
        add(`Antrenman kaydı #${i + 1} geçersiz.`);
      }
    });
  }

  if (!Array.isArray(obj.customFoods)) {
    add("Özel yiyecekler geçersiz.");
  } else {
    obj.customFoods.forEach((f, i) => {
      if (errors.length >= 10) return;
      if (!isPlainObject(f) || !f.id || typeof f.name !== "string" || !isPlainObject(f.per100)) {
        add(`Özel yiyecek #${i + 1} geçersiz.`);
        return;
      }
      const per100 = f.per100;
      if (!Number.isFinite(Number(per100.kcal)) || Number(per100.kcal) < 0 ||
          !Number.isFinite(Number(per100.p)) || Number(per100.p) < 0 ||
          !Number.isFinite(Number(per100.f)) || Number(per100.f) < 0 ||
          !Number.isFinite(Number(per100.c)) || Number(per100.c) < 0) {
        add(`Özel yiyecek #${i + 1} besin değeri geçersiz.`);
      }
    });
  }

  if (obj.plan !== null && obj.plan !== undefined) {
    if (!isPlainObject(obj.plan) || !Array.isArray(obj.plan.days) || obj.plan.days.length !== 7) {
      add("Plan verisi geçersiz.");
    }
  }

  if (obj.menu !== null && obj.menu !== undefined && !isPlainObject(obj.menu)) {
    add("Menü verisi geçersiz.");
  }

  return errors;
}

function exportBackup() {
  const payload = {
    app: "fitness",
    exportedAt: new Date().toISOString(),
    data: APP.state
  };
  const json = JSON.stringify(payload, null, 2);
  const blob = new Blob([json], { type: "application/json" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = `fitness-yedek-${todayISO()}.json`;
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
  toast("Yedek indirildi.", "ok");
}

function importBackup(file) {
  if (!file) return;
  file.text().then((raw) => {
    let parsed;
    try {
      parsed = JSON.parse(raw);
    } catch (e) {
      toast("Dosya okunamadı: geçerli bir JSON değil.", "err");
      return;
    }
    const data = parsed && parsed.app === "fitness" && parsed.data ? parsed.data : parsed;
    const errors = validateBackup(data);
    if (errors.length > 0) {
      toast(`${errors[0]} ${errors.length > 1 ? `(${errors.length} hata)` : ""}`, "err");
      return;
    }
    confirmDialog("Mevcut tüm kayıtların bu yedekteki verilerle değiştirilecek. Devam etmek istiyor musun?", "Geri yükle").then((ok) => {
      if (!ok) return;
      try {
        APP.state = migrate(data);
      } catch (e) {
        toast("Geri yükleme yapılamadı: yedek geçersiz.", "err");
        return;
      }
      if (saveState()) {
        applyTheme();
        toast("Yedek geri yüklendi.", "ok");
        navigate("today");
      }
    });
  }).catch(() => {
    toast("Dosya okunamadı: geçerli bir JSON değil.", "err");
  });
}

function toast(message, kind = "info") {
  const wrap = document.getElementById("toast-wrap");
  if (!wrap) return;
  const el = h("div", { class: `toast ${kind}`, role: "status", text: String(message) });
  wrap.appendChild(el);
  setTimeout(() => {
    if (el.parentNode) el.remove();
  }, 4000);
}

function confirmDialog(message, okLabel = "Onayla") {
  const dialog = document.getElementById("confirm-dialog");
  const msg = document.getElementById("confirm-msg");
  const ok = document.getElementById("confirm-ok");
  if (!dialog || !msg || !ok) return Promise.resolve(window.confirm(message));
  msg.textContent = message;
  ok.textContent = okLabel;
  if (typeof dialog.showModal !== "function") {
    return Promise.resolve(window.confirm(message));
  }
  // Sonuç doğrudan düğmelerden ve Escape'ten alınır; "close" olayına güvenilmez (gizli sekmede gecikebilir).
  return new Promise((resolve) => {
    const cancel = document.getElementById("confirm-cancel");
    const finish = (value) => {
      ok.removeEventListener("click", onOk);
      if (cancel) cancel.removeEventListener("click", onCancel);
      dialog.removeEventListener("cancel", onCancel);
      if (dialog.open) dialog.close(value ? "ok" : "cancel");
      resolve(value);
    };
    const onOk = (e) => { e.preventDefault(); finish(true); };
    const onCancel = (e) => { e.preventDefault(); finish(false); };
    ok.addEventListener("click", onOk);
    if (cancel) cancel.addEventListener("click", onCancel);
    dialog.addEventListener("cancel", onCancel);
    dialog.returnValue = "";
    dialog.showModal();
    if (cancel) cancel.focus();
  });
}

function applyTheme() {
  const theme = (APP.state && APP.state.settings && APP.state.settings.theme) || "system";
  document.documentElement.dataset.theme = theme;
  const btn = document.getElementById("theme-btn");
  if (!btn) return;
  clear(btn);
  const iconMap = { system: "auto", light: "sun", dark: "moon" };
  const labelMap = { system: "Tema: Sistem", light: "Tema: Açık", dark: "Tema: Koyu" };
  btn.appendChild(icon(iconMap[theme] || "auto"));
  const label = labelMap[theme] || labelMap.system;
  btn.setAttribute("aria-label", label);
  btn.title = label;
}

function cycleTheme() {
  const order = ["system", "light", "dark"];
  const cur = APP.state.settings.theme;
  const next = order[(order.indexOf(cur) + 1) % order.length];
  APP.state.settings.theme = next;
  saveState();
  applyTheme();
}

function buildNav() {
  const side = document.getElementById("side-nav");
  const bottom = document.getElementById("bottom-nav");
  if (side) clear(side);
  if (bottom) clear(bottom);
  const makeBtn = (item, compact) => h(
      "button",
      {
        class: "nav-item",
        type: "button",
        attrs: { "data-view": item.view },
        on: { click: () => navigate(item.view) }
      },
      icon(item.icon),
      h("span", { class: "nav-label", text: compact && item.short ? item.short : item.label })
    );
  for (const item of NAV) {
    if (side) side.appendChild(makeBtn(item));
    if (bottom && item.view !== "settings") bottom.appendChild(makeBtn(item, true));
  }
  const settingsBtn = document.getElementById("settings-btn");
  if (settingsBtn) {
    clear(settingsBtn);
    settingsBtn.appendChild(icon("settings"));
    settingsBtn.onclick = () => navigate("settings");
  }
}

function navigate(view, tab) {
  const item = NAV.find((n) => n.view === view);
  if (!item) view = "today";
  APP.ui.view = view;
  if (tab !== undefined && tab !== null) APP.ui.tab[view] = tab;
  if (location.hash !== `#${view}`) location.hash = `#${view}`;
  rerender();
  window.scrollTo(0, 0);
  const target = document.getElementById("view");
  if (target) target.focus({ preventScroll: true });
}

function rerender() {
  const root = document.getElementById("view");
  if (!root) return;
  clear(root);

  // Uyarı, ekran çizildikten sonra en üste eklenir (ekranlar çizime başlarken alanı temizliyor).
  let notice = null;
  if (APP.ui.loadError) {
    notice = h(
      "div",
      { class: "notice notice-warn", role: "alert" },
      h("span", { text: APP.ui.loadError }),
      h("button", {
        class: "btn btn-sm",
        type: "button",
        on: { click: () => { APP.ui.loadError = null; rerender(); } }
      }, "Kapat")
    );
  }

  if (!APP.state.profile) {
    document.body.classList.add("onboarding-mode");
    const title = document.getElementById("view-title");
    if (title) title.textContent = "Hoş geldin";
    renderOnboarding(root);
    if (notice) root.prepend(notice);
    return;
  }

  document.body.classList.remove("onboarding-mode");
  const navItem = NAV.find((n) => n.view === APP.ui.view) || NAV[0];
  const titleEl = document.getElementById("view-title");
  if (titleEl) titleEl.textContent = navItem.label;
  document.querySelectorAll(".nav-item[aria-current='page']").forEach((b) => b.removeAttribute("aria-current"));
  document.querySelectorAll(`.nav-item[data-view="${navItem.view}"]`).forEach((b) => b.setAttribute("aria-current", "page"));
  document.title = `${navItem.label} · Fitness`;

  try {
    if (navItem.view === "today") renderToday(root);
    else if (navItem.view === "workout") renderWorkout(root);
    else if (navItem.view === "nutrition") renderNutrition(root);
    else if (navItem.view === "progress") renderProgress(root);
    else if (navItem.view === "review") renderReview(root);
    else renderSettings(root);
    if (notice) root.prepend(notice);
  } catch (e) {
    console.error(e);
    root.appendChild(
      card(
        { title: "Bu bölüm görüntülenemedi" },
        h("p", { class: "muted", text: "Beklenmeyen bir hata oluştu. Sayfayı yenilemeyi dene; sorun sürerse yedek alıp verilerini kontrol et." })
      )
    );
  }
}

function getDay(iso) {
  if (!APP.state || !APP.state.days) return null;
  const day = APP.state.days[iso];
  return isPlainObject(day) ? day : null;
}

function ensureDay(iso) {
  if (!APP.state.days) APP.state.days = {};
  if (!APP.state.days[iso]) {
    APP.state.days[iso] = {
      waterMl: null,
      steps: null,
      sleepHours: null,
      energy: null,
      soreness: null,
      note: "",
      meals: []
    };
  }
  return APP.state.days[iso];
}

function currentWeight() {
  if (APP.state.weights && APP.state.weights.length > 0) {
    const last = APP.state.weights[APP.state.weights.length - 1];
    if (last && Number.isFinite(last.kg)) return last.kg;
  }
  if (APP.state.profile && Number.isFinite(APP.state.profile.weightKg)) return APP.state.profile.weightKg;
  return null;
}

function upsertWeight(date, kg, waistCm = null) {
  const k = Number(kg);
  const w = waistCm != null && waistCm !== "" && Number.isFinite(Number(waistCm)) ? Number(waistCm) : null;
  const entry = { date, kg: k, waistCm: w };
  const idx = APP.state.weights.findIndex((x) => x.date === date);
  if (idx >= 0) APP.state.weights[idx] = entry;
  else APP.state.weights.push(entry);
  APP.state.weights.sort((a, b) => (a.date < b.date ? -1 : a.date > b.date ? 1 : 0));
}

function card({ title, sub, actions, cls } = {}, ...children) {
  const el = h("section", { class: cls ? `card ${cls}` : "card" });
  if (title || sub || actions) {
    const head = h("div", { class: "card-head" });
    if (title) head.appendChild(h("h2", { class: "card-title", text: title }));
    if (sub) head.appendChild(h("p", { class: "card-sub", text: sub }));
    if (actions) {
      const row = h("div", { class: "row" });
      appendHChildren(row, Array.isArray(actions) ? actions : [actions]);
      head.appendChild(row);
    }
    el.appendChild(head);
  }
  appendHChildren(el, children);
  return el;
}

function field({ label, input, hint, wide } = {}) {
  const wrap = h("div", { class: wide ? "field wide" : "field" });
  if (label) wrap.appendChild(h("label", { for: input.id, text: label }));
  wrap.appendChild(input);
  if (hint) {
    const hintEl = h("p", { id: input.id + "-hint", class: "hint", text: hint });
    wrap.appendChild(hintEl);
  }
  const errEl = h("p", { id: input.id + "-err", class: "error", role: "alert", hidden: true });
  wrap.appendChild(errEl);
  const describedBy = [];
  if (hint) describedBy.push(input.id + "-hint");
  describedBy.push(input.id + "-err");
  input.setAttribute("aria-describedby", describedBy.join(" "));
  return wrap;
}

function setFieldError(input, msg) {
  if (!input || !input.id) return;
  const err = document.getElementById(input.id + "-err");
  if (msg) {
    input.setAttribute("aria-invalid", "true");
    if (err) {
      err.textContent = String(msg);
      err.hidden = false;
    }
  } else {
    input.removeAttribute("aria-invalid");
    if (err) {
      err.textContent = "";
      err.hidden = true;
    }
  }
}

function clearFieldErrors(container) {
  if (!container) return;
  container.querySelectorAll("[aria-invalid]").forEach((el) => el.removeAttribute("aria-invalid"));
  container.querySelectorAll("p.error").forEach((el) => {
    el.textContent = "";
    el.hidden = true;
  });
}

function numberInput({ id, value, min, max, step, placeholder } = {}) {
  const el = h("input", {
    class: "input",
    id,
    type: "number",
    inputmode: "decimal",
    value: value === null || value === undefined ? "" : String(value),
    placeholder: placeholder || "",
    step: step || "any",
    min: min !== undefined && min !== null ? min : undefined,
    max: max !== undefined && max !== null ? max : undefined
  });
  return el;
}

function selectInput({ id, options = [], value } = {}) {
  const el = h("select", { class: "input", id });
  for (const [val, label] of options) {
    const opt = h("option", { value: val, text: label, selected: value === val ? true : undefined });
    el.appendChild(opt);
  }
  return el;
}

function textInput({ id, value, placeholder, maxlength } = {}) {
  return h("input", {
    class: "input",
    id,
    type: "text",
    value: value === null || value === undefined ? "" : String(value),
    placeholder: placeholder || "",
    maxlength: maxlength !== undefined && maxlength !== null ? maxlength : undefined
  });
}

function chipGroup({ name, options = [], values = [], legend } = {}) {
  const fs = h("fieldset", { class: "chip-group" });
  if (legend) fs.appendChild(h("legend", { text: legend }));
  const chips = h("div", { class: "chips" });
  for (const [val, label] of options) {
    const input = h("input", { type: "checkbox", name, value: val, checked: values.includes(val) ? true : undefined, id: `${name}_${String(val).replace(/[^a-zA-Z0-9_-]/g, "")}` });
    chips.appendChild(h("label", { class: "chip", for: input.id }, input, h("span", { text: label })));
  }
  fs.appendChild(chips);
  return fs;
}

function segGroup({ name, options = [], value, legend } = {}) {
  const fs = h("fieldset", { class: "seg" });
  if (legend) fs.appendChild(h("legend", { text: legend }));
  const chips = h("div", { class: "chips" });
  for (const [val, label] of options) {
    const input = h("input", { type: "radio", name, value: val, checked: value === val ? true : undefined, id: `${name}_seg_${String(val).replace(/[^a-zA-Z0-9_-]/g, "")}` });
    chips.appendChild(h("label", { class: "chip", for: input.id }, input, h("span", { text: label })));
  }
  fs.appendChild(chips);
  return fs;
}

function readChecks(container, name) {
  const out = [];
  if (!container) return out;
  container.querySelectorAll(`input[name="${name}"]:checked`).forEach((el) => out.push(el.value));
  return out;
}

function emptyState(title, text, actionButton = null) {
  const el = h("div", { class: "empty" },
    h("p", { class: "empty-title", text: title }),
    h("p", { class: "empty-text", text: text })
  );
  if (actionButton) el.appendChild(actionButton);
  return el;
}

function tabs(viewName, list = [], defaultId) {
  const current = APP.ui.tab[viewName] && list.some((x) => x[0] === APP.ui.tab[viewName]) ? APP.ui.tab[viewName] : defaultId;
  const el = h("div", { class: "tabs", role: "tablist" });
  for (const [id, label] of list) {
    const btn = h("button", {
      class: "tab",
      role: "tab",
      type: "button",
      attrs: { "aria-selected": id === current ? "true" : "false" },
      on: { click: () => { APP.ui.tab[viewName] = id; rerender(); } }
    }, h("span", { text: label }));
    el.appendChild(btn);
  }
  return { el, current };
}

function datePager() {
  const today = todayISO();
  const isToday = APP.ui.date === today;
  const prev = h("button", { class: "btn btn-sm", type: "button", attrs: { "aria-label": "Önceki gün" }, on: { click: () => { APP.ui.date = addDays(APP.ui.date, -1); rerender(); } } }, icon("chevron-left"));
  const dateInput = h("input", { class: "input", type: "date", attrs: { "aria-label": "Tarih seç" }, value: APP.ui.date, on: { change: (e) => { if (/^\d{4}-\d{2}-\d{2}$/.test(e.target.value)) { APP.ui.date = e.target.value; rerender(); } } } });
  const next = h("button", { class: "btn btn-sm", type: "button", attrs: { "aria-label": "Sonraki gün" }, on: { click: () => { APP.ui.date = addDays(APP.ui.date, 1); rerender(); } } }, icon("chevron-right"));
  const todayBtn = h("button", { class: "btn btn-sm", type: "button", disabled: isToday ? true : undefined, on: { click: () => { APP.ui.date = today; rerender(); } } }, "Bugün");
  const label = h("span", { class: "muted", text: formatDate(APP.ui.date, true) });
  return h("div", { class: "date-pager" }, prev, dateInput, next, todayBtn, label);
}

function init() {
  loadState();
  buildNav();
  applyTheme();

  const themeBtn = document.getElementById("theme-btn");
  if (themeBtn) themeBtn.onclick = () => cycleTheme();

  if (window.matchMedia) {
    const mq = window.matchMedia("(prefers-color-scheme: dark)");
    mq.addEventListener ? mq.addEventListener("change", () => applyTheme()) : mq.addListener(() => applyTheme());
  }

  window.addEventListener("hashchange", () => {
    const v = (location.hash || "").replace("#", "");
    if (v && v !== APP.ui.view) navigate(v);
  });

  const initialHash = (location.hash || "").replace("#", "");
  const initialView = NAV.some((n) => n.view === initialHash) ? initialHash : "today";
  APP.ui.view = initialView;
  rerender();
}

document.addEventListener("DOMContentLoaded", init);

function getExercise(id) {
  return EXERCISES.find(ex => ex.id === id) || null;
}

function availableEquipment(profile) {
  const set = new Set(["bodyweight"]);
  if (profile && Array.isArray(profile.equipment)) {
    profile.equipment.forEach(id => set.add(id));
  }
  if (profile && profile.location === "gym") {
    EQUIPMENT.forEach(([id]) => set.add(id));
  }
  return set;
}

function availableExercises(profile) {
  const eq = availableEquipment(profile);
  return EXERCISES.filter(ex => ex.equipment.every(id => eq.has(id)));
}

function alternativesFor(exerciseId, profile) {
  const base = getExercise(exerciseId);
  if (!base) return [];
  return availableExercises(profile).filter(ex => ex.pattern === base.pattern && ex.id !== exerciseId);
}

function prescription(ex, experience) {
  const level = experience || "beginner";
  let base;
  if (ex.bodyweight) {
    base = level === "advanced" ? { sets: 4, repMin: 12, repMax: 25, restSec: 75 }
      : level === "intermediate" ? { sets: 3, repMin: 10, repMax: 20, restSec: 75 }
      : { sets: 2, repMin: 8, repMax: 15, restSec: 60 };
  } else if (ex.compound) {
    base = level === "advanced" ? { sets: 4, repMin: 5, repMax: 8, restSec: 150 }
      : level === "intermediate" ? { sets: 3, repMin: 6, repMax: 10, restSec: 120 }
      : { sets: 3, repMin: 8, repMax: 12, restSec: 90 };
  } else {
    base = level === "advanced" ? { sets: 3, repMin: 8, repMax: 12, restSec: 75 }
      : level === "intermediate" ? { sets: 3, repMin: 10, repMax: 15, restSec: 60 }
      : { sets: 2, repMin: 10, repMax: 15, restSec: 60 };
  }
  if (ex.pattern === "core") {
    base = { ...base, repMin: 10, repMax: 20 };
  }
  return base;
}

function generatePlan(profile) {
  const n0 = Math.min(6, Math.max(1, Number(profile.trainingDays) || 3));
  let chosenDays = Array.from(new Set((profile.availableDays || []).filter(d => d >= 1 && d <= 7))).sort((a,b)=>a-b);
  let n = n0;
  if (chosenDays.length === 0) {
    const defaults = {1:[3],2:[1,4],3:[1,3,5],4:[1,2,4,5],5:[1,2,3,5,6],6:[1,2,3,4,5,6]};
    chosenDays = (defaults[n0] || [1]).slice();
  } else if (chosenDays.length < n) {
    n = chosenDays.length;
  } else if (chosenDays.length > n) {
    const picked = [];
    for (let i = 0; i < n; i++) {
      picked.push(chosenDays[Math.round(i * chosenDays.length / n)]);
    }
    chosenDays = Array.from(new Set(picked)).sort((a,b)=>a-b);
  }
  n = chosenDays.length;

  const minutes = Number(profile.sessionMinutes) || 45;
  const K = minutes <= 30 ? 4 : minutes === 45 ? 5 : minutes === 60 ? 6 : 7;

  const templates = {
    FULL_A: { title: "Tüm vücut A", slots: ["squat","push_h","pull_h","hinge","push_v","core","arms_bi"] },
    FULL_B: { title: "Tüm vücut B", slots: ["hinge","push_v","pull_v","lunge","push_h","core","arms_tri"] },
    UPPER_A: { title: "Üst vücut A", slots: ["push_h","pull_h","push_v","pull_v","arms_bi","arms_tri","shoulder_iso"] },
    UPPER_B: { title: "Üst vücut B", slots: ["push_v","pull_v","push_h","pull_h","shoulder_iso","arms_tri","arms_bi"] },
    LOWER_A: { title: "Alt vücut A", slots: ["squat","hinge","lunge","calf","core","hinge","squat"] },
    LOWER_B: { title: "Alt vücut B", slots: ["hinge","squat","lunge","core","calf","lunge","core"] },
    PUSH: { title: "İtiş", slots: ["push_h","push_v","push_h","shoulder_iso","arms_tri","core","shoulder_iso"] },
    PULL: { title: "Çekiş", slots: ["pull_v","pull_h","hinge","arms_bi","pull_h","core","arms_bi"] },
    LEGS: { title: "Bacak", slots: ["squat","hinge","lunge","calf","core","squat","hinge"] }
  };

  const seqByN = {
    1: ["FULL_A"],
    2: ["FULL_A","FULL_B"],
    3: ["FULL_A","FULL_B","FULL_A"],
    4: ["UPPER_A","LOWER_A","UPPER_B","LOWER_B"],
    5: ["UPPER_A","LOWER_A","FULL_B","UPPER_B","LOWER_B"],
    6: ["PUSH","PULL","LEGS","PUSH","PULL","LEGS"]
  };
  const seq = (seqByN[n] || seqByN[3]).slice();

  // Ekipman varsa yüklü hareketler önce gelsin; vücut ağırlığı hareketleri yedek olarak kalsın.
  const available = availableExercises(profile).slice().sort((a, b) => Number(a.bodyweight) - Number(b.bodyweight));
  const counters = {};
  const usedByDay = {};
  const days = [];
  const chosenSet = new Set(chosenDays);

  const builtTemplates = {}; // aynı şablon (ör. Tüm vücut A) haftada tekrar ederse aynı hareketler kullanılsın
  for (let weekday = 1; weekday <= 7; weekday++) {
    if (!chosenSet.has(weekday)) {
      days.push({ weekday, type: "rest", title: "Dinlenme", warmup: "", exercises: [] });
      continue;
    }
    const idx = chosenDays.indexOf(weekday);
    const tmpl = templates[seq[idx]];
    const used = new Set();
    const exercises = [];

    const pick = (pattern) => {
      const all = available.filter(ex => ex.pattern === pattern && !used.has(ex.id));
      const loaded = all.filter(ex => !ex.bodyweight);
      const candidates = loaded.length ? loaded : all;
      if (!candidates.length) return null;
      const counter = counters[pattern] || 0;
      const chosen = candidates[counter % candidates.length];
      counters[pattern] = counter + 1;
      used.add(chosen.id);
      return chosen;
    };

    const slots = tmpl ? tmpl.slots.slice(0, K) : [];
    if (builtTemplates[seq[idx]]) {
      for (const pe of builtTemplates[seq[idx]]) exercises.push({ ...pe, uid: uid("pe") });
      days.push({ weekday, type: "workout", title: tmpl.title,
        warmup: "5–8 dk hafif kardiyo, eklem mobilitesi ve ilk harekete 1–2 hafif ısınma seti.", exercises });
      continue;
    }
    for (const slot of slots) {
      let ex = pick(slot);
      if (!ex && slot === "pull_v") ex = pick("pull_h");
      if (!ex && slot === "pull_h") ex = pick("pull_v");
      if (ex) {
        exercises.push({ uid: uid("pe"), exerciseId: ex.id, ...prescription(ex, profile.experience) });
      }
    }

    builtTemplates[seq[idx]] = exercises;
    days.push({
      weekday,
      type: "workout",
      title: tmpl ? tmpl.title : "Antrenman",
      warmup: "5–8 dk hafif kardiyo, eklem mobilitesi ve ilk harekete 1–2 hafif ısınma seti.",
      exercises
    });
  }

  return { createdAt: Date.now(), days };
}

function planDayFor(iso) {
  if (!APP.state || !APP.state.plan || !Array.isArray(APP.state.plan.days)) return null;
  return APP.state.plan.days.find(d => d.weekday === weekdayISO(iso)) || null;
}

function sessionsOn(iso) {
  return (APP.state.sessions || []).filter(s => s.date === iso);
}

function startSession(iso) {
  const existing = (APP.state.sessions || []).find(s => s.date === iso && s.status === "in_progress");
  if (existing) return existing;

  const planDay = planDayFor(iso);
  if (!planDay || planDay.type !== "workout") return null;

  const exercises = planDay.exercises.map(pe => {
    const ex = getExercise(pe.exerciseId);
    const perf = lastPerformance(pe.exerciseId);
    let weight = null;
    if (perf && Array.isArray(perf.sets)) {
      const nums = perf.sets.map(s => s.weight).filter(w => typeof w === "number" && isFinite(w) && w > 0);
      if (nums.length) weight = Math.max(...nums);
    }
    return {
      uid: uid("se"),
      exerciseId: pe.exerciseId,
      name: ex ? ex.name : "Silinmiş hareket",
      isBodyweight: ex ? Boolean(ex.bodyweight) : false,
      repMin: pe.repMin,
      repMax: pe.repMax,
      restSec: pe.restSec,
      sets: Array.from({ length: pe.sets }, () => ({ weight, reps: null, done: false })),
      effort: null,
      pain: false
    };
  });

  const session = {
    id: uid("s"),
    date: iso,
    title: planDay.title,
    startedAt: Date.now(),
    finishedAt: null,
    status: "in_progress",
    exercises
  };
  APP.state.sessions = APP.state.sessions || [];
  APP.state.sessions.push(session);
  return session;
}

function lastPerformance(exerciseId, excludeSessionId) {
  const sessions = (APP.state.sessions || []).filter(s => s.status === "done" && s.id !== excludeSessionId);
  sessions.sort((a,b) => {
    if (a.date !== b.date) return a.date < b.date ? 1 : -1;
    return (b.finishedAt || 0) - (a.finishedAt || 0);
  });

  for (const session of sessions) {
    const entry = (session.exercises || []).find(e => e.exerciseId === exerciseId && Array.isArray(e.sets) && e.sets.some(s => s.done));
    if (entry) {
      return {
        date: session.date,
        sets: entry.sets.filter(s => s.done).map(s => ({ weight: s.weight, reps: s.reps, done: true }))
      };
    }
  }
  return null;
}

function suggestProgression(entry) {
  if (!entry || entry.pain) return null;
  const sets = entry.sets || [];
  if (!sets.length) return null;
  if (sets.some(s => !s.done)) return null;
  if (sets.some(s => s.reps == null || s.reps < entry.repMax)) return null;
  if (entry.effort !== "easy" && entry.effort !== "ok") return null;

  const weights = sets.map(s => s.weight).filter(w => typeof w === "number" && isFinite(w) && w > 0);
  if (!weights.length) {
    return {
      type: "reps",
      fromKg: null,
      toKg: null,
      text: "Tüm setlerde üst tekrar sınırına ulaştın. Sonraki seansta set başına 1–2 tekrar ekleyebilir ya da daha zor bir varyasyon deneyebilirsin."
    };
  }

  const from = Math.max(...weights);
  const inc = (getExercise(entry.exerciseId) || {}).increment || 2.5;
  const to = round(from + inc, 2);
  return {
    type: "weight",
    fromKg: from,
    toKg: to,
    text: `Sonraki seansta ${fmtNum(to, 2)} kg deneyebilirsin (+${fmtNum(inc, 2)} kg). Bu yalnızca bir öneri; otomatik uygulanmaz.`
  };
}

// ===== CALC =====
const ACTIVITY = {
  sedentary: { factor: 1.2, label: "Hareketsiz (masa başı, çok az yürüyüş)" },
  light: { factor: 1.375, label: "Hafif aktif (hafif egzersiz, haftada 1–3 gün)" },
  moderate: { factor: 1.55, label: "Orta aktif (haftada 3–5 gün egzersiz)" },
  active: { factor: 1.725, label: "Çok aktif (haftada 6–7 gün yoğun egzersiz)" },
  very_active: { factor: 1.9, label: "Aşırı aktif (fiziksel iş + yoğun antrenman)" }
};

const GOALS = [["lose", "Yağ kaybı"], ["gain", "Kas kazanımı"], ["maintain", "Kiloyu koruma"]];
const EXPERIENCE = [["beginner", "Başlangıç"], ["intermediate", "Orta"], ["advanced", "İleri"]];
const DIETS = [["omnivore", "Her şeyi yerim"], ["pescatarian", "Pesketaryen"], ["vegetarian", "Vejetaryen"], ["vegan", "Vegan"]];
const ALLERGENS = [
  ["gluten", "Gluten"], ["milk", "Süt"], ["egg", "Yumurta"], ["nuts", "Sert kabuklu yemişler"],
  ["peanut", "Yer fıstığı"], ["soy", "Soya"], ["fish", "Balık"], ["sesame", "Susam"]
];
const ALLERGEN_NOTE = "Alerjen filtresi yalnızca bu listedeki yiyecekler için geçerlidir. Ürün etiketlerini ve çapraz bulaşma riskini her zaman kendin kontrol et.";

function autoBlockers(profile) {
  const out = [];
  if (!profile) return out;
  const age = Number(profile.age);
  if (Number.isFinite(age) && age < 18) {
    out.push("18 yaş altı için otomatik enerji açığı ve diyet planı oluşturulmaz.");
  }
  if (profile.pregnancy) {
    out.push("Gebelik veya emzirme döneminde otomatik enerji hedefi ve diyet planı oluşturulmaz.");
  }
  if (profile.medicalDiet) {
    out.push("Özel beslenme gerektiren bir sağlık durumu belirtildiği için otomatik plan oluşturulmaz.");
  }
  return out;
}

function calcEnergy(profile, weightKg) {
  const missing = [];
  const age = Number(profile && profile.age);
  const heightCm = Number(profile && profile.heightCm);
  const kg = Number(weightKg);
  const activity = profile && ACTIVITY[profile.activity];

  if (!Number.isFinite(age) || age <= 0) missing.push("Yaş");
  if (!Number.isFinite(heightCm) || heightCm <= 0) missing.push("Boy");
  if (!Number.isFinite(kg) || kg <= 0) missing.push("Kilo");
  if (!activity || !Number.isFinite(activity.factor)) missing.push("Aktivite düzeyi");

  if (missing.length) return { ok: false, missing };

  const sex = profile.sex;
  let bmr;
  const assumptions = [
    "Mifflin–St Jeor: 10 × kilo (kg) + 6,25 × boy (cm) − 5 × yaş + (erkek +5 / kadın −161)"
  ];

  if (sex === "male") {
    bmr = 10 * kg + 6.25 * heightCm - 5 * age + 5;
  } else if (sex === "female") {
    bmr = 10 * kg + 6.25 * heightCm - 5 * age - 161;
  } else {
    bmr = 10 * kg + 6.25 * heightCm - 5 * age - 78;
    assumptions.push("Cinsiyet belirtilmediği için erkek ve kadın formüllerinin ortalaması kullanıldı; sonuç daha belirsizdir.");
  }

  const tdee = bmr * activity.factor;

  assumptions.push(`Aktivite katsayısı: ${activity.factor} (${activity.label})`);
  assumptions.push("Sonuçlar tahminidir; kesin ihtiyaç veya tıbbi öneri değildir.");

  return { ok: true, bmr: round(bmr), factor: activity.factor, tdee: round(tdee), assumptions };
}

function macroKcal(p, f, c) {
  return round(Number(p || 0) * 4 + Number(f || 0) * 9 + Number(c || 0) * 4);
}

function suggestTargets(profile, weightKg) {
  if (autoBlockers(profile).length) return null;
  const energy = calcEnergy(profile, weightKg);
  if (!energy || !energy.ok) return null;

  const kg = Number(weightKg);
  const goal = profile && profile.goal;
  let kcalFactor = 1.0;
  let proteinFactor = 1.6;
  let goalNote = "Tahmini harcama düzeyi.";

  if (goal === "lose") {
    kcalFactor = 0.85;
    proteinFactor = 2.0;
    goalNote = "Tahmini harcamanın yaklaşık %15 altı (ölçülü açık).";
  } else if (goal === "gain") {
    kcalFactor = 1.07;
    proteinFactor = 1.8;
    goalNote = "Tahmini harcamanın yaklaşık %7 üstü (ölçülü fazla).";
  }

  let kcal = energy.tdee * kcalFactor;
  if (goal === "lose") kcal = Math.max(kcal, energy.bmr);
  kcal = Math.round(kcal / 10) * 10;

  const proteinG = round(kg * proteinFactor);
  const fatG = round((kcal * 0.27) / 9);
  let carbG = round((kcal - proteinG * 4 - fatG * 9) / 4);
  if (carbG < 50) carbG = 50;

  const finalKcal = macroKcal(proteinG, fatG, carbG);

  const notes = [
    goalNote,
    `Protein: ${fmtNum(proteinFactor, 1)} g/kg`,
    "Yağ: enerjinin yaklaşık %27'si",
    "Karbonhidrat: kalan enerji"
  ];

  return { kcal: finalKcal, proteinG, fatG, carbG, notes };
}

function allFoods() {
  const custom = (APP.state && APP.state.customFoods) || [];
  return FOODS.concat(custom);
}

function foodById(id) {
  if (id == null) return null;
  const foods = allFoods();
  for (let i = 0; i < foods.length; i++) {
    if (foods[i] && foods[i].id === id) return foods[i];
  }
  return null;
}

function nutritionFor(food, amount, unit) {
  const n = { kcal: 0, p: 0, f: 0, c: 0 };
  if (!food || !food.per100) return n;
  const amt = Number(amount);
  if (!Number.isFinite(amt) || amt <= 0) return n;

  let grams;
  if (unit === "portion" && food.portion && Number.isFinite(Number(food.portion.grams))) {
    grams = amt * Number(food.portion.grams);
  } else {
    grams = amt;
  }

  const k = grams / 100;
  n.kcal = round(Number(food.per100.kcal || 0) * k);
  n.p = round(Number(food.per100.p || 0) * k, 1);
  n.f = round(Number(food.per100.f || 0) * k, 1);
  n.c = round(Number(food.per100.c || 0) * k, 1);
  return n;
}

function dayTotals(iso) {
  const out = { count: 0, kcal: 0, p: 0, f: 0, c: 0 };
  const day = getDay(iso);
  if (!day || !Array.isArray(day.meals)) return out;

  out.count = day.meals.length;
  for (let i = 0; i < day.meals.length; i++) {
    const meal = day.meals[i];
    const snap = meal && meal.snap;
    if (!snap) continue;
    out.kcal += Number(snap.kcal || 0);
    out.p += Number(snap.p || 0);
    out.f += Number(snap.f || 0);
    out.c += Number(snap.c || 0);
  }

  out.kcal = round(out.kcal);
  out.p = round(out.p, 1);
  out.f = round(out.f, 1);
  out.c = round(out.c, 1);
  return out;
}

function foodAllowed(food, profile) {
  if (!food || !profile) return false;

  const foodAllergens = Array.isArray(food.allergens) ? food.allergens : [];
  const profileAllergens = Array.isArray(profile.allergens) ? profile.allergens : [];
  for (let i = 0; i < foodAllergens.length; i++) {
    if (profileAllergens.indexOf(foodAllergens[i]) !== -1) return false;
  }

  const diet = profile.diet;
  if (diet === "vegan" && food.diet !== "plant") return false;
  if (diet === "vegetarian" && (food.diet === "meat" || food.diet === "fish")) return false;
  if (diet === "pescatarian" && food.diet === "meat") return false;

  const disliked = Array.isArray(profile.disliked) ? profile.disliked : [];
  const name = String(food.name || "").toLocaleLowerCase("tr");
  for (let i = 0; i < disliked.length; i++) {
    const token = String(disliked[i] || "").trim().toLocaleLowerCase("tr");
    if (token.length >= 2 && name.indexOf(token) !== -1) return false;
  }

  return true;
}

function generateMenu(profile, targets) {
  const slots = { breakfast: [], lunch: [], dinner: [], snack: [] };
  const createdAt = Date.now();
  if (!targets || !Number.isFinite(Number(targets.proteinG)) || !Number.isFinite(Number(targets.carbG))) {
    return { createdAt, slots };
  }

  // Kuru (çiğ, yüksek enerjili) tahıl ve baklagiller menüde gramajı yanıltıcı olur; menüde pişmiş halleri kullanılır.
  const allowed = allFoods().filter(function (food) {
    if (food.state === "raw" && Number(food.per100 && food.per100.kcal) > 250 && (food.role === "carb" || food.role === "protein")) return false;
    return foodAllowed(food, profile);
  });

  const shares = { breakfast: 0.25, lunch: 0.30, dinner: 0.30, snack: 0.15 };
  const proteinTotal = Number(targets.proteinG || 0);
  const carbTotal = Number(targets.carbG || 0);

  const trName = function (s) {
    return String(s || "").toLocaleLowerCase("tr");
  };

  const stateScore = function (food) {
    return food.state === "cooked" || food.state === "ready" ? 2 : 0;
  };

  const usedVeg = [];
  const pick = function (candidates, excludeIds, slot, role) {
    let best = null;
    let bestScore = -Infinity;
    for (let i = 0; i < candidates.length; i++) {
      const food = candidates[i];
      if (!food) continue;
      if (excludeIds && excludeIds.indexOf(food.id) !== -1) continue;

      let score = stateScore(food);

      if (role === "protein-or-dairy") {
        if (food.role === "dairy" || food.diet === "egg" || food.diet === "dairy") score += 3;
        score += Number(food.per100 && food.per100.p || 0) / 4; // protein yoğun olan (yumurta, süzme yoğurt) öne çıksın
      }
      if (role === "veg" && usedVeg.indexOf(food.id) !== -1) score -= 3; // öğünler arasında sebze çeşitliliği

      if (role === "protein" && (food.diet === "meat" || food.diet === "fish")) score += 1;
      if (role === "fat" && trName(food.name).indexOf("zeytinyağı") !== -1) score += 2;

      if (role === "carb" && food.diet === "honey") score -= 10;
      if (role === "carb") {
        const n = trName(food.name);
        if (slot === "breakfast") {
          if (n.indexOf("yulaf") !== -1) score += 5;
          if (n.indexOf("ekmek") !== -1) score += 4;
          if (n.indexOf("tam tahıl") !== -1) score += 2;
          if (n.indexOf("bulgur") !== -1) score += 1;
        } else {
          if (n.indexOf("bulgur") !== -1) score += 2;
          if (n.indexOf("pirinç") !== -1) score += 2;
          if (n.indexOf("makarna") !== -1) score += 1;
        }
      }

      if (score > bestScore || (score === bestScore && best && food.name.localeCompare(best.name, "tr") < 0)) {
        best = food;
        bestScore = score;
      }
    }
    return best;
  };

  const candidatesFor = function (slot, role) {
    if (slot === "breakfast" && role === "protein-or-dairy") {
      return allowed.filter(function (f) {
        return f.role === "protein" || f.role === "dairy" || f.diet === "egg" || f.diet === "dairy";
      });
    }
    if (role === "protein") return allowed.filter(function (f) { return f.role === "protein"; });
    if (role === "carb") return allowed.filter(function (f) { return f.role === "carb"; });
    if (role === "veg") return allowed.filter(function (f) { return f.role === "veg"; });
    if (role === "fat") return allowed.filter(function (f) { return f.role === "fat"; });
    if (role === "fruit") return allowed.filter(function (f) { return f.role === "fruit"; });
    if (role === "nuts-or-dairy") return allowed.filter(function (f) { return f.role === "nuts" || f.role === "dairy"; });
    return [];
  };

  const round5 = function (value, min, max, fallback) {
    let v = Number(value);
    if (!Number.isFinite(v)) v = Number(fallback);
    if (!Number.isFinite(v)) v = 0;
    v = Math.round(v / 5) * 5;
    return Math.max(min, Math.min(max, v));
  };

  const isDairyLike = function (food) {
    return food.role === "dairy" || food.diet === "dairy";
  };

  const proteinGramsFor = function (food, slot) {
    const p100 = Number(food.per100 && food.per100.p);
    const target = proteinTotal * shares[slot] * 0.6;
    if (!Number.isFinite(p100) || p100 <= 0) return 100;
    return (target * 100) / p100;
  };

  const carbGramsFor = function (food, slot) {
    const c100 = Number(food.per100 && food.per100.c);
    const target = carbTotal * shares[slot] * 0.7;
    if (!Number.isFinite(c100) || c100 <= 0) return 100;
    return (target * 100) / c100;
  };

  const portionGrams = function (food, fallback) {
    const p = food.portion ? Number(food.portion.grams) : NaN;
    return Number.isFinite(p) && p > 0 ? p : fallback;
  };

  const addIfFood = function (slotKey, role, candidates, excludeIds) {
    const food = pick(candidates, excludeIds || [], slotKey, role);
    if (!food) return null;

    let grams;
    if (role === "protein-or-dairy" && slotKey === "breakfast") {
      grams = isDairyLike(food)
        ? portionGrams(food, 150)
        : proteinGramsFor(food, slotKey);
      grams = round5(grams, 50, 250, 100);
    } else if (role === "protein") {
      grams = round5(proteinGramsFor(food, slotKey), 50, 250, 100);
    } else if (role === "carb") {
      grams = round5(carbGramsFor(food, slotKey), 30, 300, 100);
    } else if (role === "veg") {
      grams = round5(150, 50, 300, 150);
    } else if (role === "fat") {
      grams = round5(10, 5, 30, 10);
    } else if (role === "fruit") {
      grams = round5(portionGrams(food, 150), 50, 300, 150);
    } else if (role === "nuts-or-dairy") {
      if (food.role === "nuts") {
        grams = round5(20, 10, 50, 20);
      } else {
        grams = round5(portionGrams(food, 150), 50, 300, 150);
      }
    } else {
      grams = 0;
    }

    if (grams > 0) {
      if (role === "veg") usedVeg.push(food.id);
      slots[slotKey].push({ foodId: food.id, grams, role: role === "protein-or-dairy" ? "protein" : role });
      return food;
    }
    return null;
  };

  // Breakfast
  const breakfastUsed = [];
  const breakfastProtein = addIfFood("breakfast", "protein-or-dairy", candidatesFor("breakfast", "protein-or-dairy"), breakfastUsed);
  addIfFood("breakfast", "carb", candidatesFor("breakfast", "carb"), breakfastUsed);
  addIfFood("breakfast", "veg", candidatesFor("breakfast", "veg"), breakfastUsed);
  addIfFood("breakfast", "fat", candidatesFor("breakfast", "fat"), breakfastUsed);

  // Lunch
  const lunchUsed = breakfastProtein ? [breakfastProtein.id] : [];
  const lunchProtein = addIfFood("lunch", "protein", candidatesFor("lunch", "protein"), lunchUsed);
  const lunchCarb = addIfFood("lunch", "carb", candidatesFor("lunch", "carb"), lunchUsed);
  addIfFood("lunch", "veg", candidatesFor("lunch", "veg"), lunchUsed);
  addIfFood("lunch", "fat", candidatesFor("lunch", "fat"), lunchUsed);

  // Dinner
  const dinnerUsed = [];
  const dinnerProteinExclude = [lunchProtein, breakfastProtein].filter(Boolean).map(function (f) { return f.id; });
  const dinnerCarbExclude = lunchCarb ? [lunchCarb.id] : [];
  addIfFood("dinner", "protein", candidatesFor("dinner", "protein"), dinnerProteinExclude);
  addIfFood("dinner", "carb", candidatesFor("dinner", "carb"), dinnerCarbExclude);
  addIfFood("dinner", "veg", candidatesFor("dinner", "veg"), dinnerUsed);
  addIfFood("dinner", "fat", candidatesFor("dinner", "fat"), dinnerUsed);

  // Snack
  const snackUsed = [];
  addIfFood("snack", "fruit", candidatesFor("snack", "fruit"), snackUsed);
  addIfFood("snack", "nuts-or-dairy", candidatesFor("snack", "nuts-or-dairy"), snackUsed);

  // Miktarları hedefe yaklaştır: önce protein kaynaklarını, sonra kalan enerjiye göre karbonhidratları ölçekle.
  const allItems = [].concat(slots.breakfast, slots.lunch, slots.dinner, slots.snack);
  const sumOf = function (filterFn, key) {
    let t = 0;
    allItems.filter(filterFn).forEach(function (it) {
      const f = foodById(it.foodId);
      if (f) t += nutritionFor(f, it.grams, "g")[key];
    });
    return t;
  };
  const isP = function (it) { return it.role === "protein"; };
  const isC = function (it) { return it.role === "carb"; };
  const otherP = sumOf(function (it) { return !isP(it); }, "p");
  const curP = sumOf(isP, "p");
  if (curP > 0) {
    const k = Math.max(0.7, Math.min(1.8, (proteinTotal - otherP) / curP));
    allItems.filter(isP).forEach(function (it) { it.grams = round5(it.grams * k, 50, 300, it.grams); });
  }
  const kcalTarget = Number(targets.kcal || 0);
  const nonCarbKcal = sumOf(function (it) { return !isC(it); }, "kcal");
  const carbKcal = sumOf(isC, "kcal");
  if (carbKcal > 0 && kcalTarget > 0) {
    const k = Math.max(0.5, Math.min(2.2, (kcalTarget - nonCarbKcal) / carbKcal));
    allItems.filter(isC).forEach(function (it) { it.grams = round5(it.grams * k, 30, 450, it.grams); });
  }
  allItems.forEach(function (it) { delete it.role; });

  return { createdAt, slots };
}

function menuTotals(menu) {
  const out = { kcal: 0, p: 0, f: 0, c: 0 };
  if (!menu || !menu.slots) return out;

  const slotKeys = ["breakfast", "lunch", "dinner", "snack"];
  for (let s = 0; s < slotKeys.length; s++) {
    const items = menu.slots[slotKeys[s]] || [];
    for (let i = 0; i < items.length; i++) {
      const item = items[i];
      if (!item) continue;
      const food = foodById(item.foodId);
      if (!food) continue;
      const n = nutritionFor(food, item.grams, "g");
      out.kcal += n.kcal;
      out.p += n.p;
      out.f += n.f;
      out.c += n.c;
    }
  }

  out.kcal = round(out.kcal);
  out.p = round(out.p, 1);
  out.f = round(out.f, 1);
  out.c = round(out.c, 1);
  return out;
}

function shoppingList(menu, days) {
  const out = [];
  if (!menu || !menu.slots) return out;
  const d = Number.isFinite(Number(days)) ? Number(days) : 1;

  const map = Object.create(null);
  const slotKeys = ["breakfast", "lunch", "dinner", "snack"];

  for (let s = 0; s < slotKeys.length; s++) {
    const items = menu.slots[slotKeys[s]] || [];
    for (let i = 0; i < items.length; i++) {
      const item = items[i];
      if (!item) continue;
      const food = foodById(item.foodId);
      if (!food) continue;
      const g = Number(item.grams || 0) * d;
      if (!Number.isFinite(g)) continue;
      if (!map[item.foodId]) {
        map[item.foodId] = { foodId: item.foodId, name: food.name, state: food.state, grams: 0 };
      }
      map[item.foodId].grams += g;
    }
  }

  for (const key in map) {
    if (Object.prototype.hasOwnProperty.call(map, key)) {
      const row = map[key];
      row.grams = round(row.grams);
      out.push(row);
    }
  }

  out.sort(function (a, b) {
    return String(a.name).localeCompare(String(b.name), "tr");
  });

  return out;
}

function weightsInRange(fromIso, toIso) {
  const weights = (APP.state && APP.state.weights) || [];
  const out = [];
  for (let i = 0; i < weights.length; i++) {
    const w = weights[i];
    if (!w || !Number.isFinite(Number(w.kg))) continue;
    if (fromIso && w.date < fromIso) continue;
    if (toIso && w.date > toIso) continue;
    out.push(w);
  }
  return out;
}

function avg7Weight(iso) {
  if (!iso) return null;
  const from = addDays(iso, -6);
  const list = weightsInRange(from, iso);
  if (list.length < 3) return null;
  let sum = 0;
  for (let i = 0; i < list.length; i++) sum += Number(list[i].kg);
  return round(sum / list.length, 1);
}

function metricSeries(field, fromIso, toIso) {
  const days = (APP.state && APP.state.days) || {};
  const out = [];
  const keys = Object.keys(days).sort();

  for (let i = 0; i < keys.length; i++) {
    const date = keys[i];
    if (fromIso && date < fromIso) continue;
    if (toIso && date > toIso) continue;
    const day = days[date];
    if (!day) continue;
    const value = day[field];
    if (value == null) continue;
    const v = Number(value);
    if (!Number.isFinite(v)) continue;
    out.push({ date, value: v });
  }

  return out;
}

function sessionsPerWeek(fromIso, toIso) {
  const sessions = (APP.state && APP.state.sessions) || [];
  const counts = Object.create(null);

  for (let i = 0; i < sessions.length; i++) {
    const s = sessions[i];
    if (!s || s.status !== "done" || !s.date) continue;
    if (fromIso && s.date < fromIso) continue;
    if (toIso && s.date > toIso) continue;
    const ws = startOfWeek(s.date);
    counts[ws] = (counts[ws] || 0) + 1;
  }

  const keys = Object.keys(counts).sort();
  if (keys.length === 0) return [];

  let out;
  if (fromIso != null && keys.length > 1) {
    const first = keys[0];
    const last = keys[keys.length - 1];
    out = [];
    let ws = first;
    while (ws <= last) {
      out.push({ weekStart: ws, count: counts[ws] || 0 });
      ws = addDays(ws, 7);
    }
  } else {
    out = keys.map(function (ws) {
      return { weekStart: ws, count: counts[ws] };
    });
  }

  return out;
}

function exerciseHistory(exerciseId) {
  const sessions = (APP.state && APP.state.sessions) || [];
  const done = sessions.filter(function (s) {
    return s && s.status === "done" && s.date;
  }).sort(function (a, b) {
    if (a.date < b.date) return -1;
    if (a.date > b.date) return 1;
    return Number(a.startedAt || 0) - Number(b.startedAt || 0);
  });

  const out = [];
  for (let i = 0; i < done.length; i++) {
    const session = done[i];
    const exs = session.exercises || [];
    for (let j = 0; j < exs.length; j++) {
      const ex = exs[j];
      if (!ex || ex.exerciseId !== exerciseId) continue;

      const sets = ex.sets || [];
      const doneSets = sets.filter(function (set) {
        return set && set.done === true;
      });

      if (doneSets.length === 0) continue;

      let topWeight = null;
      let repsAtTop = null;
      let totalReps = 0;

      for (let k = 0; k < doneSets.length; k++) {
        const set = doneSets[k];
        const w = Number(set.weight);
        const r = Number(set.reps);
        if (Number.isFinite(r)) totalReps += r;
        if (Number.isFinite(w)) {
          if (topWeight === null || w > topWeight) {
            topWeight = w;
            repsAtTop = Number.isFinite(r) ? r : null;
          } else if (w === topWeight && Number.isFinite(r)) {
            if (repsAtTop === null || r > repsAtTop) repsAtTop = r;
          }
        }
      }

      out.push({
        date: session.date,
        topWeight: topWeight === null ? null : round(topWeight, 1),
        repsAtTop,
        totalReps: round(totalReps),
        sets: doneSets
      });
    }
  }

  return out;
}

function weeklyReview(weekStartIso) {
  const weekEnd = addDays(weekStartIso, 6);
  const prevStart = addDays(weekStartIso, -7);
  const prevEnd = addDays(weekStartIso, -1);

  const plan = APP.state && APP.state.plan;
  // Yalnızca bugüne kadar gelmiş günlerdeki planlı seanslar sayılır (hafta ortasında eksik gösterilmesin).
  let planned = 0;
  if (plan && Array.isArray(plan.days)) {
    const today = todayISO();
    for (let i = 0; i <= 6; i++) {
      const date = addDays(weekStartIso, i);
      if (date > today) break;
      const pd = plan.days.find(function (d) { return d && d.weekday === weekdayISO(date); });
      if (pd && pd.type === "workout") planned++;
    }
  }

  const sessions = (APP.state && APP.state.sessions) || [];
  let completed = 0;
  for (let i = 0; i < sessions.length; i++) {
    const s = sessions[i];
    if (!s || s.status !== "done" || !s.date) continue;
    if (s.date >= weekStartIso && s.date <= weekEnd) completed++;
  }

  const days = (APP.state && APP.state.days) || {};
  const weights = (APP.state && APP.state.weights) || [];

  const dates = [];
  for (let i = 0; i <= 6; i++) dates.push(addDays(weekStartIso, i));

  let loggedDays = 0;
  const sleepValues = [];
  const stepValues = [];
  const weekWeights = [];
  const prevWeights = [];

  for (let i = 0; i < dates.length; i++) {
    const date = dates[i];
    const day = days[date];
    let hasDayRecord = false;

    if (day) {
      hasDayRecord = (day.waterMl != null && Number.isFinite(Number(day.waterMl))) ||
        (day.steps != null && Number.isFinite(Number(day.steps))) ||
        (day.sleepHours != null && Number.isFinite(Number(day.sleepHours))) ||
        (day.energy != null && Number.isFinite(Number(day.energy))) ||
        (day.soreness != null && Number.isFinite(Number(day.soreness))) ||
        String(day.note || "").trim().length > 0 ||
        Array.isArray(day.meals) && day.meals.length > 0;

      if (day.sleepHours != null && Number.isFinite(Number(day.sleepHours))) {
        sleepValues.push(Number(day.sleepHours));
      }
      if (day.steps != null && Number.isFinite(Number(day.steps))) {
        stepValues.push(Number(day.steps));
      }
    }

    const dayWeights = weights.filter(function (w) {
      return w && w.date === date && Number.isFinite(Number(w.kg));
    });
    if (dayWeights.length > 0) hasDayRecord = true;

    const daySessions = sessions.filter(function (s) {
      return s && s.status === "done" && s.date === date;
    });
    if (daySessions.length > 0) hasDayRecord = true;

    if (hasDayRecord) loggedDays++;

    for (let j = 0; j < dayWeights.length; j++) weekWeights.push(Number(dayWeights[j].kg));
  }

  for (let i = 0; i < weights.length; i++) {
    const w = weights[i];
    if (!w || !Number.isFinite(Number(w.kg))) continue;
    if (w.date >= prevStart && w.date <= prevEnd) prevWeights.push(Number(w.kg));
  }

  const avg = function (arr) {
    if (!arr.length) return null;
    let sum = 0;
    for (let i = 0; i < arr.length; i++) sum += arr[i];
    return sum / arr.length;
  };

  const weightAvg = weekWeights.length >= 3 ? round(avg(weekWeights), 1) : null;
  const prevWeightAvg = prevWeights.length >= 3 ? round(avg(prevWeights), 1) : null;
  const weightChange = (weightAvg != null && prevWeightAvg != null) ? round(weightAvg - prevWeightAvg, 1) : null;

  const sleepDays = sleepValues.length;
  const stepsDays = stepValues.length;
  const sleepAvg = sleepDays >= 3 ? round(avg(sleepValues), 1) : null;
  const stepsAvg = stepsDays >= 3 ? round(avg(stepValues)) : null;

  const insufficient = [];
  if (weightChange == null) {
    insufficient.push("Kilo değişimi için yeterli veri yok (iki haftada da en az 3 tartı kaydı gerekir).");
  }
  if (sleepAvg == null) {
    insufficient.push("Uyku ortalaması için en az 3 günlük kayıt gerekir.");
  }
  if (stepsAvg == null) {
    insufficient.push("Adım ortalaması için en az 3 günlük kayıt gerekir.");
  }

  const summaryParts = [];
  summaryParts.push(`Planlanan seans: ${planned}; kaydedilen: ${completed}.`);
  summaryParts.push(`Haftada ${loggedDays} gün kayıt var.`);
  if (weightAvg != null) summaryParts.push(`Haftalık ortalama kilo: ${fmtNum(weightAvg, 1)} kg.`);
  if (prevWeightAvg != null) summaryParts.push(`Önceki haftalık ortalama kilo: ${fmtNum(prevWeightAvg, 1)} kg.`);
  if (weightChange != null) summaryParts.push(`Ortalama kilo değişimi: ${fmtNum(weightChange, 1)} kg.`);
  if (sleepAvg != null) summaryParts.push(`Ortalama uyku: ${fmtNum(sleepAvg, 1)} saat (${sleepDays} gün).`);
  if (stepsAvg != null) summaryParts.push(`Ortalama adım: ${fmtNum(stepsAvg)} adım (${stepsDays} gün).`);

  const suggestions = [];
  const profile = APP.state && APP.state.profile;

  if (planned > 0 && completed < planned) {
    suggestions.push(`Planlanan ${planned} seansın ${completed} tanesi kaydedildi. Gelecek hafta için gün sayısını gerçekçi tutmak ya da seansları kısaltmak işini kolaylaştırabilir.`);
  }

  if (sleepAvg != null && sleepAvg < 7) {
    suggestions.push(`Ortalama uyku ${fmtNum(sleepAvg, 1)} saat. Yatış saatini 15–30 dakika öne çekmeyi deneyebilirsin.`);
  }

  if (stepsAvg != null && stepsAvg < 7000) {
    suggestions.push(`Günlük adım ortalaması ${fmtNum(stepsAvg)}. Gün içine 10–15 dakikalık bir yürüyüş eklemek kolay bir başlangıç olabilir.`);
  }

  if (loggedDays < 4) {
    suggestions.push("Daha net bir değerlendirme için haftada en az 4 gün kayıt girmeyi deneyebilirsin.");
  }

  const goal = profile && profile.goal;
  if (weightChange != null && ((goal === "lose" && weightChange > 0.3) || (goal === "gain" && weightChange < -0.2))) {
    suggestions.push("Haftalık kilo ortalaması hedefinin tersi yönde değişti. Tek haftalık değişim yanıltıcı olabilir; bir hafta daha gözlemleyip öğün kayıtlarını gözden geçirmek yeterli olabilir.");
  }

  if (suggestions.length === 0) {
    suggestions.push("Mevcut düzenini sürdürmek iyi bir seçenek görünüyor.");
  }

  const finalSuggestions = suggestions.slice(0, 3);

  return {
    weekStart: weekStartIso,
    weekEnd,
    planned,
    completed,
    loggedDays,
    weightAvg,
    prevWeightAvg,
    weightChange,
    sleepAvg,
    sleepDays,
    stepsAvg,
    stepsDays,
    insufficient,
    summary: summaryParts.join(" "),
    suggestions: finalSuggestions,
    enough: loggedDays > 0
  };
}
