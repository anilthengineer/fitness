function renderOnboarding(root) {
  clear(root);

  const backupInput = h("input", {
    type: "file",
    accept: ".json,application/json",
    attrs: { id: "onboarding-backup" },
    style: { display: "none" }
  });

  const notice = h(
    "div",
    { class: "notice notice-info" },
    h("span", { text: "Daha önce yedek aldıysan " }),

      svgIcon("upload"),
      h("span", { text: "Yedekten geri yükle" })
    ),
    backupInput
  );

  backupInput.addEventListener("change", () => {
    const file = backupInput.files && backupInput.files[0];

    backupInput.value = "";
  });

  const form = profileForm(null, (p, weightKg) => {
    APP.state.profile = p;

    APP.state.plan = generatePlan(p);

  root.appendChild(el);
}

    const locationChecked = locationGroup.querySelector("input:checked");
    if (!locationChecked) {
      setFieldError(firstInputOf(locationGroup), "Bir seçenek seç.");
      firstInvalid = firstInvalid || firstInputOf(locationGroup);
    }

    const dietInput = form.querySelector("#pf-diet");
    const diet = dietInput.value;
    if (!diet) {
      setFieldError(dietInput, "Bir seçenek seç.");
      firstInvalid = firstInvalid || dietInput;
    }

    const targetInput = form.querySelector("#pf-targetWeight");
    let targetWeightKg = null;
    const targetRaw = parseNum(targetInput.value);
    if (targetRaw != null) {
      if (!isFiniteNumber(targetRaw) || targetRaw < 30 || targetRaw > 300) {
        setFieldError(targetInput, "Hedef kilo 30–300 kg arasında olmalı.");
        firstInvalid = firstInvalid || targetInput;
      } else {
        targetWeightKg = targetRaw;
      }
    }

    if (firstInvalid) {
      firstInvalid.focus();
      return;
    }

    const equipmentValues = readChecks(equipmentGroup, "pf-equipment");
    const equipment = equipmentOptions.map(([id]) => id).filter(id => equipmentValues.includes(id));
    const allergens = readChecks(allergenGroup, "pf-allergens");
    const disliked = form.querySelector("#pf-disliked").value.split(",").map(s => s.trim()).filter(Boolean);
    const limitations = form.querySelector("#pf-limitations").value.trim();

    const newProfile = {
      age: Number(age),
      heightCm: Number(heightCm),
      weightKg: profile && Number.isFinite(profile.weightKg) ? profile.weightKg : Number(weightKg),
      sex: sexChecked.value,
      goal: goalChecked.value,
      experience: experienceChecked.value,
      activity: activity,
      trainingDays: Number(trainingDays),
      availableDays: availableDays,
      sessionMinutes: Number(sessionMinutes),
      location: locationChecked.value,
      equipment: equipment,
      diet: diet,
      allergens: allergens,
      disliked: disliked,
      limitations: limitations,
      pregnancy: form.querySelector("#pf-pregnancy").checked,
      medicalDiet: form.querySelector("#pf-medicalDiet").checked,
      targetWeightKg: targetWeightKg,
      createdAt: profile && profile.createdAt ? profile.createdAt : Date.now(),
      updatedAt: Date.now()
    };

    onSave(newProfile, Number(weightKg));
  }

  return form;
}

      const prevWeight = currentWeight();
      if (kg != null && Number.isFinite(kg) && (prevWeight == null || Math.abs(kg - prevWeight) > 0.001)) {
        upsertWeight(todayISO(), kg);
      }

      const trainingChanged = !oldProfile
        || oldProfile.trainingDays !== p.trainingDays
        || !sameArray(oldProfile.availableDays, p.availableDays)
        || oldProfile.sessionMinutes !== p.sessionMinutes

        || !sameArray(oldProfile.equipment, p.equipment)

      APP.state.profile = p;

      const t = suggestTargets(p, kg);
      if (!APP.state.nutrition.targets || APP.state.nutrition.targets.source === "auto") {

      if (trainingChanged) {

function groupWrap(groupEl, hint) {
  const first = groupEl.querySelector("input");
  const err = h("p", { class: "error", role: "alert", hidden: true, id: first ? first.id + "-err" : undefined });
  const wrap = h("div", { class: "field wide" }, groupEl);
  if (hint) wrap.appendChild(h("p", { class: "hint" }, hint));
  wrap.appendChild(err);
  return wrap;
}

function firstInputOf(el) {
  return el ? el.querySelector("input") : null;
}

function isFiniteNumber(n) {
  return n != null && Number.isFinite(n);
}

function sameArray(a, b) {
  if (!Array.isArray(a) || !Array.isArray(b)) return false;
  if (a.length !== b.length) return false;
  const x = a.slice().sort((l, r) => String(l).localeCompare(String(r)));
  const y = b.slice().sort((l, r) => String(l).localeCompare(String(r)));
  return x.every((v, i) => v === y[i]);
}

function svgIcon(name) {
  if (typeof icon === "function") return icon(name);
  return svgEl("svg", { width: "24", height: "24", viewBox: "0 0 24 24", "aria-hidden": "true" });
}

function filePickerKey(e) {
  if (e.key === "Enter" || e.key === " ") {
    e.preventDefault();
    const input = document.getElementById(e.currentTarget.htmlFor);
    if (input) input.click();
  }
}

// ===== TODAY =====
function renderToday(root) {
  clear(root);

  if (!APP.state || !APP.state.profile) {
    root.appendChild(
      card({ title: "Bugün" }, emptyState("Profil gerekli", "Görüntüleme için önce profil oluşturmalısın.", null))
    );
    return;
  }

  const date = APP.ui.date;
  const day = getDay(date);
  const today = todayISO();
  const isFuture = date > today;

  root.appendChild(datePager());

  const grid = h("div", { class: "grid" });
  root.appendChild(grid);

  function makeButton(label, cls, onClick) {
    return h("button", { type: "button", class: cls || "btn", on: { click: onClick } }, label);
  }

  // 1. Antrenman card
  const planDay = planDayFor(date);
  const sessions = sessionsOn(date);
  const doneSession = sessions.find(function (s) { return s.status === "done"; });
  const inProgressSession = sessions.find(function (s) { return s.status === "in_progress"; });

  const workoutChildren = [];
  if (!planDay) {
    workoutChildren.push(
      emptyState(
        "Plan yok",
        "Profilinden haftalık plan oluşturulabilir.",
        makeButton("Plan oluştur", "btn", function () { navigate("workout", "plan"); })
      )
    );
  } else if (planDay.type === "rest") {
    workoutChildren.push(
      h("div", { class: "row" }, h("span", { class: "badge" }, "Dinlenme günü")),
      h("p", { class: "muted small" }, "Hafif yürüyüş veya esneme yapılabilir.")
    );
  } else {
    workoutChildren.push(h("p", { class: "small" }, planDay.title));
    const exList = h("ul", { class: "list" });
    (planDay.exercises || []).forEach(function (ex) {
      const exercise = getExercise(ex.exerciseId);
      const name = exercise ? exercise.name : "Bilinmeyen hareket";
      exList.appendChild(
        h("li", { class: "list-item" },
          h("div", { class: "li-main" },
            h("span", { class: "li-title" }, name),
            h("span", { class: "li-sub small muted" }, ex.sets + " × " + ex.repMin + "–" + ex.repMax)
          )
        )
      );
    });
    workoutChildren.push(exList);

    const actionRow = h("div", { class: "row" });
    if (doneSession) {
      actionRow.appendChild(h("span", { class: "badge-ok badge" }, "Tamamlandı"));
      actionRow.appendChild(
        makeButton("Seansı görüntüle", "btn", function () { navigate("workout", "session"); })
      );
    } else if (inProgressSession) {
      actionRow.appendChild(
        makeButton("Antrenmana devam et", "btn btn-primary", function () { navigate("workout", "session"); })
      );
    } else {
      actionRow.appendChild(
        makeButton("Antrenmana başla", "btn btn-primary", function () {
          startSession(date);
          saveState();
          navigate("workout", "session");
        })
      );
    }
    workoutChildren.push(actionRow);
  }
  grid.appendChild(card({ title: "Antrenman" }, ...workoutChildren));

  // 2. Beslenme card
  const totals = dayTotals(date);
  const targets = APP.state.nutrition.targets;
  const nutritionChildren = [];

  if (totals.count === 0) {
    nutritionChildren.push(
      emptyState(
        "Öğün kaydı yok",
        "Bu gün için henüz öğün kaydedilmedi.",
        makeButton("Öğün ekle", "btn", function () { navigate("nutrition", "log"); })
      )
    );
  } else {
    const stats = h("div", { class: "stats" });
    function stat(label, value, digits, sub) {
      const el = h("div", { class: "stat" },
        h("div", { class: "stat-label" }, label),
        h("div", { class: "stat-value" }, fmtNum(value, digits === undefined ? 0 : digits))
      );
      if (sub) el.appendChild(h("div", { class: "stat-sub" }, sub));
      return el;
    }
    stats.appendChild(stat("Enerji (kcal)", totals.kcal, 0, targets ? "/ hedef " + fmtNum(targets.kcal, 0) : null));
    stats.appendChild(stat("Protein (g)", totals.p, 1, targets ? "/ hedef " + fmtNum(targets.proteinG, 0) : null));
    stats.appendChild(stat("Yağ", totals.f, 1, targets ? "/ hedef " + fmtNum(targets.fatG, 0) : null));
    stats.appendChild(stat("Karbonhidrat", totals.c, 1, targets ? "/ hedef " + fmtNum(targets.carbG, 0) : null));
    nutritionChildren.push(stats);

    function makeMeter(label, value, target) {
      if (!target || target <= 0) return null;
      const pct = Math.min(100, (value / target) * 100);
      const over = value > target * 1.1;
      return h("div", {
        class: over ? "meter over" : "meter",
        attrs: {
          role: "progressbar",
          "aria-valuemin": "0",
          "aria-valuemax": String(target),
          "aria-valuenow": String(Math.round(value)),
          "aria-label": label
        }
      }, h("div", { class: "meter-bar", style: { width: pct + "%" } }));
    }
    const energyMeter = makeMeter("Enerji hedefi", totals.kcal, targets ? targets.kcal : null);
    if (energyMeter) nutritionChildren.push(energyMeter);
    const proteinMeter = makeMeter("Protein hedefi", totals.p, targets ? targets.proteinG : null);
    if (proteinMeter) nutritionChildren.push(proteinMeter);

    const mealsList = h("div", { class: "list" });
    SLOTS.forEach(function (pair) {
      const slotId = pair[0];
      const slotLabel = pair[1];
      const meals = day && Array.isArray(day.meals) ? day.meals.filter(function (m) { return m.slot === slotId; }) : [];
      const kcal = meals.reduce(function (sum, m) {
        return sum + (m.snap && typeof m.snap.kcal === "number" ? m.snap.kcal : 0);
      }, 0);
      const sub = meals.length > 0 ? meals.length + " kayıt, " + fmtNum(kcal, 0) + " kcal" : "Kayıt yok";
      mealsList.appendChild(
        h("div", { class: "list-item" },
          h("div", { class: "li-main" },
            h("span", { class: "li-title" }, slotLabel),
            h("span", { class: "li-sub small muted" }, sub)
          )
        )
      );
    });
    nutritionChildren.push(mealsList);
    nutritionChildren.push(
      makeButton("Öğünleri düzenle", "btn", function () { navigate("nutrition", "log"); })
    );
    nutritionChildren.push(h("p", { class: "small muted" }, "Değerler yaklaşıktır."));
  }
  grid.appendChild(card({ title: "Beslenme" }, ...nutritionChildren));

  // 3. Günlük kayıtlar card
  const form = h("form", { class: "form" });

  const waterInput = numberInput({
    id: "td-water",
    value: day && day.waterMl != null ? String(day.waterMl) : "",
    min: 0,
    max: 10000,
    step: 50,
    placeholder: "ml"
  });
  const stepsInput = numberInput({
    id: "td-steps",
    value: day && day.steps != null ? String(day.steps) : "",
    min: 0,
    max: 100000,
    step: 1,
    placeholder: "adım"
  });
  const sleepInput = numberInput({
    id: "td-sleep",
    value: day && day.sleepHours != null ? String(day.sleepHours) : "",
    min: 0,
    max: 24,
    step: 0.25,
    placeholder: "saat"
  });

  const waterField = field({ label: "Su (ml)", input: waterInput });
  const stepsField = field({ label: "Adım", input: stepsInput });
  const sleepField = field({ label: "Uyku (saat)", input: sleepInput });

  const energyOptions = [
    ["", "Boş"],
    ["1", "1 Çok düşük"],
    ["2", "2 Düşük"],
    ["3", "3 Orta"],
    ["4", "4 İyi"],
    ["5", "5 Çok iyi"]
  ];
  const sorenessOptions = [
    ["", "Boş"],
    ["0", "Yok"],
    ["1", "Hafif"],
    ["2", "Orta"],
    ["3", "Belirgin"]
  ];

  const energySeg = segGroup({
    name: "td-energy",
    legend: "Enerji düzeyi",
    options: energyOptions,
    value: day && day.energy != null ? String(day.energy) : ""
  });
  const sorenessSeg = segGroup({
    name: "td-soreness",
    legend: "Kas ağrısı",
    options: sorenessOptions,
    value: day && day.soreness != null ? String(day.soreness) : ""
  });

  const noteValue = day ? (day.note || "") : "";
  const noteInput = h("textarea", {
    id: "td-note",
    class: "input",
    rows: 3,
    maxlength: 500,
    placeholder: "Bugüne dair kısa not",
    value: noteValue
  });
  const noteCounter = h("span", { class: "small muted" }, noteValue.length + "/500");
  noteInput.oninput = function () {
    noteCounter.textContent = noteInput.value.length + "/500";
  };

  const energyWrap = h("div", { class: "field wide" }, energySeg);
  const sorenessWrap = h("div", { class: "field wide" }, sorenessSeg);
  const noteField = field({ label: "Not", input: noteInput, wide: true });
  noteField.appendChild(noteCounter);

  const quickWater = h("div", { class: "row" });
  function addWater(amount) {
    const raw = waterInput.value.trim();
    let current = 0;
    if (raw !== "") {
      const parsed = parseNum(raw);
      if (typeof parsed === "number" && !Number.isNaN(parsed)) current = parsed;
    }
    waterInput.value = String(current + amount);
    clearFieldErrors(form);
  }
  quickWater.appendChild(makeButton("+250 ml", "btn btn-sm", function () { addWater(250); }));
  quickWater.appendChild(makeButton("+500 ml", "btn btn-sm", function () { addWater(500); }));
  waterField.appendChild(quickWater);

  const formActions = h("div", { class: "form-actions" });
  formActions.appendChild(h("button", { type: "submit", class: "btn btn-primary" }, "Kaydet"));

  function submitDaily(e) {
    e.preventDefault();
    clearFieldErrors(form);
    let ok = true;

    function readNumber(input, min, max, label) {
      const raw = input.value.trim();
      if (raw === "") return null;
      const n = parseNum(raw);
      if (typeof n !== "number" || Number.isNaN(n)) {
        setFieldError(input, label + " sayısal bir değer olmalı.");
        ok = false;
        return undefined;
      }
      if (n < min || n > max) {
        setFieldError(input, label + " " + fmtNum(min, 0) + " ile " + fmtNum(max, 0) + " arasında olmalı.");
        ok = false;
        return undefined;
      }
      return n;
    }

    const waterVal = readNumber(waterInput, 0, 10000, "Su");
    const stepsVal = readNumber(stepsInput, 0, 100000, "Adım");
    const sleepVal = readNumber(sleepInput, 0, 24, "Uyku");

    const energyChecked = readChecks(form, "td-energy");
    const energyVal = energyChecked.length > 0 && energyChecked[0] !== "" ? Number(energyChecked[0]) : null;

    const sorenessChecked = readChecks(form, "td-soreness");
    const sorenessVal = sorenessChecked.length > 0 && sorenessChecked[0] !== "" ? Number(sorenessChecked[0]) : null;

    if (!ok) return;

    const d = ensureDay(date);
    d.waterMl = waterVal === undefined ? null : waterVal;
    d.steps = stepsVal === undefined ? null : stepsVal;
    d.sleepHours = sleepVal === undefined ? null : sleepVal;
    d.energy = energyVal;
    d.soreness = sorenessVal;
    d.note = noteInput.value.trim();

    saveState();
    toast("Günlük kayıt kaydedildi.", "ok");
    commit();
  }

  form.onsubmit = submitDaily;
  form.appendChild(waterField);
  form.appendChild(stepsField);
  form.appendChild(sleepField);
  form.appendChild(energyWrap);
  form.appendChild(sorenessWrap);
  form.appendChild(noteField);
  form.appendChild(formActions);

  const dailyCard = card({ title: "Günlük kayıtlar" }, form);
  dailyCard.appendChild(h("p", { class: "small muted" }, "Boş bıraktığın alanlar kaydedilmemiş sayılır; sıfır olarak yorumlanmaz."));
  grid.appendChild(dailyCard);

  // 4. Günün durumu card
  const statusChildren = [];
  if (isFuture) {
    statusChildren.push(h("p", { class: "muted" }, "Gelecek bir tarih seçili."));
  } else {
    const items = [];

    if (planDay && planDay.type === "workout") {
      items.push({
        label: "Antrenman",
        done: Boolean(doneSession),
        status: doneSession ? "Tamamlandı" : "Bekliyor"
      });
    }
    items.push({ label: "Öğün kaydı", done: totals.count > 0, status: totals.count > 0 ? "Kaydedildi" : "Kaydedilmedi" });
    items.push({ label: "Su", done: Boolean(day && day.waterMl != null), status: day && day.waterMl != null ? "Kaydedildi" : "Kaydedilmedi" });
    items.push({ label: "Adım", done: Boolean(day && day.steps != null), status: day && day.steps != null ? "Kaydedildi" : "Kaydedilmedi" });
    items.push({ label: "Uyku", done: Boolean(day && day.sleepHours != null), status: day && day.sleepHours != null ? "Kaydedildi" : "Kaydedilmedi" });

    const doneCount = items.filter(function (i) { return i.done; }).length;
    const totalCount = items.length;

    const list = h("div", { class: "stack" });
    items.forEach(function (item) {
      const mark = item.done
        ? icon("check")
        : h("span", { class: "muted", attrs: { "aria-hidden": "true" } }, "○");
      list.appendChild(
        h("div", { class: "row" },
          mark,
          h("span", { class: "small" }, item.label),
          h("span", { class: "spacer" }),
          h("span", { class: "small muted" }, item.status)
        )
      );
    });

    statusChildren.push(list);
    if (totalCount > 0) {
      statusChildren.push(h("p", { class: "small" }, doneCount + " / " + totalCount + " tamamlandı"));
      const pct = (doneCount / totalCount) * 100;
      statusChildren.push(
        h("div", {
          class: "meter",
          attrs: {
            role: "progressbar",
            "aria-valuemin": "0",
            "aria-valuemax": String(totalCount),
            "aria-valuenow": String(doneCount),
            "aria-label": "Günün durumu"
          }
        }, h("div", { class: "meter-bar", style: { width: pct + "%" } }))
      );
    }
  }
  grid.appendChild(card({ title: "Günün durumu" }, ...statusChildren));
}

// ===== NUTRITION =====
function renderNutrition(root) {
  clear(root);
  const tabsEl = tabs(
    "nutrition",
    [
      ["log", "Günlük"],
      ["targets", "Hedefler"],
      ["menu", "Menü"],
      ["foods", "Yiyecekler"]
    ],
    "log"
  );
  root.appendChild(tabsEl.el);

  const current = tabsEl.current;
  if (current === "targets") return renderNutritionTargets(root);
  if (current === "menu") return renderNutritionMenu(root);
  if (current === "foods") return renderNutritionFoods(root);
  return renderNutritionLog(root);
}

function nutFoodLabel(food) {
  if (!food) return "Silinmiş yiyecek";
  const n = String(food.name).toLocaleLowerCase("tr");
  // Adında zaten durum yazıyorsa (ör. "Brokoli (çiğ)") tekrar ekleme.
  if (/çiğ|pişmiş|haşlanmış|ızgara/.test(n)) return food.name;
  if (food.state === "raw") return food.name + " · çiğ";
  if (food.state === "cooked") return food.name + " · pişmiş";
  return food.name;
}

function nutApproxNote() {
  return h("p", { class: "muted small" }, "Değerler yaklaşık.");
}

function nutSlotLabel(slotId) {
  const found = SLOTS.find((s) => s[0] === slotId);
  return found ? found[1] : slotId;
}

function nutSlotKcal(meals) {
  if (!meals || meals.length === 0) return null;
  let total = 0;
  let has = false;
  meals.forEach((m) => {
    if (typeof m.snap?.kcal === "number" && Number.isFinite(m.snap.kcal)) {
      total += m.snap.kcal;
      has = true;
    }
  });
  return has ? total : null;
}

function nutTotalsStats(totals, targets) {
  const stats = h("div", { class: "stats" });
  const items = [
    ["Enerji", totals.kcal, "kcal", targets?.kcal],
    ["Protein", totals.p, "g", targets?.proteinG],
    ["Yağ", totals.f, "g", targets?.fatG],
    ["Karbonhidrat", totals.c, "g", targets?.carbG]
  ];
  items.forEach(([label, value, unit, target]) => {
    const stat = h("div", { class: "stat" });
    stat.appendChild(h("div", { class: "stat-label", text: label }));
    stat.appendChild(h("div", { class: "stat-value" }, [fmtNum(value), h("span", { class: "muted" }, " " + unit)]));
    if (target != null) stat.appendChild(h("div", { class: "stat-sub", text: "/ " + fmtNum(target) + " " + unit + " hedef" }));
    stats.appendChild(stat);
  });
  return stats;
}

function renderNutritionLog(root) {
  const date = APP.ui.date;
  root.appendChild(datePager());
  root.appendChild(nutApproxNote());

  const day = getDay(date);
  const meals = day?.meals || [];
  const totals = dayTotals(date);
  const targets = APP.state.nutrition?.targets || null;

  if (totals.count === 0) {
    root.appendChild(h("p", { class: "muted" }, "Bu gün için öğün kaydı yok."));
  } else {
    root.appendChild(nutTotalsStats(totals, targets));
  }

  const addForm = h("form", { class: "form", id: "nl-add", novalidate: true });

  const slotSelect = h("select", { id: "nl-slot", class: "input" },
    SLOTS.map(([value, label]) => h("option", { value, text: label, selected: value === "breakfast" }))
  );

  const foodList = allFoods().slice().sort((a, b) => a.name.localeCompare(b.name, "tr"));
  const foodSelect = h("select", { id: "nl-food", class: "input" }, h("option", { value: "", text: "Yiyecek seç" }));
  const searchInput = h("input", {
    id: "nl-search",
    class: "input",
    type: "text",
    placeholder: "Yiyecek ara",
    autocomplete: "off",
    attrs: { "aria-label": "Yiyecek ara" }
  });

  function nutBuildFoodOptions(selectEl, list, query, selectedValue) {
    while (selectEl.options.length > 0) selectEl.remove(0);
    selectEl.appendChild(h("option", { value: "", text: query ? "Sonuç yok" : "Yiyecek seç" }));
    list.forEach((food) => {
      const label = nutFoodLabel(food);
      if (query && !label.toLocaleLowerCase("tr").includes(query)) return;
      const opt = h("option", { value: food.id, text: label });
      selectEl.appendChild(opt);
    });
    if (selectedValue && Array.from(selectEl.options).some((o) => o.value === selectedValue)) {
      selectEl.value = selectedValue;
    } else {
      selectEl.value = "";
    }
  }

  nutBuildFoodOptions(foodSelect, foodList, "", "");

  const amountInput = numberInput({ id: "nl-amount", value: "", min: 0, max: 5000, step: 1, placeholder: "Miktar" });
  const unitSelect = h("select", { id: "nl-unit", class: "input" }, h("option", { value: "g", text: "g" }));
  const preview = h("div", { id: "nl-preview", class: "muted small" }, "—");

  function nutUpdateUnitOptions(food, selectedUnit) {
    while (unitSelect.options.length > 0) unitSelect.remove(0);
    unitSelect.appendChild(h("option", { value: "g", text: "g" }));
    if (food?.portion) {
      unitSelect.appendChild(h("option", {
        value: "portion",
        text: food.portion.label + " (" + food.portion.grams + " g)"
      }));
    }
    unitSelect.value = selectedUnit && Array.from(unitSelect.options).some((o) => o.value === selectedUnit) ? selectedUnit : "g";
  }

  function nutUpdatePreview() {
    const foodId = foodSelect.value;
    const food = foodId ? foodById(foodId) : null;
    const amount = parseNum(amountInput.value);
    if (!food || amount == null || Number.isNaN(amount) || amount <= 0) {
      preview.textContent = "—";
      return;
    }
    const n = nutritionFor(food, amount, unitSelect.value);
    preview.textContent = "≈ " + fmtNum(n.kcal) + " kcal · P " + fmtNum(n.p) + " g · Y " + fmtNum(n.f) + " g · K " + fmtNum(n.c) + " g";
  }

  searchInput.addEventListener("input", () => {
    nutBuildFoodOptions(foodSelect, foodList, searchInput.value.trim().toLocaleLowerCase("tr"), foodSelect.value);
    nutUpdatePreview();
  });

  foodSelect.addEventListener("change", () => {
    const food = foodById(foodSelect.value);
    nutUpdateUnitOptions(food, "g");
    nutUpdatePreview();
  });

  amountInput.addEventListener("input", nutUpdatePreview);
  unitSelect.addEventListener("change", nutUpdatePreview);

  addForm.appendChild(field({ label: "Öğün", input: slotSelect }));
  addForm.appendChild(field({ label: "Yiyecek ara", input: searchInput }));
  addForm.appendChild(field({ label: "Yiyecek", input: foodSelect, wide: true }));
  addForm.appendChild(field({ label: "Miktar", input: amountInput }));
  addForm.appendChild(field({ label: "Birim", input: unitSelect }));
  addForm.appendChild(field({ label: "Tahmini değer", input: preview, wide: true }));
  addForm.appendChild(h("button", { type: "submit", class: "btn btn-primary" }, "Öğün ekle"));

  addForm.addEventListener("submit", (e) => {
    e.preventDefault();
    clearFieldErrors(addForm);

    const foodId = foodSelect.value;
    const amount = parseNum(amountInput.value);
    if (!foodId) setFieldError(foodSelect, "Yiyecek seç.");
    if (amount == null || Number.isNaN(amount)) setFieldError(amountInput, "Miktar sayı olmalı.");
    else if (amount <= 0) setFieldError(amountInput, "Miktar 0'dan büyük olmalı.");
    else if (amount > 5000) setFieldError(amountInput, "Miktar en fazla 5000 olabilir.");
    if (!foodId || amount == null || Number.isNaN(amount) || amount <= 0 || amount > 5000) return;

    const food = foodById(foodId);
    const unit = unitSelect.value;
    const snap = Object.assign({ name: nutFoodLabel(food) }, nutritionFor(food, amount, unit));
    ensureDay(date).meals.push({
      id: uid("m"),
      slot: slotSelect.value,
      foodId,
      amount,
      unit,
      snap
    });
    commit();
    toast("Öğün eklendi.", "ok");
  });

  root.appendChild(addForm);

  const mealArea = h("div", { class: "stack" });
  SLOTS.forEach(([slotId, slotLabel]) => {
    const slotMeals = meals.filter((m) => m.slot === slotId);
    const slotKcal = nutSlotKcal(slotMeals);
    const cardEl = card({ title: slotLabel, sub: slotKcal == null ? "kcal" : fmtNum(slotKcal) + " kcal" });

    if (slotMeals.length === 0) {
      cardEl.appendChild(h("p", { class: "muted" }, "Kayıt yok."));
    } else {
      const list = h("div", { class: "list" });
      slotMeals.forEach((meal) => {
        const editState = APP.ui.nutEdit;
        if (editState?.mealId === meal.id && editState.mode === "edit") {
          list.appendChild(nutMealEditRow(meal));
          return;
        }
        if (editState?.mealId === meal.id && editState.mode === "copy") {
          list.appendChild(nutMealCopyRow(meal));
          return;
        }

        const food = foodById(meal.foodId);
        const amountText = meal.unit === "g"
          ? fmtNum(meal.amount) + " g"
          : fmtNum(meal.amount, 2) + " × " + (food?.portion?.label || "porsiyon");
        const item = h("div", { class: "list-item" });
        const main = h("div", { class: "li-main" });
        main.appendChild(h("div", { class: "li-title", text: meal.snap?.name || "Bilinmeyen öğün" }));
        main.appendChild(h("div", {
          class: "li-sub",
          text: amountText + " · " + fmtNum(meal.snap?.kcal) + " kcal · P " + fmtNum(meal.snap?.p) + " g · Y " + fmtNum(meal.snap?.f) + " g · K " + fmtNum(meal.snap?.c) + " g"
        }));
        item.appendChild(main);

        const actions = h("div", { class: "li-actions row" });
        actions.appendChild(h("button", {
          type: "button",
          class: "btn btn-sm",
          text: "Düzenle",
          attrs: { "data-action": "nut-edit-meal", "data-id": meal.id }
        }));
        actions.appendChild(h("button", {
          type: "button",
          class: "btn btn-sm",
          text: "Kopyala",
          attrs: { "data-action": "nut-copy-meal", "data-id": meal.id }
        }));
        actions.appendChild(h("button", {
          type: "button",
          class: "btn btn-sm btn-danger",
          text: "Sil",
          attrs: { "data-action": "nut-delete-meal", "data-id": meal.id }
        }));
        item.appendChild(actions);
        list.appendChild(item);
      });
      cardEl.appendChild(list);
    }
    mealArea.appendChild(cardEl);
  });

  mealArea.addEventListener("click", async (e) => {
    const btn = e.target.closest("button[data-action]");
    if (!btn) return;
    const id = btn.getAttribute("data-id");
    const action = btn.getAttribute("data-action");
    const dayNow = ensureDay(date);
    const meal = dayNow.meals.find((m) => m.id === id);
    if (!meal) return;

    if (action === "nut-edit-meal") {
      APP.ui.nutEdit = { mealId: id, mode: "edit" };
      rerender();
    } else if (action === "nut-copy-meal") {
      APP.ui.nutEdit = { mealId: id, mode: "copy" };
      rerender();
    } else if (action === "nut-delete-meal") {
      const ok = await confirmDialog("Bu öğün kaydı silinsin mi?", "Sil");
      if (!ok) return;
      const d = ensureDay(date);
      d.meals = d.meals.filter((m) => m.id !== id);
      if (APP.ui.nutEdit?.mealId === id) APP.ui.nutEdit = null;
      commit();
      toast("Öğün silindi.", "ok");
    }
  });

  root.appendChild(mealArea);

  if (meals.length > 0) {
    const copyAllForm = h("form", { class: "row form" });
    const copyDateInput = h("input", { id: "nl-copy-all-date", class: "input", type: "date", value: addDays(date, 1) });
    copyAllForm.appendChild(h("label", { for: "nl-copy-all-date", class: "muted" }, "Başka güne kopyala:"));
    copyAllForm.appendChild(copyDateInput);
    copyAllForm.appendChild(h("button", { type: "submit", class: "btn" }, "Bu günün tüm öğünlerini başka güne kopyala"));
    copyAllForm.addEventListener("submit", (e) => {
      e.preventDefault();
      const target = copyDateInput.value;
      if (!target) {
        setFieldError(copyDateInput, "Tarih seç.");
        return;
      }
      clearFieldErrors(copyAllForm);
      const source = ensureDay(date).meals;
      ensureDay(target).meals.push(...source.map((m) => Object.assign({}, m, { id: uid("m") })));
      saveState();
      rerender();
      toast("Tüm öğünler " + formatDate(target) + " tarihine kopyalandı.", "ok");
    });
    root.appendChild(copyAllForm);
  }
}

function nutMealEditRow(meal) {
  const form = h("form", { class: "form", novalidate: true });
  const slotSelect = h("select", { id: "nle-slot-" + meal.id, class: "input" },
    SLOTS.map(([value, label]) => h("option", { value, text: label, selected: value === meal.slot }))
  );
  const amountInput = numberInput({
    id: "nle-amount-" + meal.id,
    value: String(meal.amount),
    min: 0,
    max: 5000,
    step: 1
  });
  const food = foodById(meal.foodId);
  const unitSelect = h("select", { id: "nle-unit-" + meal.id, class: "input" }, h("option", { value: "g", text: "g" }));
  if (food?.portion) {
    unitSelect.appendChild(h("option", {
      value: "portion",
      text: food.portion.label + " (" + food.portion.grams + " g)"
    }));
  }
  unitSelect.value = meal.unit || "g";
  if (Array.from(unitSelect.options).some((o) => o.value === unitSelect.value) === false) unitSelect.value = "g";

  form.appendChild(field({ label: "Öğün", input: slotSelect }));
  form.appendChild(field({ label: "Miktar", input: amountInput }));
  form.appendChild(field({ label: "Birim", input: unitSelect }));

  const actions = h("div", { class: "form-actions row" });
  actions.appendChild(h("button", { type: "submit", class: "btn btn-primary btn-sm" }, "Kaydet"));
  actions.appendChild(h("button", {
    type: "button",
    class: "btn btn-sm",
    text: "Vazgeç",
    on: { click: () => { APP.ui.nutEdit = null; rerender(); } }
  }));
  form.appendChild(actions);

  form.addEventListener("submit", (e) => {
    e.preventDefault();
    clearFieldErrors(form);
    const amount = parseNum(amountInput.value);
    if (amount == null || Number.isNaN(amount) || amount <= 0 || amount > 5000) {
      setFieldError(amountInput, "Miktar 0'dan büyük ve 5000'den küçük olmalı.");
      return;
    }

    const foodNow = foodById(meal.foodId);
    const unit = unitSelect.value;
    let snap;
    if (foodNow) {
      const n = nutritionFor(foodNow, amount, unit);
      snap = Object.assign({ name: nutFoodLabel(foodNow) }, n);
    } else {
      const oldAmount = meal.amount > 0 ? meal.amount : 1;
      const factor = amount / oldAmount;
      snap = {
        name: meal.snap?.name || "Silinmiş yiyecek",
        kcal: round((meal.snap?.kcal || 0) * factor),
        p: round((meal.snap?.p || 0) * factor, 1),
        f: round((meal.snap?.f || 0) * factor, 1),
        c: round((meal.snap?.c || 0) * factor, 1)
      };
    }

    meal.slot = slotSelect.value;
    meal.amount = amount;
    meal.unit = unit;
    meal.snap = snap;
    APP.ui.nutEdit = null;
    commit();
    toast("Öğün güncellendi.", "ok");
  });

  const wrap = h("div", { class: "list-item" });
  wrap.appendChild(form);
  return wrap;
}

  );

  form.appendChild(field({ label: "Hedef tarih", input: dateInput }));

  const actions = h("div", { class: "form-actions row" });

    type: "button",
    class: "btn btn-sm",
    text: "Vazgeç",
    on: { click: () => { APP.ui.nutEdit = null; rerender(); } }
  }));

function renderNutritionTargets(root) {
  root.appendChild(nutApproxNote());
  const p = APP.state.profile;
  const kg = currentWeight();
  const blockers = autoBlockers(p);

  const energyCard = card({ title: "Tahmini enerji ihtiyacı" });
  if (blockers.length > 0) {
    const notice = h("div", { class: "notice notice-warn" },
      h("p", {}, "Otomatik tahmin için bu profilde kısıt var:"),
      h("ul", {}, blockers.map((b) => h("li", { text: b })))
    );
    notice.appendChild(h("p", {}, "Günlük kayıt özelliklerini kullanmaya devam edebilirsin; hedefini bir sağlık profesyoneliyle belirleyip aşağıya elle girebilirsin."));
    energyCard.appendChild(notice);
  } else {
    const e = calcEnergy(p, kg);
    if (!e.ok) {
      energyCard.appendChild(h("div", { class: "notice" }, h("p", {}, "Hesaplama için eksik bilgi: " + (e.missing.join(", ") || "belirtilmedi"))));
      const row = h("div", { class: "row" });
      row.appendChild(h("button", { type: "button", class: "btn", on: { click: () => navigate("settings") } }, "Profil ve Ayarlar"));
      energyCard.appendChild(row);
    } else {
      const kv = h("dl", { class: "kv" });
      kv.appendChild(h("dt", { text: "Bazal metabolizma (tahmini)" }));
      kv.appendChild(h("dd", { text: fmtNum(e.bmr) + " kcal" }));
      kv.appendChild(h("dt", { text: "Aktivite katsayısı" }));
      kv.appendChild(h("dd", { text: fmtNum(e.factor, 2) }));
      kv.appendChild(h("dt", { text: "Tahmini günlük harcama (TDEE)" }));
      kv.appendChild(h("dd", { text: fmtNum(e.tdee) + " kcal" }));
      energyCard.appendChild(kv);
      if (e.assumptions && e.assumptions.length > 0) {
        energyCard.appendChild(h("ul", {}, e.assumptions.map((a) => h("li", { text: a }))));
      }
      energyCard.appendChild(h("p", { class: "muted small" }, "Tahminler kesin ihtiyaç veya tıbbi reçete değildir."));
    }
  }
  root.appendChild(energyCard);

  const s = suggestTargets(p, kg);
  if (s) {
    const suggCard = card({ title: "Önerilen başlangıç hedefi" });
    const stats = h("div", { class: "stats" });
    [
      ["Enerji", s.kcal, "kcal"],
      ["Protein", s.proteinG, "g"],
      ["Yağ", s.fatG, "g"],
      ["Karbonhidrat", s.carbG, "g"]
    ].forEach(([label, value, unit]) => {
      const stat = h("div", { class: "stat" });
      stat.appendChild(h("div", { class: "stat-label", text: label }));
      stat.appendChild(h("div", { class: "stat-value" }, [fmtNum(value), h("span", { class: "muted" }, " " + unit)]));
      stats.appendChild(stat);
    });
    suggCard.appendChild(stats);
    if (s.notes && s.notes.length > 0) {
      suggCard.appendChild(h("ul", {}, s.notes.map((n) => h("li", { text: n }))));
    }
    const btn = h("button", { type: "button", class: "btn btn-primary" }, "Öneriyi hedef olarak kullan");
    btn.addEventListener("click", () => {
      APP.state.nutrition.targets = {
        kcal: s.kcal,
        proteinG: s.proteinG,
        fatG: s.fatG,
        carbG: s.carbG,
        source: "auto",
        updatedAt: Date.now()
      };
      commit();
      toast("Hedef güncellendi.", "ok");
    });
    suggCard.appendChild(btn);
    root.appendChild(suggCard);
  }

  const targets = APP.state.nutrition?.targets || null;
  const targetCard = card({ title: "Günlük hedefim", sub: targets ? (targets.source === "auto" ? "Kaynak: otomatik" : "Kaynak: elle") : "" });
  if (!targets) {
    targetCard.appendChild(emptyState("Hedef yok", "Önerilen hedefi kullanabilir veya elle girebilirsin."));
  } else {
    const form = h("form", { class: "form", novalidate: true });
    const kcalInput = numberInput({ id: "nt-kcal", value: String(targets.kcal), min: 800, max: 6000, step: 10 });
    const proteinInput = numberInput({ id: "nt-protein", value: String(targets.proteinG), min: 0, max: 1000, step: 1 });
    const fatInput = numberInput({ id: "nt-fat", value: String(targets.fatG), min: 0, max: 1000, step: 1 });
    const carbInput = numberInput({ id: "nt-carb", value: String(targets.carbG), min: 0, max: 1000, step: 1 });

    const macroLine = h("div", { class: "muted small" }, "Makrolardan hesaplanan enerji: —");
    const warn = h("div", { class: "notice notice-warn", attrs: { hidden: true } }, "Makroların toplam enerjisi hedefle uyuşmuyor.");

    function nutTargetLiveUpdate() {
      const pVal = parseNum(proteinInput.value);
      const fVal = parseNum(fatInput.value);
      const cVal = parseNum(carbInput.value);
      const kVal = parseNum(kcalInput.value);
      if (pVal != null && fVal != null && cVal != null && !Number.isNaN(pVal) && !Number.isNaN(fVal) && !Number.isNaN(cVal)) {
        const x = macroKcal(pVal, fVal, cVal);
        macroLine.textContent = "Makrolardan hesaplanan enerji: " + fmtNum(x) + " kcal";
        if (kVal != null && !Number.isNaN(kVal) && Math.abs(x - kVal) > 50) {
          warn.removeAttribute("hidden");
        } else {
          warn.setAttribute("hidden", "");
        }
      } else {
        macroLine.textContent = "Makrolardan hesaplanan enerji: —";
        warn.setAttribute("hidden", "");
      }
    }

    [kcalInput, proteinInput, fatInput, carbInput].forEach((inp) => inp.addEventListener("input", nutTargetLiveUpdate));

    form.appendChild(field({ label: "Enerji (kcal)", input: kcalInput }));
    form.appendChild(field({ label: "Protein (g)", input: proteinInput }));
    form.appendChild(field({ label: "Yağ (g)", input: fatInput }));
    form.appendChild(field({ label: "Karbonhidrat (g)", input: carbInput }));
    form.appendChild(macroLine);
    form.appendChild(warn);

    const setFromMacros = h("button", { type: "button", class: "btn" }, "Enerjiyi makrolara göre ayarla");
    setFromMacros.addEventListener("click", () => {
      const pVal = parseNum(proteinInput.value);
      const fVal = parseNum(fatInput.value);
      const cVal = parseNum(carbInput.value);
      if (pVal == null || fVal == null || cVal == null || Number.isNaN(pVal) || Number.isNaN(fVal) || Number.isNaN(cVal)) return;
      kcalInput.value = String(Math.round(macroKcal(pVal, fVal, cVal)));
      nutTargetLiveUpdate();
    });

    form.appendChild(setFromMacros);

    const actions = h("div", { class: "form-actions row" });
    actions.appendChild(h("button", { type: "submit", class: "btn btn-primary" }, "Hedefi kaydet"));
    form.appendChild(actions);

    form.addEventListener("submit", (e) => {
      e.preventDefault();
      clearFieldErrors(form);
      const k = parseNum(kcalInput.value);
      const pVal = parseNum(proteinInput.value);
      const fVal = parseNum(fatInput.value);
      const cVal = parseNum(carbInput.value);
      let bad = false;
      if (k == null || Number.isNaN(k) || k < 800 || k > 6000) { setFieldError(kcalInput, "Enerji 800–6000 kcal arası olmalı."); bad = true; }
      if (pVal == null || Number.isNaN(pVal) || pVal < 0 || pVal > 1000) { setFieldError(proteinInput, "Protein 0–1000 g arası olmalı."); bad = true; }
      if (fVal == null || Number.isNaN(fVal) || fVal < 0 || fVal > 1000) { setFieldError(fatInput, "Yağ 0–1000 g arası olmalı."); bad = true; }
      if (cVal == null || Number.isNaN(cVal) || cVal < 0 || cVal > 1000) { setFieldError(carbInput, "Karbonhidrat 0–1000 g arası olmalı."); bad = true; }
      if (!bad) {
        const x = macroKcal(pVal, fVal, cVal);
        if (Math.abs(x - k) > 50) {
          setFieldError(kcalInput, "Makroların toplam enerjisi hedefle uyuşmuyor.");
          bad = true;
        }
      }
      if (bad) return;

      APP.state.nutrition.targets = {
        kcal: k,
        proteinG: pVal,
        fatG: fVal,
        carbG: cVal,
        source: "manual",
        updatedAt: Date.now()
      };
      commit();
      toast("Hedef kaydedildi.", "ok");
    });

    targetCard.appendChild(form);
  }
  root.appendChild(targetCard);
}

function nutMenuSlotTotal(items) {
  let total = null;
  items.forEach((item) => {
    const food = foodById(item.foodId);
    if (!food) return;
    const n = nutritionFor(food, item.grams, "g");
    total = (total == null ? 0 : total) + n.kcal;
  });
  return total;
}

function renderNutritionMenu(root) {

// ===== WORKOUT =====
const woTimer = { total: 0, remaining: 0, running: false, intervalId: null };
const woEFFORTS = [["easy", "Rahattı"], ["ok", "Uygundu"], ["hard", "Zorlandım"]];

function renderWorkout(root) {
  clear(root);
  const tabCtrl = tabs("workout", [["session", "Seans"], ["plan", "Plan"], ["history", "Geçmiş"]], "session");
  root.append(tabCtrl.el);
  if (!APP.state || !APP.state.profile) return;
  if (tabCtrl.current === "session") woRenderSession(root);
  else if (tabCtrl.current === "plan") woRenderPlan(root);
  else woRenderHistory(root);
}

function woTimerFormat(sec) {
  const n = Math.max(0, Math.floor(sec));
  const m = String(Math.floor(n / 60)).padStart(2, "0");
  const s = String(n % 60).padStart(2, "0");
  return `${m}:${s}`;
}

function woTimerUpdate() {
  const disp = document.getElementById("wo-timer-display");
  if (disp) disp.textContent = woTimerFormat(woTimer.remaining);
  const btn = document.getElementById("wo-timer-toggle");
  if (btn) btn.textContent = woTimer.running ? "Duraklat" : "Başlat";
}

function woTimerStart(seconds) {
  if (arguments.length > 0 && Number.isFinite(seconds) && seconds > 0) {
    woTimer.total = Math.floor(seconds);
    woTimer.remaining = woTimer.total;
  } else if (woTimer.remaining <= 0 && woTimer.total > 0) {
    woTimer.remaining = woTimer.total;
  }
  if (woTimer.remaining <= 0) return;
  if (woTimer.running) return;
  woTimer.running = true;
  if (woTimer.intervalId !== null) clearInterval(woTimer.intervalId);
  woTimer.intervalId = setInterval(() => {
    woTimer.remaining -= 1;
    if (woTimer.remaining <= 0) {
      woTimer.remaining = 0;
      woTimer.running = false;
      if (woTimer.intervalId !== null) clearInterval(woTimer.intervalId);
      woTimer.intervalId = null;
      woTimerUpdate();
      toast("Dinlenme bitti.", "info");
      navigator.vibrate?.(200);
    } else {
      woTimerUpdate();
    }
  }, 1000);
  woTimerUpdate();
}

function woTimerPause() {
  woTimer.running = false;
  if (woTimer.intervalId !== null) clearInterval(woTimer.intervalId);
  woTimer.intervalId = null;
  woTimerUpdate();
}

function woTimerReset() {
  woTimer.remaining = woTimer.total;
  woTimer.running = false;
  if (woTimer.intervalId !== null) clearInterval(woTimer.intervalId);
  woTimer.intervalId = null;
  woTimerUpdate();
}

function woTimerWidget() {
  const display = h("span", { class: "timer-display", id: "wo-timer-display", attrs: { "aria-live": "off" } }, woTimerFormat(woTimer.remaining));
  const toggle = h("button", { type: "button", class: "btn btn-sm", id: "wo-timer-toggle" }, woTimer.running ? "Duraklat" : "Başlat");
  toggle.addEventListener("click", () => {
    if (woTimer.running) woTimerPause();
    else woTimerStart();
  });
  const resetBtn = h("button", { type: "button", class: "btn btn-sm" }, "Sıfırla");
  resetBtn.addEventListener("click", () => woTimerReset());
  const presets = [60, 90, 120].map((s) => {
    const b = h("button", { type: "button", class: "btn btn-sm" }, `${s} sn`);
    b.addEventListener("click", () => woTimerStart(s));
    return b;
  });
  return h("div", { class: "timer" }, display, h("div", { class: "row" }, toggle, resetBtn, ...presets));
}

function woSessionForDate(iso) {
  const list = sessionsOn(iso);
  const inProgress = list.find((s) => s && s.status === "in_progress") || null;
  if (inProgress) return inProgress;
  const done = list.filter((s) => s && s.status === "done").sort((a, b) => (b.startedAt || 0) - (a.startedAt || 0));
  return done[0] || null;
}

function woFormatSet(set, isBodyweight) {
  let weight;
  if (set && set.weight == null) {
    weight = isBodyweight ? "VA" : "—";
  } else if (set && set.weight > 0) {
    weight = (isBodyweight ? "+" : "") + fmtNum(set.weight, 1) + " kg";
  } else if (set && set.weight === 0) {
    weight = "0 kg";
  } else {
    weight = "—";
  }
  const reps = set && set.reps != null ? fmtNum(set.reps, 0) : "—";
  return `${weight} × ${reps}`;
}

function woEffortLabel(value) {
  const found = woEFFORTS.find((e) => e[0] === value);
  return found ? found[1] : "—";
}

function woSuggestText(entry) {
  if (entry.pain) return "Ağrı bildirildi; yük artışı önerilmez. Gerekirse hareketi değiştir veya çıkar.";
  const s = suggestProgression(entry);
  return s && s.text ? s.text : "";
}

function woUpdateSuggest(entry, el) {
  if (!el) return;
  const txt = woSuggestText(entry);
  el.textContent = txt;
  el.hidden = !txt;
}

function woSetError(input, err, msg) {
  if (input) input.setAttribute("aria-invalid", "true");
  if (err) {
    err.textContent = msg;
    err.hidden = false;
  }
}

function woClearSetError(input, err) {
  if (input) input.removeAttribute("aria-invalid");
  if (err) {
    err.textContent = "";
    err.hidden = true;
  }
}

function woSetRowNumberInput(id, value, min, max, step, placeholder) {
  const el = numberInput({ id, value: value == null ? "" : value, min, max, step, placeholder });
  el.classList.add("input");
  return el;
}

function woSessionNoneCard(root, date) {
  const planDay = planDayFor(date);
  if (!planDay) {
    const btn = h("button", { type: "button", class: "btn" }, "Plan sekmesine git");
    btn.addEventListener("click", () => navigate("workout", "plan"));
    root.append(emptyState("Plan bulunamadı", "Bu tarih için plan yok. Önce haftalık plan oluşturabilirsin.", btn));
    return;
  }
  if (planDay.type === "rest") {
    root.append(emptyState("Bu gün dinlenme günü.", "Hafif yürüyüş veya esneme yapılabilir. Plan sekmesinden gün tipini değiştirebilirsin."));
    return;
  }
  const exList = h("div", { class: "list" });
  (planDay.exercises || []).forEach((p) => {
    const ex = getExercise(p.exerciseId);
    const name = ex ? ex.name : p.exerciseId;
    exList.append(h("div", { class: "list-item" }, h("div", { class: "li-main" },
      h("div", { class: "li-title" }, name),
      h("div", { class: "li-sub muted" }, `${p.sets} set × ${p.repMin}–${p.repMax} tekrar · dinlenme ${p.restSec} sn`)
    )));
  });
  const startBtn = h("button", { type: "button", class: "btn btn-primary" }, "Antrenmana başla");
  startBtn.addEventListener("click", () => {
    startSession(date);
    commit();
  });
  root.append(card({ title: planDay.title, sub: planDay.warmup ? `Isınma: ${planDay.warmup}` : null }, exList, startBtn));
}

function woExerciseCard(session, entry) {
  const profile = APP.state.profile;
  const ex = getExercise(entry.exerciseId);
  const tip = ex && ex.tip ? ex.tip : "";
  const perf = lastPerformance(entry.exerciseId, session.id);
  const cardEl = h("div", { class: "ex-card" });
  const nameEl = h("h3", {}, entry.name || (ex ? ex.name : entry.exerciseId));
  const targetEl = h("span", { class: "muted small" }, `Hedef: ${(entry.sets || []).length} set × ${entry.repMin != null ? entry.repMin : "—"}–${entry.repMax != null ? entry.repMax : "—"} tekrar · dinlenme ${entry.restSec != null ? entry.restSec : "—"} sn`);
  const head = h("div", { class: "ex-head" }, nameEl, targetEl);
  if (tip) head.append(h("p", { class: "muted small" }, tip));
  const changeBtn = h("button", { type: "button", class: "btn btn-sm" }, "Hareketi değiştir");
  let changeSelect = null;
  changeBtn.addEventListener("click", () => {
    if (changeSelect) {
      changeSelect.replaceWith(changeBtn);
      changeSelect = null;
      return;
    }
    const options = [[entry.exerciseId, entry.name]];
    alternativesFor(entry.exerciseId, profile).forEach((alt) => options.push([alt.id, alt.name]));
    changeSelect = h("select", { class: "input", attrs: { "aria-label": "Alternatif hareket seç" } },
      options.map(([v, l]) => h("option", { value: v, text: l, selected: v === entry.exerciseId })));
    changeSelect.addEventListener("change", () => {
      const alt = getExercise(changeSelect.value);
      if (!alt) return;
      entry.exerciseId = alt.id;
      entry.name = alt.name;
      entry.isBodyweight = !!alt.bodyweight;
      commit();
    });
    changeBtn.replaceWith(changeSelect);
    changeSelect.focus();
  });
  const removeBtn = h("button", { type: "button", class: "btn btn-sm btn-danger" }, "Hareketi çıkar");
  removeBtn.addEventListener("click", async () => {
    const ok = await confirmDialog("Bu hareket seanstan çıkarılsın mı?", "Çıkar");
    if (!ok) return;
    session.exercises = (session.exercises || []).filter((e) => e.uid !== entry.uid);
    commit();
  });
  const restBtn = h("button", { type: "button", class: "btn btn-sm" }, `Dinlen (${entry.restSec || 90} sn)`);
  restBtn.addEventListener("click", () => woTimerStart(entry.restSec || 90));
  head.append(h("div", { class: "row" }, restBtn, changeBtn, removeBtn));
  cardEl.append(head);
  if (perf && Array.isArray(perf.sets) && perf.sets.length) {
    const items = perf.sets.map((s) => woFormatSet(s, entry.isBodyweight));
    cardEl.append(h("p", { class: "prev-perf muted" }, `Önceki (${formatDate(perf.date)}): ${items.join(", ")}`));
  } else {
    cardEl.append(h("p", { class: "prev-perf muted" }, "Önceki kayıt yok."));
  }
  const table = h("div", { class: "set-table" });
  const suggestEl = h("div", { class: "suggest", id: `wo-suggest-${entry.uid}`, hidden: true }, "");
  (entry.sets || []).forEach((set, i) => {
    const row = h("div", { class: "set-row" });
    if (set.done) row.classList.add("done");
    row.append(h("span", { class: "muted" }, String(i + 1)));
    const wId = `wo-w-${entry.uid}-${i}`;
    const wErr = h("p", { class: "error", role: "alert", hidden: true });
    const wInp = woSetRowNumberInput(wId, set.weight, 0, 500, 0.5, entry.isBodyweight ? "VA" : "kg");
    wInp.setAttribute("aria-label", `Set ${i + 1} ağırlık (kg)` + (entry.isBodyweight ? ", boşsa vücut ağırlığı" : ""));
    wInp.addEventListener("change", () => {
      const raw = wInp.value;
      if (raw.trim() === "") {
        woClearSetError(wInp, wErr);
        set.weight = null;
        saveState();
        woUpdateSuggest(entry, suggestEl);
        return;
      }
      const v = parseNum(raw);
      if (!Number.isFinite(v) || v < 0 || v > 500) {
        woSetError(wInp, wErr, "Ağırlık 0–500 aralığında sayı olmalı.");
        return;
      }
      woClearSetError(wInp, wErr);
      set.weight = v;
      saveState();
      woUpdateSuggest(entry, suggestEl);
    });
    const rId = `wo-r-${entry.uid}-${i}`;
    const rErr = h("p", { class: "error", role: "alert", hidden: true });
    const rInp = woSetRowNumberInput(rId, set.reps, 0, 200, 1, "tekrar");
    rInp.setAttribute("aria-label", `Set ${i + 1} tekrar`);
    rInp.addEventListener("change", () => {
      const raw = rInp.value;
      if (raw.trim() === "") {
        woClearSetError(rInp, rErr);
        set.reps = null;
        saveState();
        woUpdateSuggest(entry, suggestEl);
        return;
      }
      const v = parseNum(raw);
      if (!Number.isFinite(v) || !Number.isInteger(v) || v < 0 || v > 200) {
        woSetError(rInp, rErr, "Tekrar 0–200 aralığında tam sayı olmalı.");
        return;
      }
      woClearSetError(rInp, rErr);
      set.reps = v;
      saveState();
      woUpdateSuggest(entry, suggestEl);
    });
    const doneBox = h("input", { type: "checkbox", checked: !!set.done, attrs: { id: `wo-d-${entry.uid}-${i}` } });
    doneBox.addEventListener("change", () => {
      set.done = doneBox.checked;
      row.classList.toggle("done", !!set.done);
      saveState();
      woUpdateSuggest(entry, suggestEl);
    });
    const delBtn = h("button", { type: "button", class: "icon-btn", attrs: { "aria-label": "Seti sil" } }, icon("trash"));
    delBtn.addEventListener("click", async () => {
      if ((set.weight != null || set.reps != null) && !(await confirmDialog("Bu set silinsin mi?"))) return;
      entry.sets = (entry.sets || []).filter((_, idx) => idx !== i);
      commit();
    });
    row.append(wInp, rInp, h("label", { class: "check small", for: doneBox.id }, doneBox, "Tamam"), delBtn);
    table.append(row, wErr, rErr);
  });
  const addSetBtn = h("button", { type: "button", class: "btn btn-sm" }, "Set ekle");
  addSetBtn.addEventListener("click", () => {
    const sets = entry.sets || (entry.sets = []);
    const last = sets[sets.length - 1] || { weight: null, reps: null };
    sets.push({ weight: last.weight == null ? null : last.weight, reps: null, done: false });
    commit();
  });
  table.append(h("div", { class: "row" }, addSetBtn));
  cardEl.append(table);
  const effortName = `wo-effort-${entry.uid}`;
  const effortSeg = segGroup({ name: effortName, options: woEFFORTS, value: entry.effort || null, legend: "Efor" });
  effortSeg.addEventListener("change", () => {
    const checked = effortSeg.querySelector(`input[name="${effortName}"]:checked`);
    entry.effort = checked ? checked.value : null;
    saveState();
    woUpdateSuggest(entry, suggestEl);
  });
  cardEl.append(effortSeg);
  const painBox = h("input", { type: "checkbox", checked: !!entry.pain, attrs: { id: `wo-pain-${entry.uid}` } });
  painBox.addEventListener("change", () => {
    entry.pain = !!painBox.checked;
    saveState();
    woUpdateSuggest(entry, suggestEl);
  });
  cardEl.append(h("label", { class: "check", for: painBox.id }, painBox, " Ağrı hissettim"));
  woUpdateSuggest(entry, suggestEl);
  cardEl.append(suggestEl);
  return cardEl;
}

function woRenderSession(root) {
  const date = APP.ui.date || todayISO();
  root.append(datePager());
  const profile = APP.state.profile;
  if (profile && profile.limitations && String(profile.limitations).trim()) {
    root.append(h("div", { class: "notice notice-info" }, h("p", {}, `Belirttiğin kısıt: “${String(profile.limitations).trim()}”. Uygulama bunu tıbbi olarak değerlendiremez; zorlandığın veya ağrı yapan hareketleri değiştir ya da çıkar.`)));
  }
  const session = woSessionForDate(date);
  if (!session) {
    woSessionNoneCard(root, date);
    return;
  }
  if (session.status === "in_progress") {
    root.append(woTimerWidget());
    const planDay = planDayFor(date);
    const warmup = planDay && planDay.warmup ? `Isınma: ${planDay.warmup}` : null;
    const exWrap = h("div", { class: "stack" });
    (session.exercises || []).forEach((entry) => exWrap.append(woExerciseCard(session, entry)));
    const addSelId = "wo-add-ex";
    const addOptions = [[null, "Hareket seç…"]].concat(availableExercises(profile).map((ex) => [ex.id, ex.name]));
    const addSelect = selectInput({ id: addSelId, options: addOptions, value: null });
    addSelect.setAttribute("aria-label", "Eklenecek hareket");
    const addBtn = h("button", { type: "button", class: "btn" }, "Hareket ekle");
    addBtn.addEventListener("click", () => {
      const ex = getExercise(addSelect.value);
      if (!ex) { toast("Eklemek için bir hareket seç.", "err"); return; }
      const pre = prescription(ex, profile.experience);
      (session.exercises || (session.exercises = [])).push({
        uid: uid("se"),
        exerciseId: ex.id,
        name: ex.name,
        isBodyweight: !!ex.bodyweight,
        repMin: pre.repMin,
        repMax: pre.repMax,
        restSec: pre.restSec,
        sets: Array.from({ length: pre.sets }, () => ({ weight: null, reps: null, done: false })),
        effort: null,
        pain: false
      });
      commit();
    });
    const finishBtn = h("button", { type: "button", class: "btn btn-primary" }, "Seansı bitir");
    finishBtn.addEventListener("click", async () => {
      const notDone = (session.exercises || []).some((e) => (e.sets || []).some((s) => !s.done));
      if (notDone && !(await confirmDialog("Tamamlanmamış setler var. Seans yine de bitirilsin mi?"))) return;
      session.status = "done";
      session.finishedAt = Date.now();
      woTimerPause();
      commit();
      toast("Seans kaydedildi.", "ok");
    });
    const cancelBtn = h("button", { type: "button", class: "btn btn-ghost" }, "Seansı iptal et");
    cancelBtn.addEventListener("click", async () => {
      if (!(await confirmDialog("Seans iptal edilsin mi? Bu seansa girdiğin setler silinir.", "İptal et"))) return;
      APP.state.sessions = (APP.state.sessions || []).filter((s) => s.id !== session.id);
      commit();
    });
    root.append(card({ title: session.title, sub: formatDate(date, true), actions: null, cls: "stack" },
      warmup ? h("p", { class: "muted" }, warmup) : null,
      exWrap,
      h("div", { class: "row" }, addSelect, addBtn),
      h("div", { class: "row" }, finishBtn, cancelBtn)));
    return;
  }
  const doneWrap = h("div", { class: "stack" });
  (session.exercises || []).forEach((entry) => {
    const doneSets = (entry.sets || []).filter((s) => s.done).map((s) => woFormatSet(s, entry.isBodyweight));
    doneWrap.append(h("div", { class: "list-item" },
      h("div", { class: "li-main" },
        h("div", { class: "li-title" }, entry.name || getExercise(entry.exerciseId)?.name || entry.exerciseId),
        h("div", { class: "li-sub" }, doneSets.length ? doneSets.join(", ") : "Kayıt yok"),
        h("div", { class: "li-sub muted" }, `Efor: ${woEffortLabel(entry.effort)} · Ağrı: ${entry.pain ? "Evet" : "Hayır"}`)
      )));
  });
  const editBtn = h("button", { type: "button", class: "btn" }, "Düzenle");
  editBtn.addEventListener("click", async () => {
    if (!(await confirmDialog("Seans yeniden düzenlenecek. Devam edilsin mi?"))) return;
    session.status = "in_progress";
    session.finishedAt = null;
    commit();
  });
  root.append(card({ title: session.title, sub: formatDate(date, true) + " · tamamlandı", actions: editBtn }, doneWrap));
}

function woPlanExerciseRow(planDay, p, idx) {
  const key = `${planDay.weekday}-${idx}`;
  const profile = APP.state.profile;
  const ex = getExercise(p.exerciseId);
  const nameEl = h("span", { class: "li-title" }, ex ? ex.name : p.exerciseId);
  const tipEl = ex && ex.tip ? h("span", { class: "muted small" }, ex.tip) : null;
  const setErr = h("p", { class: "error", role: "alert", hidden: true });
  const minErr = h("p", { class: "error", role: "alert", hidden: true });
  const maxErr = h("p", { class: "error", role: "alert", hidden: true });
  const restErr = h("p", { class: "error", role: "alert", hidden: true });
  const setId = `wo-pset-${key}`;
  const minId = `wo-pmin-${key}`;
  const maxId = `wo-pmax-${key}`;
  const restId = `wo-prest-${key}`;
  const setInp = woSetRowNumberInput(setId, p.sets, 1, 10, 1, "set");
  const minInp = woSetRowNumberInput(minId, p.repMin, 1, 100, 1, "min");
  const maxInp = woSetRowNumberInput(maxId, p.repMax, 1, 100, 1, "max");
  const restInp = woSetRowNumberInput(restId, p.restSec, 15, 600, 5, "sn");
  setInp.addEventListener("change", () => {
    const v = parseNum(setInp.value);
    if (!Number.isFinite(v) || !Number.isInteger(v) || v < 1 || v > 10) {
      woSetError(setInp, setErr, "Set 1–10 aralığında tam sayı olmalı.");
      return;
    }
    woClearSetError(setInp, setErr);
    p.sets = v;
    saveState();
  });
  minInp.addEventListener("change", () => {
    const v = parseNum(minInp.value);
    if (!Number.isFinite(v) || !Number.isInteger(v) || v < 1 || v > 100) {
      woSetError(minInp, minErr, "Min. tekrar 1–100 aralığında tam sayı olmalı.");
      return;
    }
    if (v > p.repMax) {
      woSetError(minInp, minErr, "Min. tekrar max. tekrardan büyük olamaz.");
      return;
    }
    woClearSetError(minInp, minErr);
    p.repMin = v;
    saveState();
  });
  maxInp.addEventListener("change", () => {
    const v = parseNum(maxInp.value);
    if (!Number.isFinite(v) || !Number.isInteger(v) || v < 1 || v > 100) {
      woSetError(maxInp, maxErr, "Max. tekrar 1–100 aralığında tam sayı olmalı.");
      return;
    }
    if (v < p.repMin) {
      woSetError(maxInp, maxErr, "Max. tekrar min. tekrardan küçük olamaz.");
      return;
    }
    woClearSetError(maxInp, maxErr);
    p.repMax = v;
    saveState();
  });
  restInp.addEventListener("change", () => {
    const v = parseNum(restInp.value);
    if (!Number.isFinite(v) || !Number.isInteger(v) || v < 15 || v > 600) {
      woSetError(restInp, restErr, "Dinlenme 15–600 aralığında tam sayı olmalı.");
      return;
    }
    woClearSetError(restInp, restErr);
    p.restSec = v;
    saveState();
  });
  const options = [[p.exerciseId, ex ? ex.name : p.exerciseId]].concat(alternativesFor(p.exerciseId, profile).map((a) => [a.id, a.name]));
  const selId = `wo-psel-${key}`;
  const sel = selectInput({ id: selId, options, value: p.exerciseId });
  sel.addEventListener("change", () => {
    const alt = getExercise(sel.value);
    if (!alt) return;
    p.exerciseId = alt.id;
    commit();
  });
  const rmBtn = h("button", { type: "button", class: "icon-btn", attrs: { "aria-label": "Hareketi sil" } }, icon("trash"));
  rmBtn.addEventListener("click", async () => {
    if (!(await confirmDialog("Bu hareket plandan çıkarılsın mı?", "Çıkar"))) return;
    planDay.exercises = (planDay.exercises || []).filter((e, i) => i !== idx);
    commit();
  });
  const mini = (label, inp) => {
    inp.style.width = "5.5rem";
    return h("label", { class: "stack small muted", for: inp.id, style: { gap: "2px" } }, label, inp);
  };
  sel.setAttribute("aria-label", "Hareketi değiştir");
  return h("div", { class: "ex-card stack" },
    h("div", { class: "row" }, nameEl, h("span", { class: "spacer" }), rmBtn),
    tipEl,
    h("div", { class: "row" }, mini("Set", setInp), mini("Min. tekrar", minInp), mini("Maks. tekrar", maxInp), mini("Dinlenme (sn)", restInp)),
    sel, setErr, minErr, maxErr, restErr);
}

function woRenderPlan(root) {
  const profile = APP.state.profile;
  const plan = APP.state.plan;
  if (!plan) {
    const btn = h("button", { type: "button", class: "btn btn-primary" }, "Plan oluştur");
    btn.addEventListener("click", () => {
      APP.state.plan = generatePlan(profile);
      commit();
    });
    root.append(emptyState("Henüz plan yok", "Profiline göre haftalık antrenman planı oluştur.", btn));
    return;
  }
  const regenBtn = h("button", { type: "button", class: "btn" }, "Planı yeniden oluştur");
  regenBtn.addEventListener("click", async () => {
    const ok = await confirmDialog("Haftalık plan profiline göre yeniden oluşturulacak. Plandaki elle yaptığın değişiklikler kaybolur; geçmiş antrenman kayıtların değişmez.", "Yeniden oluştur");
    if (!ok) return;
    APP.state.plan = generatePlan(profile);
    commit();
  });
  root.append(card({ title: "Haftalık plan", actions: regenBtn }, h("p", { class: "muted" }, "Plan değişiklikleri yalnızca gelecekteki seansları etkiler.")));
  (plan.days || []).forEach((day, idx) => {
    const wd = day.weekday || idx + 1;
    const badge = day.type === "rest" ? h("span", { class: "badge badge-info" }, "Dinlenme") : h("span", { class: "badge badge-ok" }, "Antrenman");
    const actions = [];
    const addBtn = () => {};
    if (day.type === "rest") {
      const toggle = h("button", { type: "button", class: "btn btn-sm" }, "Antrenman gününe çevir");
      toggle.addEventListener("click", () => {
        day.type = "workout";
        day.title = "Ek antrenman";
        day.exercises = [];
        commit();
      });
      actions.push(toggle);
    } else {
      const toggle = h("button", { type: "button", class: "btn btn-sm" }, "Dinlenme gününe çevir");
      toggle.addEventListener("click", async () => {
        if (!(await confirmDialog("Bu gün dinlenme günü yapılsın mı?"))) return;
        day.type = "rest";
        day.title = "Dinlenme";
        day.exercises = [];
        commit();
      });
      actions.push(toggle);
    }
    const body = [];
    if (day.type === "workout") {
      if (day.warmup) body.push(h("p", { class: "muted" }, `Isınma: ${day.warmup}`));
      const exWrap = h("div", { class: "stack" });
      (day.exercises || []).forEach((p, i) => exWrap.append(woPlanExerciseRow(day, p, i)));
      body.push(exWrap);
      const selId = `wo-plan-add-${idx}`;
      const addOptions = [[null, "Hareket seç…"]].concat(availableExercises(profile).map((ex) => [ex.id, ex.name]));
      const addSelect = selectInput({ id: selId, options: addOptions, value: null });
      addSelect.setAttribute("aria-label", "Eklenecek hareket");
      const addBtn = h("button", { type: "button", class: "btn" }, "Hareket ekle");
      addBtn.addEventListener("click", () => {
        const ex = getExercise(addSelect.value);
        if (!ex) { toast("Eklemek için bir hareket seç.", "err"); return; }
        const pre = prescription(ex, profile.experience);
        (day.exercises || (day.exercises = [])).push({ uid: uid("pe"), exerciseId: ex.id, sets: pre.sets, repMin: pre.repMin, repMax: pre.repMax, restSec: pre.restSec });
        commit();
      });
      body.push(h("div", { class: "row" }, addSelect, addBtn));
    }
    root.append(card({ title: `${WEEKDAYS[wd]} · ${day.title || (day.type === "rest" ? "Dinlenme" : "Antrenman")}`, actions: actions.length ? h("div", { class: "row" }, badge, ...actions) : null }, ...body));
  });
}

function woHistoryDetail(session) {
  const date = session.date;
  const totalEx = (session.exercises || []).length;
  const totalDone = (session.exercises || []).reduce((acc, e) => acc + (e.sets || []).filter((s) => s.done).length, 0);
  const summaryText = `${formatDate(date)} · ${session.title || "Seans"} · ${totalEx} hareket · ${totalDone} set`;
  const exWrap = h("div", { class: "stack" });
  (session.exercises || []).forEach((entry) => {
    const doneSets = (entry.sets || []).filter((s) => s.done).map((s) => woFormatSet(s, entry.isBodyweight));
    exWrap.append(h("div", { class: "list-item" },
      h("div", { class: "li-main" },
        h("div", { class: "li-title" }, entry.name || getExercise(entry.exerciseId)?.name || entry.exerciseId),
        h("div", { class: "li-sub" }, doneSets.length ? doneSets.join(", ") : "Kayıt yok"),
        h("div", { class: "li-sub muted" }, `Efor: ${woEffortLabel(entry.effort)} · Ağrı: ${entry.pain ? "Evet" : "Hayır"}`)
      )));
  });
  const openBtn = h("button", { type: "button", class: "btn btn-sm" }, "Bu seansı aç");
  openBtn.addEventListener("click", () => {
    APP.ui.date = date;

function woRenderHistory(root) {
  const done = (APP.state.sessions || []).filter((s) => s && s.status === "done").sort((a, b) => (b.startedAt || 0) - (a.startedAt || 0));
  if (!done.length) {
    root.append(emptyState("Henüz tamamlanmış seans yok", "Tamamladığın seanslar burada listelenir."));
    return;
  }
  const wrap = h("div", { class: "stack" });
  done.forEach((s) => wrap.append(woHistoryDetail(s)));
  root.append(card({ title: "Tamamlanan seanslar" }, wrap));
  const uniqueIds = [];
  done.forEach((s) => (s.exercises || []).forEach((e) => {
    if (e.exerciseId && !uniqueIds.includes(e.exerciseId)) uniqueIds.push(e.exerciseId);
  }));
  const histWrap = h("div", { class: "stack" });
  if (!uniqueIds.length) {
    histWrap.append(h("p", { class: "muted" }, "Kayıt yok"));
  } else {
    const selId = "wo-hist-ex";
    const options = uniqueIds.map((id) => [id, getExercise(id)?.name || id]);
    const sel = selectInput({ id: selId, options, value: uniqueIds[0] });
    const listWrap = h("div", { class: "stack" });
    const renderHist = () => {
      clear(listWrap);
      const rows = exerciseHistory(sel.value) || [];
      if (!rows.length) {
        listWrap.append(h("p", { class: "muted" }, "Kayıt yok"));
        return;
      }
      rows.forEach((r) => {
        const ex = getExercise(sel.value);
        let top;
        if (r.topWeight == null) top = ex && ex.bodyweight ? "VA" : "—";
        else top = (ex && ex.bodyweight && r.topWeight > 0 ? "+" : "") + fmtNum(r.topWeight, 1) + " kg";
        listWrap.append(h("div", { class: "list-item" }, h("div", { class: "li-main" },
          h("div", { class: "li-title" }, formatDate(r.date)),
          h("div", { class: "li-sub" }, `${top} × ${r.repsAtTop != null ? fmtNum(r.repsAtTop, 0) : "—"} tekrar`),
          h("div", { class: "li-sub muted" }, `Toplam tekrar: ${r.totalReps != null ? fmtNum(r.totalReps, 0) : "—"}`)
        )));
      });
    };
    renderHist();
    sel.addEventListener("change", renderHist);
    histWrap.append(sel, listWrap);
  }
  histWrap.append(h("p", { class: "muted small" }, "Farklı tekrar sayılarındaki ağırlıklar doğrudan karşılaştırılamaz; ağırlık ve tekrarı birlikte değerlendir."));
  root.append(card({ title: "Hareket geçmişi" }, histWrap));
}

const prMonthsShort = ["Oca", "Şub", "Mar", "Nis", "May", "Haz", "Tem", "Ağu", "Eyl", "Eki", "Kas", "Ara"];

function prStat(label, value, sub) {
  const el = h("div", { class: "stat" },
    h("div", { class: "stat-label" }, label),
    h("div", { class: "stat-value" }, value)
  );
  if (sub != null && sub !== "") el.appendChild(h("div", { class: "stat-sub" }, sub));
  return el;
}

function prChartNote(text) {
  return h("p", { class: "muted small" }, text);
}

function prPointDate(iso) {
  return formatDate(iso);
}

function prAriaValue(value, unit, decimals) {
  return `${fmtNum(value, decimals)}${unit ? " " + unit : ""}`;
}

function lineChart(points, opts) {
  const options = Object.assign({
    unit: "",
    label: "Grafik",
    series2: null,
    label2: "Seriyi 2",
    height: 220,
    decimals: 0
  }, opts || {});

  const realPoints = (points || []).filter(p => p && p.date && Number.isFinite(Number(p.value))).map(p => ({
    date: p.date,
    value: Number(p.value)
  }));

  if (realPoints.length === 0) {
    return emptyState("Bu aralıkta kayıt yok", "Grafik için yeterli kayıt bulunmuyor.");
  }

  const wrap = h("div", { class: "chart", attrs: { role: "img" } });
  const H = Number(options.height) || 220;
  const W = prChartWidth();
  const padL = 48;
  const padR = 12;
  const padT = 12;
  const padB = 28;
  const plotW = W - padL - padR;
  const plotH = H - padT - padB;

  let values = realPoints.map(p => p.value);
  let minV = Math.min.apply(null, values);
  let maxV = Math.max.apply(null, values);
  if (minV === maxV) {
    minV = minV - 1;
    maxV = maxV + 1;
  } else {
    const padY = (maxV - minV) * 0.05;
    minV = minV - padY;
    maxV = maxV + padY;
  }

  const firstDate = realPoints[0].date;
  const lastDate = realPoints[realPoints.length - 1].date;
  const span = daysBetween(firstDate, lastDate);

  function xFor(iso) {
    if (span <= 0) return padL + plotW / 2;
    return padL + (daysBetween(firstDate, iso) / span) * plotW;
  }
  function yFor(v) {
    return padT + (1 - (v - minV) / (maxV - minV)) * plotH;
  }
  function shortDate(iso) {
    return formatDate(iso);
  }

  const low = Math.min.apply(null, realPoints.map(p => p.value));
  const high = Math.max.apply(null, realPoints.map(p => p.value));
  let aria = `${options.label}: ${realPoints.length} kayıt, en düşük ${fmtNum(low, options.decimals)}${options.unit ? " " + options.unit : ""}, en yüksek ${fmtNum(high, options.decimals)}${options.unit ? " " + options.unit : ""}`;
  if (options.series2 && options.series2.length > 0) {
    aria += `; ${options.label2}: ${options.series2.length} kayıt`;
  }
  wrap.setAttribute("role", "img");
  wrap.setAttribute("aria-label", aria);

  if (realPoints.length === 1) {
    const p = realPoints[0];
    const svg = svgEl("svg", { viewBox: `0 0 ${W} ${H}` });
    const dot = svgEl("circle", { class: "ch-dot", cx: xFor(p.date), cy: yFor(p.value), r: 3 });
    const title = svgEl("title", {});
    title.textContent = `${shortDate(p.date)}: ${prAriaValue(p.value, options.unit, options.decimals)}`;
    dot.appendChild(title);
    svg.appendChild(dot);
    wrap.appendChild(svg);
    wrap.appendChild(prChartNote("Bu aralıkta tek kayıt var; trend çizilemez."));
    return wrap;
  }

  const svg = svgEl("svg", { viewBox: `0 0 ${W} ${H}` });
  let gridYs = [0, 1, 2, 3];
  for (const i of gridYs) {
    const gy = padT + (plotH / 3) * i;
    svg.appendChild(svgEl("line", { class: "ch-grid", x1: padL, x2: W - padR, y1: gy, y2: gy }));
    const val = maxV - ((maxV - minV) / 3) * i;
    const label = svgEl("text", { class: "ch-label", x: padL - 6, y: gy + 4, "text-anchor": "end" });
    label.textContent = fmtNum(val, options.decimals);
    svg.appendChild(label);
  }

  const xLabels = [firstDate];
  if (span > 0) xLabels.push(addDays(firstDate, Math.round(span / 2)));
  xLabels.push(lastDate);
  const seen = new Set();
  for (const iso of xLabels) {
    if (!iso || seen.has(iso)) continue;
    seen.add(iso);
    const tx = xFor(iso);
    const anchor = xLabels.length > 1 && iso === firstDate ? "start" : (xLabels.length > 1 && iso === lastDate ? "end" : "middle");
    const text = svgEl("text", { class: "ch-label", x: tx, y: H - 8, "text-anchor": anchor });
    text.textContent = shortDate(iso);
    svg.appendChild(text);
  }

  let d = "";
  realPoints.forEach((p, idx) => {
    const x = xFor(p.date);
    const y = yFor(p.value);
    if (idx === 0 || daysBetween(realPoints[idx - 1].date, p.date) > 7) {
      d += `M ${x} ${y} `;
    } else {
      d += `L ${x} ${y} `;
    }
  });
  svg.appendChild(svgEl("path", { class: "ch-line", d, fill: "none" }));

  if (options.series2 && options.series2.length > 0) {
    const s2 = options.series2.filter(p => p && p.date && Number.isFinite(Number(p.value))).map(p => ({ date: p.date, value: Number(p.value) }));
    if (s2.length > 0) {
      let d2 = "";
      s2.forEach((p, idx) => {
        const x = xFor(p.date);
        const y = yFor(p.value);
        if (idx === 0 || daysBetween(s2[idx - 1].date, p.date) > 7) d2 += `M ${x} ${y} `;
        else d2 += `L ${x} ${y} `;
      });
      svg.appendChild(svgEl("path", { class: "ch-line-2", d: d2, fill: "none" }));
    }
  }

  for (const p of realPoints) {
    const cx = xFor(p.date);
    const cy = yFor(p.value);
    const circle = svgEl("circle", { class: "ch-dot", cx: cx, cy: cy, r: 3 });
    const title = svgEl("title", {});
    title.textContent = options.titleForPoint
      ? `${shortDate(p.date)}: ${options.titleForPoint(p)}`
      : `${shortDate(p.date)}: ${prAriaValue(p.value, options.unit, options.decimals)}`;
    circle.appendChild(title);
    svg.appendChild(circle);
  }

  wrap.appendChild(svg);

  if (options.series2 && options.series2.length > 0) {
    const legend = h("div", { class: "ch-legend" },
      h("span", {}, options.label),
      h("span", { class: "muted" }, options.label2)
    );
    wrap.appendChild(legend);
  }

  return wrap;
}

function barChart(points, opts) {
  const options = Object.assign({
    label: "Grafik",
    unit: "",
    height: 220,
    decimals: 0
  }, opts || {});

  const realPoints = (points || []).filter(p => p && p.label != null && p.value != null).map(p => ({
    label: String(p.label),
    value: Number(p.value)
  }));

  if (realPoints.length === 0) {
    return emptyState("Bu aralıkta kayıt yok", "Grafik için yeterli kayıt bulunmuyor.");
  }

  if (realPoints.every(p => p.value === 0)) {
    return emptyState("Bu aralıkta kayıt yok", "Bu aralıkta tamamlanan kayıt yok.");
  }

  const wrap = h("div", { class: "chart", attrs: { role: "img" } });
  const H = Number(options.height) || 220;
  const W = prChartWidth();
  const padL = 48;
  const padR = 12;
  const padT = 28;
  const padB = 28;
  const plotW = W - padL - padR;
  const plotH = H - padT - padB;

  const maxRaw = Math.max.apply(null, realPoints.map(p => p.value).concat([0]));
  const maxV = maxRaw > 0 ? maxRaw * 1.05 : 1;
  const barW = Math.min(64, (plotW / realPoints.length) * 0.55);
  const step = plotW / realPoints.length;

  let total = 0;
  realPoints.forEach(p => { total += p.value; });
  const nonZero = realPoints.filter(p => p.value > 0).length;
  wrap.setAttribute("role", "img");
  wrap.setAttribute("aria-label", `${options.label}: ${realPoints.length} bar, toplam ${fmtNum(total, options.decimals)}${options.unit ? " " + options.unit : ""}`);

  const svg = svgEl("svg", { viewBox: `0 0 ${W} ${H}` });

  for (let i = 0; i < 4; i++) {
    const gy = padT + (plotH / 3) * i;
    svg.appendChild(svgEl("line", { class: "ch-grid", x1: padL, x2: W - padR, y1: gy, y2: gy }));
    const val = maxV - (maxV / 3) * i;
    const label = svgEl("text", { class: "ch-label", x: padL - 6, y: gy + 4, "text-anchor": "end" });
    label.textContent = fmtNum(val, options.decimals);
    svg.appendChild(label);
  }

  const showEvery = Math.max(1, Math.ceil(realPoints.length / 8));
  realPoints.forEach((p, i) => {
    const cx = padL + step * i + step / 2;
    const hPx = Math.max(0, (p.value / maxV) * plotH);
    const y = padT + plotH - hPx;
    const rect = svgEl("rect", { class: "ch-bar", x: cx - barW / 2, y: y, width: barW, height: hPx });
    const title = svgEl("title", {});
    title.textContent = `${p.label}: ${prAriaValue(p.value, options.unit, options.decimals)}`;
    rect.appendChild(title);
    svg.appendChild(rect);

    const valueText = svgEl("text", { class: "ch-label", x: cx, y: y - 6, "text-anchor": "middle" });
    valueText.textContent = fmtNum(p.value, options.decimals);
    svg.appendChild(valueText);

    if (i % showEvery === 0) {
      const label = svgEl("text", { class: "ch-label", x: cx, y: H - 8, "text-anchor": "middle" });
      label.textContent = p.label;
      svg.appendChild(label);
    }
  });

  wrap.appendChild(svg);
  return wrap;
}

function renderProgress(root) {
  clear(root);
  if (!APP.state.profile) return;

  if (!APP.ui.prRange || !["7", "30", "all"].includes(APP.ui.prRange)) APP.ui.prRange = "30";
  const to = todayISO();
  const from = APP.ui.prRange === "all" ? null : addDays(to, -(Number(APP.ui.prRange) - 1));

  const rangeSeg = segGroup({
    name: "prRange",
    legend: "Aralık",
    value: APP.ui.prRange,
    options: [["7", "Son 7 gün"], ["30", "Son 30 gün"], ["all", "Tüm zamanlar"]]
  });
  rangeSeg.querySelectorAll("input").forEach(inp => {
    inp.addEventListener("change", () => {
      APP.ui.prRange = inp.value;
      rerender();
    });
  });
  root.appendChild(rangeSeg);

  const entries = weightsInRange(from, to) || [];
  const editDate = APP.ui.prEditDate || APP.ui.date || to;
  const existingEntry = (APP.state.weights || []).find(w => w.date === editDate) || null;

  const weightForm = h("form", { class: "form", attrs: { novalidate: "true" } });
