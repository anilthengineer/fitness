const PATTERN_LABELS = { squat: "Bacak – squat", hinge: "Kalça/arka bacak", lunge: "Bacak – tek bacak", push_h: "Göğüs (yatay itiş)",
  push_v: "Omuz (dikey itiş)", pull_h: "Sırt (yatay çekiş)", pull_v: "Sırt (dikey çekiş)", shoulder_iso: "Omuz (izolasyon)",
  arms_bi: "Kol – biceps", arms_tri: "Kol – triceps", calf: "Baldır", core: "Karın/core", other: "Diğer" };

// Yerleşik hareketler + kullanıcının eklediği hareketler.
function allExercises() {
  return EXERCISES.concat((APP.state && APP.state.customExercises) || []);
}

function getExercise(id) {
  return allExercises().find(ex => ex.id === id) || null;
}

// Hareket seçimi için <select> içeriği: kas grubuna göre gruplanmış, kendi hareketlerin en üstte.
function exerciseSelectOptions(selectEl, selectedId, placeholder) {
  if (placeholder) selectEl.appendChild(h("option", { value: "", text: placeholder }));
  const custom = (APP.state.customExercises || []).slice().sort((a, b) => a.name.localeCompare(b.name, "tr"));
  if (custom.length) {
    const g = h("optgroup", { attrs: { label: "Kendi hareketlerim" } });
    custom.forEach(ex => g.appendChild(h("option", { value: ex.id, text: ex.name, selected: ex.id === selectedId ? true : undefined })));
    selectEl.appendChild(g);
  }
  Object.keys(PATTERN_LABELS).forEach(pat => {
    const list = EXERCISES.filter(ex => ex.pattern === pat);
    if (!list.length) return;
    const g = h("optgroup", { attrs: { label: PATTERN_LABELS[pat] } });
    list.forEach(ex => g.appendChild(h("option", { value: ex.id, text: ex.name, selected: ex.id === selectedId ? true : undefined })));
    selectEl.appendChild(g);
  });
  return selectEl;
}

// Kullanıcının kendi kuracağı boş plan: yedi gün de dinlenme olarak başlar.
function emptyPlan() {
  const days = [];
  for (let weekday = 1; weekday <= 7; weekday++) days.push({ weekday, type: "rest", title: "Dinlenme", warmup: "", exercises: [] });
  return { createdAt: Date.now(), days };
}

function planHasWorkouts() {
  return !!(APP.state.plan && APP.state.plan.days.some(d => d.type === "workout"));
}

function availableEquipment(profile) {
  const set = new Set(["bodyweight"]);
  if (profile && Array.isArray(profile.equipment)) {
    profile.equipment.forEach(id => set.add(id));
  }
  if (profile && profile.location === "gym") {
    EQUIPMENT.forEach(([id]) => set.add(id));
  }
  return set;
}

function availableExercises(profile) {
  const eq = availableEquipment(profile);
  return EXERCISES.filter(ex => ex.equipment.every(id => eq.has(id)));
}

function alternativesFor(exerciseId, profile) {
  const base = getExercise(exerciseId);
  if (!base) return [];
  return availableExercises(profile).filter(ex => ex.pattern === base.pattern && ex.id !== exerciseId);
}

function prescription(ex, experience) {
  const level = experience || "beginner";
  let base;
  if (ex.bodyweight) {
    base = level === "advanced" ? { sets: 4, repMin: 12, repMax: 25, restSec: 75 }
      : level === "intermediate" ? { sets: 3, repMin: 10, repMax: 20, restSec: 75 }
      : { sets: 2, repMin: 8, repMax: 15, restSec: 60 };
  } else if (ex.compound) {
    base = level === "advanced" ? { sets: 4, repMin: 5, repMax: 8, restSec: 150 }
      : level === "intermediate" ? { sets: 3, repMin: 6, repMax: 10, restSec: 120 }
      : { sets: 3, repMin: 8, repMax: 12, restSec: 90 };
  } else {
    base = level === "advanced" ? { sets: 3, repMin: 8, repMax: 12, restSec: 75 }
      : level === "intermediate" ? { sets: 3, repMin: 10, repMax: 15, restSec: 60 }
      : { sets: 2, repMin: 10, repMax: 15, restSec: 60 };
  }
  if (ex.pattern === "core") {
    base = { ...base, repMin: 10, repMax: 20 };
  }
  return base;
}

function generatePlan(profile) {
  const n0 = Math.min(6, Math.max(1, Number(profile.trainingDays) || 3));
  let chosenDays = Array.from(new Set((profile.availableDays || []).filter(d => d >= 1 && d <= 7))).sort((a,b)=>a-b);
  let n = n0;
  if (chosenDays.length === 0) {
    const defaults = {1:[3],2:[1,4],3:[1,3,5],4:[1,2,4,5],5:[1,2,3,5,6],6:[1,2,3,4,5,6]};
    chosenDays = (defaults[n0] || [1]).slice();
  } else if (chosenDays.length < n) {
    n = chosenDays.length;
  } else if (chosenDays.length > n) {
    const picked = [];
    for (let i = 0; i < n; i++) {
      picked.push(chosenDays[Math.round(i * chosenDays.length / n)]);
    }
    chosenDays = Array.from(new Set(picked)).sort((a,b)=>a-b);
  }
  n = chosenDays.length;

  const minutes = Number(profile.sessionMinutes) || 45;
  const K = minutes <= 30 ? 4 : minutes === 45 ? 5 : minutes === 60 ? 6 : 7;

  const templates = {
    FULL_A: { title: "Tüm vücut A", slots: ["squat","push_h","pull_h","hinge","push_v","core","arms_bi"] },
    FULL_B: { title: "Tüm vücut B", slots: ["hinge","push_v","pull_v","lunge","push_h","core","arms_tri"] },
    UPPER_A: { title: "Üst vücut A", slots: ["push_h","pull_h","push_v","pull_v","arms_bi","arms_tri","shoulder_iso"] },
    UPPER_B: { title: "Üst vücut B", slots: ["push_v","pull_v","push_h","pull_h","shoulder_iso","arms_tri","arms_bi"] },
    LOWER_A: { title: "Alt vücut A", slots: ["squat","hinge","lunge","calf","core","hinge","squat"] },
    LOWER_B: { title: "Alt vücut B", slots: ["hinge","squat","lunge","core","calf","lunge","core"] },
    PUSH: { title: "İtiş", slots: ["push_h","push_v","push_h","shoulder_iso","arms_tri","core","shoulder_iso"] },
    PULL: { title: "Çekiş", slots: ["pull_v","pull_h","hinge","arms_bi","pull_h","core","arms_bi"] },
    LEGS: { title: "Bacak", slots: ["squat","hinge","lunge","calf","core","squat","hinge"] }
  };

  const seqByN = {
    1: ["FULL_A"],
    2: ["FULL_A","FULL_B"],
    3: ["FULL_A","FULL_B","FULL_A"],
    4: ["UPPER_A","LOWER_A","UPPER_B","LOWER_B"],
    5: ["UPPER_A","LOWER_A","FULL_B","UPPER_B","LOWER_B"],
    6: ["PUSH","PULL","LEGS","PUSH","PULL","LEGS"]
  };
  const seq = (seqByN[n] || seqByN[3]).slice();

  // Ekipman varsa yüklü hareketler önce gelsin; vücut ağırlığı hareketleri yedek olarak kalsın.
  const available = availableExercises(profile).slice().sort((a, b) => Number(a.bodyweight) - Number(b.bodyweight));
  const counters = {};
  const usedByDay = {};
  const days = [];
  const chosenSet = new Set(chosenDays);

  const builtTemplates = {}; // aynı şablon (ör. Tüm vücut A) haftada tekrar ederse aynı hareketler kullanılsın
  for (let weekday = 1; weekday <= 7; weekday++) {
    if (!chosenSet.has(weekday)) {
      days.push({ weekday, type: "rest", title: "Dinlenme", warmup: "", exercises: [] });
      continue;
    }
    const idx = chosenDays.indexOf(weekday);
    const tmpl = templates[seq[idx]];
    const used = new Set();
    const exercises = [];

    const pick = (pattern) => {
      const all = available.filter(ex => ex.pattern === pattern && !used.has(ex.id));
      const loaded = all.filter(ex => !ex.bodyweight);
      const candidates = loaded.length ? loaded : all;
      if (!candidates.length) return null;
      const counter = counters[pattern] || 0;
      const chosen = candidates[counter % candidates.length];
      counters[pattern] = counter + 1;
      used.add(chosen.id);
      return chosen;
    };

    const slots = tmpl ? tmpl.slots.slice(0, K) : [];
    if (builtTemplates[seq[idx]]) {
      for (const pe of builtTemplates[seq[idx]]) exercises.push({ ...pe, uid: uid("pe") });
      days.push({ weekday, type: "workout", title: tmpl.title,
        warmup: "5–8 dk hafif kardiyo, eklem mobilitesi ve ilk harekete 1–2 hafif ısınma seti.", exercises });
      continue;
    }
    for (const slot of slots) {
      let ex = pick(slot);
      if (!ex && slot === "pull_v") ex = pick("pull_h");
      if (!ex && slot === "pull_h") ex = pick("pull_v");
      if (ex) {
        exercises.push({ uid: uid("pe"), exerciseId: ex.id, ...prescription(ex, profile.experience) });
      }
    }

    builtTemplates[seq[idx]] = exercises;
    days.push({
      weekday,
      type: "workout",
      title: tmpl ? tmpl.title : "Antrenman",
      warmup: "5–8 dk hafif kardiyo, eklem mobilitesi ve ilk harekete 1–2 hafif ısınma seti.",
      exercises
    });
  }

  return { createdAt: Date.now(), days };
}

function planDayFor(iso) {
  if (!APP.state || !APP.state.plan || !Array.isArray(APP.state.plan.days)) return null;
  return APP.state.plan.days.find(d => d.weekday === weekdayISO(iso)) || null;
}

function sessionsOn(iso) {
  return (APP.state.sessions || []).filter(s => s.date === iso);
}

function startSession(iso) {
  const existing = (APP.state.sessions || []).find(s => s.date === iso && s.status === "in_progress");
  if (existing) return existing;

  const planDay = planDayFor(iso);
  if (!planDay || planDay.type !== "workout") return null;

  const exercises = planDay.exercises.map(pe => {
    const ex = getExercise(pe.exerciseId);
    const perf = lastPerformance(pe.exerciseId);
    let weight = null;
    if (perf && Array.isArray(perf.sets)) {
      const nums = perf.sets.map(s => s.weight).filter(w => typeof w === "number" && isFinite(w) && w > 0);
      if (nums.length) weight = Math.max(...nums);
    }
    return {
      uid: uid("se"),
      exerciseId: pe.exerciseId,
      name: ex ? ex.name : "Silinmiş hareket",
      isBodyweight: ex ? Boolean(ex.bodyweight) : false,
      repMin: pe.repMin,
      repMax: pe.repMax,
      restSec: pe.restSec,
      sets: Array.from({ length: pe.sets }, () => ({ weight, reps: null, done: false })),
      effort: null,
      pain: false
    };
  });

  const session = {
    id: uid("s"),
    date: iso,
    title: planDay.title,
    startedAt: Date.now(),
    finishedAt: null,
    status: "in_progress",
    exercises
  };
  APP.state.sessions = APP.state.sessions || [];
  APP.state.sessions.push(session);
  return session;
}

// Planda antrenman olmayan bir gün için boş seans; hareketler seans içinde eklenir.
function startFreeSession(iso) {
  const existing = (APP.state.sessions || []).find(s => s.date === iso && s.status === "in_progress");
  if (existing) return existing;
  const session = { id: uid("s"), date: iso, title: "Serbest antrenman", startedAt: Date.now(), finishedAt: null, status: "in_progress", exercises: [] };
  APP.state.sessions.push(session);
  return session;
}

function lastPerformance(exerciseId, excludeSessionId) {
  const sessions = (APP.state.sessions || []).filter(s => s.status === "done" && s.id !== excludeSessionId);
  sessions.sort((a,b) => {
    if (a.date !== b.date) return a.date < b.date ? 1 : -1;
    return (b.finishedAt || 0) - (a.finishedAt || 0);
  });

  for (const session of sessions) {
    const entry = (session.exercises || []).find(e => e.exerciseId === exerciseId && Array.isArray(e.sets) && e.sets.some(s => s.done));
    if (entry) {
      return {
        date: session.date,
        sets: entry.sets.filter(s => s.done).map(s => ({ weight: s.weight, reps: s.reps, done: true }))
      };
    }
  }
  return null;
}

function suggestProgression(entry) {
  if (!entry || entry.pain) return null;
  const sets = entry.sets || [];
  if (!sets.length) return null;
  if (sets.some(s => !s.done)) return null;
  if (sets.some(s => s.reps == null || s.reps < entry.repMax)) return null;
  if (entry.effort !== "easy" && entry.effort !== "ok") return null;

  const weights = sets.map(s => s.weight).filter(w => typeof w === "number" && isFinite(w) && w > 0);
  if (!weights.length) {
    return {
      type: "reps",
      fromKg: null,
      toKg: null,
      text: "Tüm setlerde üst tekrar sınırına ulaştın. Sonraki seansta set başına 1–2 tekrar ekleyebilir ya da daha zor bir varyasyon deneyebilirsin."
    };
  }

  const from = Math.max(...weights);
  const inc = (getExercise(entry.exerciseId) || {}).increment || 2.5;
  const to = round(from + inc, 2);
  return {
    type: "weight",
    fromKg: from,
    toKg: to,
    text: `Sonraki seansta ${fmtNum(to, 2)} kg deneyebilirsin (+${fmtNum(inc, 2)} kg). Bu yalnızca bir öneri; otomatik uygulanmaz.`
  };
}

// ===== CALC =====
const ACTIVITY = {
  sedentary: { factor: 1.2, label: "Hareketsiz (masa başı, çok az yürüyüş)" },
  light: { factor: 1.375, label: "Hafif aktif (hafif egzersiz, haftada 1–3 gün)" },
  moderate: { factor: 1.55, label: "Orta aktif (haftada 3–5 gün egzersiz)" },
  active: { factor: 1.725, label: "Çok aktif (haftada 6–7 gün yoğun egzersiz)" },
  very_active: { factor: 1.9, label: "Aşırı aktif (fiziksel iş + yoğun antrenman)" }
};

const GOALS = [["lose", "Yağ kaybı"], ["gain", "Kas kazanımı"], ["maintain", "Kiloyu koruma"]];
const EXPERIENCE = [["beginner", "Başlangıç"], ["intermediate", "Orta"], ["advanced", "İleri"]];
const DIETS = [["omnivore", "Her şeyi yerim"], ["pescatarian", "Pesketaryen"], ["vegetarian", "Vejetaryen"], ["vegan", "Vegan"]];
const ALLERGENS = [
  ["gluten", "Gluten"], ["milk", "Süt"], ["egg", "Yumurta"], ["nuts", "Sert kabuklu yemişler"],
  ["peanut", "Yer fıstığı"], ["soy", "Soya"], ["fish", "Balık"], ["sesame", "Susam"]
];
const ALLERGEN_NOTE = "Alerjen filtresi yalnızca bu listedeki yiyecekler için geçerlidir. Ürün etiketlerini ve çapraz bulaşma riskini her zaman kendin kontrol et.";

function autoBlockers(profile) {
  const out = [];
  if (!profile) return out;
  const age = Number(profile.age);
  if (Number.isFinite(age) && age < 18) {
    out.push("18 yaş altı için otomatik enerji açığı ve diyet planı oluşturulmaz.");
  }
  return out;
}

function calcEnergy(profile, weightKg) {
  const missing = [];
  const age = Number(profile && profile.age);
  const heightCm = Number(profile && profile.heightCm);
  const kg = Number(weightKg);
  const activity = profile && ACTIVITY[profile.activity];

  if (!Number.isFinite(age) || age <= 0) missing.push("Yaş");
  if (!Number.isFinite(heightCm) || heightCm <= 0) missing.push("Boy");
  if (!Number.isFinite(kg) || kg <= 0) missing.push("Kilo");
  if (!activity || !Number.isFinite(activity.factor)) missing.push("Aktivite düzeyi");

  if (missing.length) return { ok: false, missing };

  const sex = profile.sex;
  let bmr;
  const assumptions = [
    "Mifflin–St Jeor: 10 × kilo (kg) + 6,25 × boy (cm) − 5 × yaş + (erkek +5 / kadın −161)"
  ];

  if (sex === "male") {
    bmr = 10 * kg + 6.25 * heightCm - 5 * age + 5;
  } else if (sex === "female") {
    bmr = 10 * kg + 6.25 * heightCm - 5 * age - 161;
  } else {
    bmr = 10 * kg + 6.25 * heightCm - 5 * age - 78;
    assumptions.push("Cinsiyet belirtilmediği için erkek ve kadın formüllerinin ortalaması kullanıldı; sonuç daha belirsizdir.");
  }

  const tdee = bmr * activity.factor;

  assumptions.push(`Aktivite katsayısı: ${activity.factor} (${activity.label})`);
  assumptions.push("Sonuçlar tahminidir; kesin ihtiyaç veya tıbbi öneri değildir.");

  return { ok: true, bmr: round(bmr), factor: activity.factor, tdee: round(tdee), assumptions };
}

function macroKcal(p, f, c) {
  return round(Number(p || 0) * 4 + Number(f || 0) * 9 + Number(c || 0) * 4);
}

function suggestTargets(profile, weightKg) {
  if (autoBlockers(profile).length) return null;
  const energy = calcEnergy(profile, weightKg);
  if (!energy || !energy.ok) return null;

  const kg = Number(weightKg);
  const goal = profile && profile.goal;
  let kcalFactor = 1.0;
  let proteinFactor = 1.6;
  let goalNote = "Tahmini harcama düzeyi.";

  if (goal === "lose") {
    kcalFactor = 0.85;
    proteinFactor = 2.0;
    goalNote = "Tahmini harcamanın yaklaşık %15 altı (ölçülü açık).";
  } else if (goal === "gain") {
    kcalFactor = 1.07;
    proteinFactor = 1.8;
    goalNote = "Tahmini harcamanın yaklaşık %7 üstü (ölçülü fazla).";
  }

  let kcal = energy.tdee * kcalFactor;
  if (goal === "lose") kcal = Math.max(kcal, energy.bmr);
  kcal = Math.round(kcal / 10) * 10;

  const proteinG = round(kg * proteinFactor);
  const fatG = round((kcal * 0.27) / 9);
  let carbG = round((kcal - proteinG * 4 - fatG * 9) / 4);
  if (carbG < 50) carbG = 50;

  const finalKcal = macroKcal(proteinG, fatG, carbG);

  const notes = [
    goalNote,
    `Protein: ${fmtNum(proteinFactor, 1)} g/kg`,
    "Yağ: enerjinin yaklaşık %27'si",
    "Karbonhidrat: kalan enerji"
  ];

  return { kcal: finalKcal, proteinG, fatG, carbG, notes };
}

function allFoods() {
  const custom = (APP.state && APP.state.customFoods) || [];
  return FOODS.concat(custom);
}

function foodById(id) {
  if (id == null) return null;
  const foods = allFoods();
  for (let i = 0; i < foods.length; i++) {
    if (foods[i] && foods[i].id === id) return foods[i];
  }
  return null;
}

function nutritionFor(food, amount, unit) {
  const n = { kcal: 0, p: 0, f: 0, c: 0 };
  if (!food || !food.per100) return n;
  const amt = Number(amount);
  if (!Number.isFinite(amt) || amt <= 0) return n;

  let grams;
  if (unit === "portion" && food.portion && Number.isFinite(Number(food.portion.grams))) {
    grams = amt * Number(food.portion.grams);
  } else {
    grams = amt;
  }

  const k = grams / 100;
  n.kcal = round(Number(food.per100.kcal || 0) * k);
  n.p = round(Number(food.per100.p || 0) * k, 1);
  n.f = round(Number(food.per100.f || 0) * k, 1);
  n.c = round(Number(food.per100.c || 0) * k, 1);
  return n;
}

function dayTotals(iso) {
  const out = { count: 0, kcal: 0, p: 0, f: 0, c: 0 };
  const day = getDay(iso);
  if (!day || !Array.isArray(day.meals)) return out;

  out.count = day.meals.length;
  for (let i = 0; i < day.meals.length; i++) {
    const meal = day.meals[i];
    const snap = meal && meal.snap;
    if (!snap) continue;
    out.kcal += Number(snap.kcal || 0);
    out.p += Number(snap.p || 0);
    out.f += Number(snap.f || 0);
    out.c += Number(snap.c || 0);
  }

  out.kcal = round(out.kcal);
  out.p = round(out.p, 1);
  out.f = round(out.f, 1);
  out.c = round(out.c, 1);
  return out;
}

function foodAllowed(food, profile) {
  if (!food || !profile) return false;

  const foodAllergens = Array.isArray(food.allergens) ? food.allergens : [];
  const profileAllergens = Array.isArray(profile.allergens) ? profile.allergens : [];
  for (let i = 0; i < foodAllergens.length; i++) {
    if (profileAllergens.indexOf(foodAllergens[i]) !== -1) return false;
  }

  const diet = profile.diet;
  if (diet === "vegan" && food.diet !== "plant") return false;
  // İçeriği bilinmeyen (internetten eklenen) ürünler et içerebilir; kısıtlı beslenmede menüye alınmaz.
  if ((diet === "vegetarian" || diet === "pescatarian") && food.diet === "other") return false;
  if (diet === "vegetarian" && (food.diet === "meat" || food.diet === "fish")) return false;
  if (diet === "pescatarian" && food.diet === "meat") return false;

  const disliked = Array.isArray(profile.disliked) ? profile.disliked : [];
  const name = String(food.name || "").toLocaleLowerCase("tr");
  for (let i = 0; i < disliked.length; i++) {
    const token = String(disliked[i] || "").trim().toLocaleLowerCase("tr");
    if (token.length >= 2 && name.indexOf(token) !== -1) return false;
  }

  return true;
}

function generateMenu(profile, targets) {
  const slots = { breakfast: [], lunch: [], dinner: [], snack: [] };
  const createdAt = Date.now();
  if (!targets || !Number.isFinite(Number(targets.proteinG)) || !Number.isFinite(Number(targets.carbG))) {
    return { createdAt, slots };
  }

  // Kuru (çiğ, yüksek enerjili) tahıl ve baklagiller menüde gramajı yanıltıcı olur; menüde pişmiş halleri kullanılır.
  const allowed = allFoods().filter(function (food) {
    if (food.state === "raw" && Number(food.per100 && food.per100.kcal) > 250 && (food.role === "carb" || food.role === "protein")) return false;
    return foodAllowed(food, profile);
  });

  const shares = { breakfast: 0.25, lunch: 0.30, dinner: 0.30, snack: 0.15 };
  const proteinTotal = Number(targets.proteinG || 0);
  const carbTotal = Number(targets.carbG || 0);

  const trName = function (s) {
    return String(s || "").toLocaleLowerCase("tr");
  };

  const stateScore = function (food) {
    return food.state === "cooked" || food.state === "ready" ? 2 : 0;
  };

  const usedVeg = [];
  const pick = function (candidates, excludeIds, slot, role) {
    let best = null;
    let bestScore = -Infinity;
    for (let i = 0; i < candidates.length; i++) {
      const food = candidates[i];
      if (!food) continue;
      if (excludeIds && excludeIds.indexOf(food.id) !== -1) continue;

      let score = stateScore(food);

      if (role === "protein-or-dairy") {
        if (food.role === "dairy" || food.diet === "egg" || food.diet === "dairy") score += 3;
        score += Number(food.per100 && food.per100.p || 0) / 4; // protein yoğun olan (yumurta, süzme yoğurt) öne çıksın
      }
      if (role === "veg" && usedVeg.indexOf(food.id) !== -1) score -= 3; // öğünler arasında sebze çeşitliliği

      if (role === "protein" && (food.diet === "meat" || food.diet === "fish")) score += 1;
      if (role === "fat" && trName(food.name).indexOf("zeytinyağı") !== -1) score += 2;

      if (role === "carb" && food.diet === "honey") score -= 10;
      if (role === "carb") {
        const n = trName(food.name);
        if (slot === "breakfast") {
          if (n.indexOf("yulaf") !== -1) score += 5;
          if (n.indexOf("ekmek") !== -1) score += 4;
          if (n.indexOf("tam tahıl") !== -1) score += 2;
          if (n.indexOf("bulgur") !== -1) score += 1;
        } else {
          if (n.indexOf("bulgur") !== -1) score += 2;
          if (n.indexOf("pirinç") !== -1) score += 2;
          if (n.indexOf("makarna") !== -1) score += 1;
        }
      }

      if (score > bestScore || (score === bestScore && best && food.name.localeCompare(best.name, "tr") < 0)) {
        best = food;
        bestScore = score;
      }
    }
    return best;
  };

  const candidatesFor = function (slot, role) {
    if (slot === "breakfast" && role === "protein-or-dairy") {
      return allowed.filter(function (f) {
        return f.role === "protein" || f.role === "dairy" || f.diet === "egg" || f.diet === "dairy";
      });
    }
    if (role === "protein") return allowed.filter(function (f) { return f.role === "protein"; });
    if (role === "carb") return allowed.filter(function (f) { return f.role === "carb"; });
    if (role === "veg") return allowed.filter(function (f) { return f.role === "veg"; });
    if (role === "fat") return allowed.filter(function (f) { return f.role === "fat"; });
    if (role === "fruit") return allowed.filter(function (f) { return f.role === "fruit"; });
    if (role === "nuts-or-dairy") return allowed.filter(function (f) { return f.role === "nuts" || f.role === "dairy"; });
    return [];
  };

  const round5 = function (value, min, max, fallback) {
    let v = Number(value);
    if (!Number.isFinite(v)) v = Number(fallback);
    if (!Number.isFinite(v)) v = 0;
    v = Math.round(v / 5) * 5;
    return Math.max(min, Math.min(max, v));
  };

  const isDairyLike = function (food) {
    return food.role === "dairy" || food.diet === "dairy";
  };

  const proteinGramsFor = function (food, slot) {
    const p100 = Number(food.per100 && food.per100.p);
    const target = proteinTotal * shares[slot] * 0.6;
    if (!Number.isFinite(p100) || p100 <= 0) return 100;
    return (target * 100) / p100;
  };

  const carbGramsFor = function (food, slot) {
    const c100 = Number(food.per100 && food.per100.c);
    const target = carbTotal * shares[slot] * 0.7;
    if (!Number.isFinite(c100) || c100 <= 0) return 100;
    return (target * 100) / c100;
  };

  const portionGrams = function (food, fallback) {
    const p = food.portion ? Number(food.portion.grams) : NaN;
    return Number.isFinite(p) && p > 0 ? p : fallback;
  };

  const addIfFood = function (slotKey, role, candidates, excludeIds) {
    const food = pick(candidates, excludeIds || [], slotKey, role);
    if (!food) return null;

    let grams;
    if (role === "protein-or-dairy" && slotKey === "breakfast") {
      grams = isDairyLike(food)
        ? portionGrams(food, 150)
        : proteinGramsFor(food, slotKey);
      grams = round5(grams, 50, 250, 100);
    } else if (role === "protein") {
      grams = round5(proteinGramsFor(food, slotKey), 50, 250, 100);
    } else if (role === "carb") {
      grams = round5(carbGramsFor(food, slotKey), 30, 300, 100);
    } else if (role === "veg") {
      grams = round5(150, 50, 300, 150);
    } else if (role === "fat") {
      grams = round5(10, 5, 30, 10);
    } else if (role === "fruit") {
      grams = round5(portionGrams(food, 150), 50, 300, 150);
    } else if (role === "nuts-or-dairy") {
      if (food.role === "nuts") {
        grams = round5(20, 10, 50, 20);
      } else {
        grams = round5(portionGrams(food, 150), 50, 300, 150);
      }
    } else {
      grams = 0;
    }

    if (grams > 0) {
      if (role === "veg") usedVeg.push(food.id);
      slots[slotKey].push({ foodId: food.id, grams, role: role === "protein-or-dairy" ? "protein" : role });
      return food;
    }
    return null;
  };

  // Breakfast
  const breakfastUsed = [];
  const breakfastProtein = addIfFood("breakfast", "protein-or-dairy", candidatesFor("breakfast", "protein-or-dairy"), breakfastUsed);
  addIfFood("breakfast", "carb", candidatesFor("breakfast", "carb"), breakfastUsed);
  addIfFood("breakfast", "veg", candidatesFor("breakfast", "veg"), breakfastUsed);
  addIfFood("breakfast", "fat", candidatesFor("breakfast", "fat"), breakfastUsed);

  // Lunch
  const lunchUsed = breakfastProtein ? [breakfastProtein.id] : [];
  const lunchProtein = addIfFood("lunch", "protein", candidatesFor("lunch", "protein"), lunchUsed);
  const lunchCarb = addIfFood("lunch", "carb", candidatesFor("lunch", "carb"), lunchUsed);
  addIfFood("lunch", "veg", candidatesFor("lunch", "veg"), lunchUsed);
  addIfFood("lunch", "fat", candidatesFor("lunch", "fat"), lunchUsed);

  // Dinner
  const dinnerUsed = [];
  const dinnerProteinExclude = [lunchProtein, breakfastProtein].filter(Boolean).map(function (f) { return f.id; });
  const dinnerCarbExclude = lunchCarb ? [lunchCarb.id] : [];
  addIfFood("dinner", "protein", candidatesFor("dinner", "protein"), dinnerProteinExclude);
  addIfFood("dinner", "carb", candidatesFor("dinner", "carb"), dinnerCarbExclude);
  addIfFood("dinner", "veg", candidatesFor("dinner", "veg"), dinnerUsed);
  addIfFood("dinner", "fat", candidatesFor("dinner", "fat"), dinnerUsed);

  // Snack
  const snackUsed = [];
  addIfFood("snack", "fruit", candidatesFor("snack", "fruit"), snackUsed);
  addIfFood("snack", "nuts-or-dairy", candidatesFor("snack", "nuts-or-dairy"), snackUsed);

  // Miktarları hedefe yaklaştır: önce protein kaynaklarını, sonra kalan enerjiye göre karbonhidratları ölçekle.
  const allItems = [].concat(slots.breakfast, slots.lunch, slots.dinner, slots.snack);
  const sumOf = function (filterFn, key) {
    let t = 0;
    allItems.filter(filterFn).forEach(function (it) {
      const f = foodById(it.foodId);
      if (f) t += nutritionFor(f, it.grams, "g")[key];
    });
    return t;
  };
  const isP = function (it) { return it.role === "protein"; };
  const isC = function (it) { return it.role === "carb"; };
  const otherP = sumOf(function (it) { return !isP(it); }, "p");
  const curP = sumOf(isP, "p");
  if (curP > 0) {
    const k = Math.max(0.7, Math.min(1.8, (proteinTotal - otherP) / curP));
    allItems.filter(isP).forEach(function (it) { it.grams = round5(it.grams * k, 50, 300, it.grams); });
  }
  const kcalTarget = Number(targets.kcal || 0);
  const nonCarbKcal = sumOf(function (it) { return !isC(it); }, "kcal");
  const carbKcal = sumOf(isC, "kcal");
  if (carbKcal > 0 && kcalTarget > 0) {
    const k = Math.max(0.5, Math.min(2.2, (kcalTarget - nonCarbKcal) / carbKcal));
    allItems.filter(isC).forEach(function (it) { it.grams = round5(it.grams * k, 30, 450, it.grams); });
  }
  allItems.forEach(function (it) { delete it.role; });

  return { createdAt, slots };
}

function menuTotals(menu) {
  const out = { kcal: 0, p: 0, f: 0, c: 0 };
  if (!menu || !menu.slots) return out;

  const slotKeys = ["breakfast", "lunch", "dinner", "snack"];
  for (let s = 0; s < slotKeys.length; s++) {
    const items = menu.slots[slotKeys[s]] || [];
    for (let i = 0; i < items.length; i++) {
      const item = items[i];
      if (!item) continue;
      const food = foodById(item.foodId);
      if (!food) continue;
      const n = nutritionFor(food, item.grams, "g");
      out.kcal += n.kcal;
      out.p += n.p;
      out.f += n.f;
      out.c += n.c;
    }
  }

  out.kcal = round(out.kcal);
  out.p = round(out.p, 1);
  out.f = round(out.f, 1);
  out.c = round(out.c, 1);
  return out;
}

function shoppingList(menu, days) {
  const out = [];
  if (!menu || !menu.slots) return out;
  const d = Number.isFinite(Number(days)) ? Number(days) : 1;

  const map = Object.create(null);
  const slotKeys = ["breakfast", "lunch", "dinner", "snack"];

  for (let s = 0; s < slotKeys.length; s++) {
    const items = menu.slots[slotKeys[s]] || [];
    for (let i = 0; i < items.length; i++) {
      const item = items[i];
      if (!item) continue;
      const food = foodById(item.foodId);
      if (!food) continue;
      const g = Number(item.grams || 0) * d;
      if (!Number.isFinite(g)) continue;
      if (!map[item.foodId]) {
        map[item.foodId] = { foodId: item.foodId, name: food.name, state: food.state, grams: 0 };
      }
      map[item.foodId].grams += g;
    }
  }

  for (const key in map) {
    if (Object.prototype.hasOwnProperty.call(map, key)) {
      const row = map[key];
      row.grams = round(row.grams);
      out.push(row);
    }
  }

  out.sort(function (a, b) {
    return String(a.name).localeCompare(String(b.name), "tr");
  });

  return out;
}

function weightsInRange(fromIso, toIso) {
  const weights = (APP.state && APP.state.weights) || [];
  const out = [];
  for (let i = 0; i < weights.length; i++) {
    const w = weights[i];
    if (!w || !Number.isFinite(Number(w.kg))) continue;
    if (fromIso && w.date < fromIso) continue;
    if (toIso && w.date > toIso) continue;
    out.push(w);
  }
  return out;
}

function avg7Weight(iso) {
  if (!iso) return null;
  const from = addDays(iso, -6);
  const list = weightsInRange(from, iso);
  if (list.length < 3) return null;
  let sum = 0;
  for (let i = 0; i < list.length; i++) sum += Number(list[i].kg);
  return round(sum / list.length, 1);
}

function metricSeries(field, fromIso, toIso) {
  const days = (APP.state && APP.state.days) || {};
  const out = [];
  const keys = Object.keys(days).sort();

  for (let i = 0; i < keys.length; i++) {
    const date = keys[i];
    if (fromIso && date < fromIso) continue;
    if (toIso && date > toIso) continue;
    const day = days[date];
    if (!day) continue;
    const value = day[field];
    if (value == null) continue;
    const v = Number(value);
    if (!Number.isFinite(v)) continue;
    out.push({ date, value: v });
  }

  return out;
}

function sessionsPerWeek(fromIso, toIso) {
  const sessions = (APP.state && APP.state.sessions) || [];
  const counts = Object.create(null);

  for (let i = 0; i < sessions.length; i++) {
    const s = sessions[i];
    if (!s || s.status !== "done" || !s.date) continue;
    if (fromIso && s.date < fromIso) continue;
    if (toIso && s.date > toIso) continue;
    const ws = startOfWeek(s.date);
    counts[ws] = (counts[ws] || 0) + 1;
  }

  const keys = Object.keys(counts).sort();
  if (keys.length === 0) return [];

  let out;
  if (fromIso != null && keys.length > 1) {
    const first = keys[0];
    const last = keys[keys.length - 1];
    out = [];
    let ws = first;
    while (ws <= last) {
      out.push({ weekStart: ws, count: counts[ws] || 0 });
      ws = addDays(ws, 7);
    }
  } else {
    out = keys.map(function (ws) {
      return { weekStart: ws, count: counts[ws] };
    });
  }

  return out;
}

function exerciseHistory(exerciseId) {
  const sessions = (APP.state && APP.state.sessions) || [];
  const done = sessions.filter(function (s) {
    return s && s.status === "done" && s.date;
  }).sort(function (a, b) {
    if (a.date < b.date) return -1;
    if (a.date > b.date) return 1;
    return Number(a.startedAt || 0) - Number(b.startedAt || 0);
  });

  const out = [];
  for (let i = 0; i < done.length; i++) {
    const session = done[i];
    const exs = session.exercises || [];
    for (let j = 0; j < exs.length; j++) {
      const ex = exs[j];
      if (!ex || ex.exerciseId !== exerciseId) continue;

      const sets = ex.sets || [];
      const doneSets = sets.filter(function (set) {
        return set && set.done === true;
      });

      if (doneSets.length === 0) continue;

      let topWeight = null;
      let repsAtTop = null;
      let totalReps = 0;

      for (let k = 0; k < doneSets.length; k++) {
        const set = doneSets[k];
        const w = Number(set.weight);
        const r = Number(set.reps);
        if (Number.isFinite(r)) totalReps += r;
        if (Number.isFinite(w)) {
          if (topWeight === null || w > topWeight) {
            topWeight = w;
            repsAtTop = Number.isFinite(r) ? r : null;
          } else if (w === topWeight && Number.isFinite(r)) {
            if (repsAtTop === null || r > repsAtTop) repsAtTop = r;
          }
        }
      }

      out.push({
        date: session.date,
        topWeight: topWeight === null ? null : round(topWeight, 1),
        repsAtTop,
        totalReps: round(totalReps),
        sets: doneSets
      });
    }
  }

  return out;
}

function weeklyReview(weekStartIso) {
  const weekEnd = addDays(weekStartIso, 6);
  const prevStart = addDays(weekStartIso, -7);
  const prevEnd = addDays(weekStartIso, -1);

  const plan = APP.state && APP.state.plan;
  // Yalnızca bugüne kadar gelmiş günlerdeki planlı seanslar sayılır (hafta ortasında eksik gösterilmesin).
  let planned = 0;
  if (plan && Array.isArray(plan.days)) {
    const today = todayISO();
    for (let i = 0; i <= 6; i++) {
      const date = addDays(weekStartIso, i);
      if (date > today) break;
      const pd = plan.days.find(function (d) { return d && d.weekday === weekdayISO(date); });
      if (pd && pd.type === "workout") planned++;
    }
  }

  const sessions = (APP.state && APP.state.sessions) || [];
  let completed = 0;
  for (let i = 0; i < sessions.length; i++) {
    const s = sessions[i];
    if (!s || s.status !== "done" || !s.date) continue;
    if (s.date >= weekStartIso && s.date <= weekEnd) completed++;
  }

  const days = (APP.state && APP.state.days) || {};
  const weights = (APP.state && APP.state.weights) || [];

  const dates = [];
  for (let i = 0; i <= 6; i++) dates.push(addDays(weekStartIso, i));

  let loggedDays = 0;
  const sleepValues = [];
  const stepValues = [];
  const weekWeights = [];
  const prevWeights = [];

  for (let i = 0; i < dates.length; i++) {
    const date = dates[i];
    const day = days[date];
    let hasDayRecord = false;

    if (day) {
      hasDayRecord = (day.waterMl != null && Number.isFinite(Number(day.waterMl))) ||
        (day.steps != null && Number.isFinite(Number(day.steps))) ||
        (day.sleepHours != null && Number.isFinite(Number(day.sleepHours))) ||
        (day.energy != null && Number.isFinite(Number(day.energy))) ||
        (day.soreness != null && Number.isFinite(Number(day.soreness))) ||
        String(day.note || "").trim().length > 0 ||
        Array.isArray(day.meals) && day.meals.length > 0;

      if (day.sleepHours != null && Number.isFinite(Number(day.sleepHours))) {
        sleepValues.push(Number(day.sleepHours));
      }
      if (day.steps != null && Number.isFinite(Number(day.steps))) {
        stepValues.push(Number(day.steps));
      }
    }

    const dayWeights = weights.filter(function (w) {
      return w && w.date === date && Number.isFinite(Number(w.kg));
    });
    if (dayWeights.length > 0) hasDayRecord = true;

    const daySessions = sessions.filter(function (s) {
      return s && s.status === "done" && s.date === date;
    });
    if (daySessions.length > 0) hasDayRecord = true;

    if (hasDayRecord) loggedDays++;

    for (let j = 0; j < dayWeights.length; j++) weekWeights.push(Number(dayWeights[j].kg));
  }

  for (let i = 0; i < weights.length; i++) {
    const w = weights[i];
    if (!w || !Number.isFinite(Number(w.kg))) continue;
    if (w.date >= prevStart && w.date <= prevEnd) prevWeights.push(Number(w.kg));
  }

  const avg = function (arr) {
    if (!arr.length) return null;
    let sum = 0;
    for (let i = 0; i < arr.length; i++) sum += arr[i];
    return sum / arr.length;
  };

  const weightAvg = weekWeights.length >= 3 ? round(avg(weekWeights), 1) : null;
  const prevWeightAvg = prevWeights.length >= 3 ? round(avg(prevWeights), 1) : null;
  const weightChange = (weightAvg != null && prevWeightAvg != null) ? round(weightAvg - prevWeightAvg, 1) : null;

  const sleepDays = sleepValues.length;
  const stepsDays = stepValues.length;
  const sleepAvg = sleepDays >= 3 ? round(avg(sleepValues), 1) : null;
  const stepsAvg = stepsDays >= 3 ? round(avg(stepValues)) : null;

  const insufficient = [];
  if (weightChange == null) {
    insufficient.push("Kilo değişimi için yeterli veri yok (iki haftada da en az 3 tartı kaydı gerekir).");
  }
  if (sleepAvg == null) {
    insufficient.push("Uyku ortalaması için en az 3 günlük kayıt gerekir.");
  }
  if (stepsAvg == null) {
    insufficient.push("Adım ortalaması için en az 3 günlük kayıt gerekir.");
  }

  const summaryParts = [];
  summaryParts.push(`Planlanan seans: ${planned}; kaydedilen: ${completed}.`);
  summaryParts.push(`Haftada ${loggedDays} gün kayıt var.`);
  if (weightAvg != null) summaryParts.push(`Haftalık ortalama kilo: ${fmtNum(weightAvg, 1)} kg.`);
  if (prevWeightAvg != null) summaryParts.push(`Önceki haftalık ortalama kilo: ${fmtNum(prevWeightAvg, 1)} kg.`);
  if (weightChange != null) summaryParts.push(`Ortalama kilo değişimi: ${fmtNum(weightChange, 1)} kg.`);
  if (sleepAvg != null) summaryParts.push(`Ortalama uyku: ${fmtNum(sleepAvg, 1)} saat (${sleepDays} gün).`);
  if (stepsAvg != null) summaryParts.push(`Ortalama adım: ${fmtNum(stepsAvg)} adım (${stepsDays} gün).`);

  const suggestions = [];
  const profile = APP.state && APP.state.profile;

  if (planned > 0 && completed < planned) {
    suggestions.push(`Planlanan ${planned} seansın ${completed} tanesi kaydedildi. Gelecek hafta için gün sayısını gerçekçi tutmak ya da seansları kısaltmak işini kolaylaştırabilir.`);
  }

  if (sleepAvg != null && sleepAvg < 7) {
    suggestions.push(`Ortalama uyku ${fmtNum(sleepAvg, 1)} saat. Yatış saatini 15–30 dakika öne çekmeyi deneyebilirsin.`);
  }

  if (stepsAvg != null && stepsAvg < 7000) {
    suggestions.push(`Günlük adım ortalaması ${fmtNum(stepsAvg)}. Gün içine 10–15 dakikalık bir yürüyüş eklemek kolay bir başlangıç olabilir.`);
  }

  if (loggedDays < 4) {
    suggestions.push("Daha net bir değerlendirme için haftada en az 4 gün kayıt girmeyi deneyebilirsin.");
  }

  const goal = profile && profile.goal;
  if (weightChange != null && ((goal === "lose" && weightChange > 0.3) || (goal === "gain" && weightChange < -0.2))) {
    suggestions.push("Haftalık kilo ortalaması hedefinin tersi yönde değişti. Tek haftalık değişim yanıltıcı olabilir; bir hafta daha gözlemleyip öğün kayıtlarını gözden geçirmek yeterli olabilir.");
  }

  if (suggestions.length === 0) {
    suggestions.push("Mevcut düzenini sürdürmek iyi bir seçenek görünüyor.");
  }

  const finalSuggestions = suggestions.slice(0, 3);

  return {
    weekStart: weekStartIso,
    weekEnd,
    planned,
    completed,
    loggedDays,
    weightAvg,
    prevWeightAvg,
    weightChange,
    sleepAvg,
    sleepDays,
    stepsAvg,
    stepsDays,
    insufficient,
    summary: summaryParts.join(" "),
    suggestions: finalSuggestions,
    enough: loggedDays > 0
  };
}


// ===== Hareket istatistikleri (PR ve gelişim) =====
// Tahmini 1 tekrar maksimumu (Epley). 12 tekrar üstünde güvenilmez olduğu için hesaplanmaz.
function estimate1RM(weight, reps) {
  if (!(weight > 0) || !(reps > 0) || reps > 12) return null;
  return reps === 1 ? weight : round(weight * (1 + reps / 30), 1);
}

// fromIso null ise tüm zamanlar. Yalnızca tamamlanmış setler sayılır.
function exerciseStats(exerciseId, fromIso) {
  const hist = exerciseHistory(exerciseId).filter(r => !fromIso || r.date >= fromIso);
  const all = exerciseHistory(exerciseId);
  const res = { sessions: hist.length, prWeight: null, bestE1rm: null, bestReps: null, first: null, last: null, change: null, allTimePr: null };
  const scan = (rows, target) => {
    rows.forEach(r => r.sets.forEach(st => {
      const w = Number(st.weight), reps = Number(st.reps);
      if (Number.isFinite(w) && w > 0 && Number.isFinite(reps) && reps > 0) {
        if (!target.prWeight || w > target.prWeight.weight || (w === target.prWeight.weight && reps > target.prWeight.reps)) target.prWeight = { weight: w, reps, date: r.date };
        const e = estimate1RM(w, reps);
        if (e != null && (!target.bestE1rm || e > target.bestE1rm.value)) target.bestE1rm = { value: e, weight: w, reps, date: r.date };
      }
      if (Number.isFinite(reps) && reps > 0 && !(w > 0)) {
        if (!target.bestReps || reps > target.bestReps.reps) target.bestReps = { reps, date: r.date };
      }
    }));
  };
  scan(hist, res);
  const allRes = {}; scan(all, allRes); res.allTimePr = allRes.prWeight || null;
  const weighted = hist.filter(r => r.topWeight != null);
  if (weighted.length) {
    res.first = { date: weighted[0].date, weight: weighted[0].topWeight, reps: weighted[0].repsAtTop };
    const l = weighted[weighted.length - 1];
    res.last = { date: l.date, weight: l.topWeight, reps: l.repsAtTop };
    if (weighted.length >= 2) res.change = round(res.last.weight - res.first.weight, 2);
  }
  return res;
}

// Seans bitirilirken yeni ağırlık rekorlarını bulur (önceki tamamlanmış seanslarla karşılaştırır).
function newPRsInSession(session) {
  const out = [];
  (session.exercises || []).forEach(e => {
    const top = Math.max(0, ...(e.sets || []).filter(st => st.done && Number(st.weight) > 0 && Number(st.reps) > 0).map(st => Number(st.weight)));
    if (!(top > 0)) return;
    let prev = 0;
    (APP.state.sessions || []).forEach(s => {
      if (s.id === session.id || s.status !== "done") return;
      (s.exercises || []).forEach(x => {
        if (x.exerciseId !== e.exerciseId) return;
        (x.sets || []).forEach(st => { if (st.done && Number(st.weight) > prev && Number(st.reps) > 0) prev = Number(st.weight); });
      });
    });
    if (top > prev && prev > 0) out.push({ name: e.name, weight: top, prev });
  });
  return out;
}

// ===== Vücut yağ oranı (ABD Donanması yöntemi, tahmini) =====
// Ölçüler cm. Erkek: bel, boyun, boy. Kadın: bel, kalça, boyun, boy.
function navyBodyFat(sex, heightCm, m) {
  if (!m || !(heightCm > 0) || !(m.neckCm > 0) || !(m.waistCm > 0)) return null;
  let bf = null;
  if (sex === "male") {
    if (m.waistCm - m.neckCm <= 0) return null;
    bf = 495 / (1.0324 - 0.19077 * Math.log10(m.waistCm - m.neckCm) + 0.15456 * Math.log10(heightCm)) - 450;
  } else if (sex === "female") {
    if (!(m.hipCm > 0) || m.waistCm + m.hipCm - m.neckCm <= 0) return null;
    bf = 495 / (1.29579 - 0.35004 * Math.log10(m.waistCm + m.hipCm - m.neckCm) + 0.22100 * Math.log10(heightCm)) - 450;
  } else {
    return null;
  }
  if (!Number.isFinite(bf) || bf < 2 || bf > 70) return null;
  return round(bf, 1);
}

// Yağ oranı için neyin eksik olduğunu Türkçe söyler (hesaplanabiliyorsa boş dizi).
function bodyFatMissing(sex, m) {
  if (sex !== "male" && sex !== "female") return ["Cinsiyet (formül erkek ve kadın için farklı; profilde 'paylaşmak istemiyorum' seçili)"];
  const need = [["waistCm", "Bel"], ["neckCm", "Boyun"]].concat(sex === "female" ? [["hipCm", "Kalça"]] : []);
  return need.filter(([k]) => !(m && m[k] > 0)).map(([, l]) => l);
}

function measurementsInRange(fromIso, toIso) {
  return (APP.state.measurements || []).filter(m => (!fromIso || m.date >= fromIso) && (!toIso || m.date <= toIso));
}

// ===== PROFILE =====
// ===== Profil: ilk kurulum sihirbazı ve ayarlar =====

const PF_SESSION_MINUTES = [30, 45, 60, 75, 90, 105, 120, 135, 150, 165, 180];

function pfMinutesLabel(m) {
  if (m < 60) return `${m} dk`;
  const hr = Math.floor(m / 60), rest = m % 60;
  return rest ? `${hr} sa ${rest} dk` : `${hr} saat`;
}

// Bir grup (seçim/çip) için hata satırı; setFieldError ilk girdinin id'si + "-err" ile bulur.
function groupWrap(groupEl, hint) {
  const first = groupEl.querySelector("input");
  const err = h("p", { class: "error", role: "alert", hidden: true, id: first ? first.id + "-err" : undefined });
  const wrap = h("div", { class: "field wide" }, groupEl);
  if (hint) wrap.appendChild(h("p", { class: "hint" }, hint));
  wrap.appendChild(err);
  return wrap;
}

function firstInputOf(el) {
  return el ? el.querySelector("input") : null;
}

function isFiniteNumber(n) {
  return n != null && Number.isFinite(n);
}

// Profil alanlarını dört bölüm halinde kurar. read() profil nesnesini döndürür (önce validateStep ile doğrulanmalı).
function pfBuild(profile) {
  const isEdit = Boolean(profile);
  const val = (k, d) => (profile && profile[k] != null ? profile[k] : d);

  const ageInput = numberInput({ id: "pf-age", value: val("age", null), step: 1, placeholder: "Örn. 28" });
  const heightInput = numberInput({ id: "pf-height", value: val("heightCm", null), step: 1, placeholder: "Örn. 175" });
  const weightInput = numberInput({ id: "pf-weight", value: isEdit ? currentWeight() : null, step: 0.1, placeholder: "Örn. 72,5" });
  const targetInput = numberInput({ id: "pf-targetWeight", value: val("targetWeightKg", null), step: 0.1, placeholder: "İsteğe bağlı" });

  const sexGroup = segGroup({ name: "pf-sex", legend: "Cinsiyet",
    options: [["male", "Erkek"], ["female", "Kadın"], ["unspecified", "Paylaşmak istemiyorum"]], value: val("sex", "") });
  const goalGroup = segGroup({ name: "pf-goal", legend: "Hedefin ne?", options: GOALS, value: val("goal", "") });
  const expGroup = segGroup({ name: "pf-experience", legend: "Antrenman deneyimin", options: EXPERIENCE, value: val("experience", "") });
  const activitySelect = selectInput({ id: "pf-activity", value: val("activity", ""),
    options: [["", "Seç…"], ...Object.entries(ACTIVITY).map(([v, it]) => [v, it.label])] });
  const daysSelect = selectInput({ id: "pf-trainingDays", value: profile ? String(profile.trainingDays) : "",
    options: [["", "Seç…"], ["1", "1 gün"], ["2", "2 gün"], ["3", "3 gün"], ["4", "4 gün"], ["5", "5 gün"], ["6", "6 gün"]] });
  const availGroup = chipGroup({ name: "pf-availableDays", legend: "Hangi günler uygun?",
    options: [1, 2, 3, 4, 5, 6, 7].map(d => [String(d), WEEKDAYS_SHORT[d]]),
    values: profile && Array.isArray(profile.availableDays) ? profile.availableDays.map(String) : [] });
  const minutesSelect = selectInput({ id: "pf-sessionMinutes", value: profile ? String(profile.sessionMinutes) : "",
    options: [["", "Seç…"], ...PF_SESSION_MINUTES.map(m => [String(m), pfMinutesLabel(m)])] });
  const locGroup = segGroup({ name: "pf-location", legend: "Nerede çalışıyorsun?", options: [["home", "Evde"], ["gym", "Spor salonunda"]], value: val("location", "") });
  const equipGroup = chipGroup({ name: "pf-equipment", legend: "Elindeki ekipmanlar", options: EQUIPMENT.filter(([id]) => id !== "bodyweight"),
    values: profile && Array.isArray(profile.equipment) ? profile.equipment.slice() : [] });
  const dietSelect = selectInput({ id: "pf-diet", value: val("diet", ""), options: [["", "Seç…"], ...DIETS] });
  const allergenGroup = chipGroup({ name: "pf-allergens", legend: "Alerjilerin", options: ALLERGENS,
    values: profile && Array.isArray(profile.allergens) ? profile.allergens.slice() : [] });
  const dislikedInput = textInput({ id: "pf-disliked", value: profile && Array.isArray(profile.disliked) ? profile.disliked.join(", ") : "",
    placeholder: "Örn. brokoli, ton balığı" });
  const limitsInput = h("textarea", { class: "input", id: "pf-limitations", rows: 3, maxlength: 500, value: val("limitations", ""),
    placeholder: "Örn. diz ağrısı nedeniyle derin squat yapmıyorum." });

  const sections = [
    { title: "Seni tanıyalım", sub: "Enerji ihtiyacını tahmin etmek için kullanılır.", fields: [
      field({ label: "Yaş", input: ageInput }),
      field({ label: "Boy (cm)", input: heightInput }),
      field({ label: "Kilo (kg)", input: weightInput }),
      groupWrap(sexGroup, "Yalnızca tahmini enerji ve yağ oranı hesabında kullanılır.")
    ] },
    { title: "Hedefin", sub: "Önerilen kalori ve makro hedefleri buna göre hazırlanır.", fields: [
      groupWrap(goalGroup), groupWrap(expGroup),
      field({ label: "Günlük aktivite düzeyi", input: activitySelect, wide: true }),
      field({ label: "Hedef kilo (kg)", input: targetInput, hint: "İstersen boş bırakabilirsin." })
    ] },
    { title: "Antrenman tercihlerin", sub: "Planını kendin kuracaksın; bu bilgiler isteğe bağlı hazır şablon ve hareket önerileri içindir.", fields: [
      field({ label: "Haftada kaç gün?", input: daysSelect }),
      field({ label: "Bir seans ne kadar sürebilir?", input: minutesSelect }),
      groupWrap(availGroup), groupWrap(locGroup),
      groupWrap(equipGroup, "Vücut ağırlığı hareketleri her zaman dahildir.")
    ] },
    { title: "Beslenme ve kısıtlar", sub: "Örnek menüde alerjen ve sevmediğin yiyecekler çıkarılır.", fields: [
      field({ label: "Beslenme tercihi", input: dietSelect, wide: true }),
      groupWrap(allergenGroup),
      field({ label: "Sevmediğin yiyecekler", input: dislikedInput, hint: "Virgülle ayır.", wide: true }),
      field({ label: "Hareket kısıtların", input: limitsInput, wide: true,
        hint: "Uygulama tıbbi değerlendirme yapmaz; zorlandığın hareketleri planından çıkarabilir veya değiştirebilirsin." })
    ] }
  ];

  const err = (input, msg, st) => { setFieldError(input, msg); if (!st.first) st.first = input; };
  const checks = [
    (st) => {
      const age = parseNum(ageInput.value);
      // Görünür bir aralık yok; yalnızca açık yazım hatalarını (ör. 250) yakalar.
      if (!isFiniteNumber(age) || !Number.isInteger(age) || age < 10 || age > 120) err(ageInput, "Geçerli bir yaş gir.", st);
      const hgt = parseNum(heightInput.value);
      if (!isFiniteNumber(hgt) || hgt < 100 || hgt > 250) err(heightInput, "Boyunu santimetre olarak gir (örn. 175).", st);
      const kg = parseNum(weightInput.value);
      if (!isFiniteNumber(kg) || kg < 25 || kg > 350) err(weightInput, "Kilonu kilogram olarak gir (örn. 72,5).", st);
      if (!sexGroup.querySelector("input:checked")) err(firstInputOf(sexGroup), "Bir seçenek seç.", st);
    },
    (st) => {
      if (!goalGroup.querySelector("input:checked")) err(firstInputOf(goalGroup), "Bir hedef seç.", st);
      if (!expGroup.querySelector("input:checked")) err(firstInputOf(expGroup), "Deneyimini seç.", st);
      if (!activitySelect.value) err(activitySelect, "Aktivite düzeyini seç.", st);
      const t = parseNum(targetInput.value);
      if (t != null && (!isFiniteNumber(t) || t < 25 || t > 350)) err(targetInput, "Hedef kiloyu kilogram olarak gir veya boş bırak.", st);
    },
    (st) => {
      const n = Number(daysSelect.value);
      if (!n) err(daysSelect, "Gün sayısını seç.", st);
      if (!minutesSelect.value) err(minutesSelect, "Seans süresini seç.", st);
      if (n && readChecks(availGroup, "pf-availableDays").length < n) err(firstInputOf(availGroup), `En az ${n} gün seç.`, st);
      if (!locGroup.querySelector("input:checked")) err(firstInputOf(locGroup), "Bir seçenek seç.", st);
    },
    (st) => {
      if (!dietSelect.value) err(dietSelect, "Beslenme tercihini seç.", st);
    }
  ];

  // Adımı doğrular; hatalı ilk alana odaklanır. quiet=true ise yalnızca sonucu döndürür.
  function validateStep(i, quiet) {
    const st = { first: null };
    checks[i](st);
    if (st.first && !quiet) st.first.focus();
    return !st.first;
  }

  function read() {
    const kg = parseNum(weightInput.value);
    return {
      profile: {
        age: parseNum(ageInput.value),
        heightCm: parseNum(heightInput.value),
        weightKg: profile && Number.isFinite(profile.weightKg) ? profile.weightKg : kg,
        sex: sexGroup.querySelector("input:checked").value,
        goal: goalGroup.querySelector("input:checked").value,
        experience: expGroup.querySelector("input:checked").value,
        activity: activitySelect.value,
        trainingDays: Number(daysSelect.value),
        availableDays: Array.from(new Set(readChecks(availGroup, "pf-availableDays").map(Number))).sort((a, b) => a - b),
        sessionMinutes: Number(minutesSelect.value),
        location: locGroup.querySelector("input:checked").value,
        equipment: readChecks(equipGroup, "pf-equipment"),
        diet: dietSelect.value,
        allergens: readChecks(allergenGroup, "pf-allergens"),
        disliked: dislikedInput.value.split(",").map(x => x.trim()).filter(Boolean),
        limitations: limitsInput.value.trim(),
        targetWeightKg: parseNum(targetInput.value),
        createdAt: profile && profile.createdAt ? profile.createdAt : Date.now(),
        updatedAt: Date.now()
      },
      weightKg: kg
    };
  }

  // Hata mesajlarını temizlemek için tüm alanları kapsayan liste.
  const allFields = () => sections.flatMap(s => s.fields);
  return { sections, validateStep, read, allFields };
}

function pfClearErrors(pf) {
  pf.allFields().forEach(f => clearFieldErrors(f));
}

function pfAfterFirstSave(p, weightKg) {
  APP.state.profile = p;
  upsertWeight(todayISO(), weightKg);
  APP.state.plan = emptyPlan();
  const t = suggestTargets(p, weightKg);
  APP.state.nutrition.targets = t ? { kcal: t.kcal, proteinG: t.proteinG, fatG: t.fatG, carbG: t.carbG, source: "auto", updatedAt: Date.now() } : null;
  APP.ui.pfStep = 0;
  saveState();
  toast("Profilin hazır. Şimdi Antrenman → Plan'dan kendi planını kurabilirsin.", "ok");
  navigate("today");
}

function renderOnboarding(root) {
  clear(root);
  // Alanlar sihirbaz boyunca aynı DOM öğeleridir; adım değişince girilen değerler korunur.
  const pf = APP.ui.pfBuilder || (APP.ui.pfBuilder = pfBuild(null));
  const step = Math.max(0, Math.min(3, APP.ui.pfStep || 0));
  const sec = pf.sections[step];

  const backupInput = h("input", { type: "file", accept: ".json,application/json", attrs: { id: "onboarding-backup" }, style: { display: "none" } });
  backupInput.addEventListener("change", () => {
    const file = backupInput.files && backupInput.files[0];
    if (file) importBackup(file);
    backupInput.value = "";
  });

  const hero = h("section", { class: "welcome" },
    h("div", { class: "welcome-mark", attrs: { "aria-hidden": "true" } }, icon("workout")),
    h("div", { class: "welcome-text" },
      h("h2", { class: "welcome-title", text: step === 0 ? "Hoş geldin!" : "Profilini tamamlayalım" }),
      h("p", { class: "muted", text: "Antrenmanını, beslenmeni ve ilerlemeni tek yerden takip et. Verilerin yalnızca bu cihazda saklanır." })),
    h("div", { class: "row" },
      h("button", { type: "button", class: "btn btn-sm", on: { click: () => openGuide() } }, icon("help"), "Nasıl kullanılır?"),
      h("label", { for: "onboarding-backup", class: "btn btn-sm btn-ghost", attrs: { tabindex: "0", role: "button" }, on: { keydown: filePickerKey } },
        icon("upload"), "Yedekten geri yükle"),
      backupInput)
  );

  const steps = h("ol", { class: "stepper", attrs: { "aria-label": "Kurulum adımları" } },
    pf.sections.map((s, i) => h("li", { class: i === step ? "current" : i < step ? "done" : "", attrs: i === step ? { "aria-current": "step" } : {} },
      h("span", { class: "step-dot" }, i < step ? icon("check") : String(i + 1)), h("span", { class: "step-label", text: s.title }))));

  const form = h("form", { class: "form", attrs: { novalidate: "" } }, sec.fields);
  const backBtn = h("button", { type: "button", class: "btn", disabled: step === 0 ? true : undefined,
    on: { click: () => { APP.ui.pfStep = step - 1; rerender(); } } }, icon("chevron-left"), "Geri");
  const nextBtn = h("button", { type: "submit", class: "btn btn-primary" }, step === 3 ? "Kaydet ve başla" : "Devam", icon(step === 3 ? "check" : "chevron-right"));
  form.appendChild(h("div", { class: "form-actions wizard-actions" }, backBtn, h("span", { class: "spacer" }), nextBtn));

    e.preventDefault();
    pfClearErrors(pf);
