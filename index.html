function prEntryCard(to) {
  const editDate = APP.ui.prEditDate || (APP.ui.date <= to ? APP.ui.date : to);
  const wEntry = APP.state.weights.find(w => w.date === editDate) || null;
  const mEntry = APP.state.measurements.find(m => m.date === editDate) || null;
  const dateInput = h("input", { class: "input", type: "date", id: "pr-date", value: editDate, max: to });
  const kgInput = numberInput({ id: "pr-kg", value: wEntry ? wEntry.kg : null, step: 0.1, placeholder: "Örn. 78,5" });
  const mInputs = {};
  MEASURES.forEach(([k]) => { mInputs[k] = numberInput({ id: `pr-${k}`, value: mEntry ? mEntry[k] : null, step: 0.1, placeholder: "cm" }); });

  const form = h("form", { class: "form", attrs: { novalidate: "" } },
    field({ label: "Tarih", input: dateInput }),
    field({ label: "Kilo (kg)", input: kgInput }),
    h("p", { class: "field wide small muted", text: "Vücut ölçüleri (cm) — hepsi isteğe bağlı. Mezurayı sıkmadan, her seferinde aynı noktadan ölç." }),
    MEASURES.map(([k, label]) => field({ label, input: mInputs[k] })),
    h("details", { class: "field wide measure-help" }, h("summary", { text: "Nereden ölçülür?" }),
      h("ul", { class: "small" },
        ["Bel: göbek deliği hizasından, nefesi normal verdikten sonra.", "Boyun: gırtlağın hemen altından, mezura hafif aşağı eğimli.",
         "Kalça: kalçanın en geniş yerinden.", "Göğüs: meme ucu hizasından.", "Omuz genişliği: iki omuz başının en dış noktaları arasındaki çevre.",
         "Kol: pazının en kalın yerinden, kol gevşek.", "Uyluk: kasığın biraz altından, en kalın yerinden.", "Baldır: en kalın yerinden."]
          .map(t => h("li", { text: t })))),
    h("div", { class: "form-actions" }, h("button", { type: "submit", class: "btn btn-primary" }, wEntry || mEntry ? "Kaydı güncelle" : "Kaydet")));

  dateInput.addEventListener("change", () => {
    if (/^\d{4}-\d{2}-\d{2}$/.test(dateInput.value) && dateInput.value <= to) { APP.ui.prEditDate = dateInput.value; rerender(); }
  });
  form.addEventListener("submit", (e) => {
    e.preventDefault();
    clearFieldErrors(form);
    const iso = dateInput.value;
    if (!/^\d{4}-\d{2}-\d{2}$/.test(iso) || iso > to) { setFieldError(dateInput, "Bugünden sonraki bir tarih girilemez."); dateInput.focus(); return; }
    let first = null;
    const kg = parseNum(kgInput.value);
    if (kg != null && (!Number.isFinite(kg) || kg < 25 || kg > 350)) { setFieldError(kgInput, "Kiloyu kilogram olarak gir (örn. 78,5)."); first = first || kgInput; }
    const vals = {};
    MEASURES.forEach(([k, label]) => {
      const v = parseNum(mInputs[k].value);
      if (v != null && (!Number.isFinite(v) || v < 10 || v > 250)) { setFieldError(mInputs[k], `${label} ölçüsünü santimetre olarak gir.`); first = first || mInputs[k]; }
      vals[k] = v;
    });
    if (first) { first.focus(); return; }
    const anyMeasure = MEASURES.some(([k]) => vals[k] != null);
    if (kg == null && !anyMeasure && !wEntry && !mEntry) { setFieldError(kgInput, "Kaydetmek için en az bir değer gir."); kgInput.focus(); return; }
    // Formdaki boş alan, o tarihteki değeri siler (form o günün mevcut değerleriyle doldurulur).
    if (kg != null) upsertWeight(iso, kg);
    else { const i = APP.state.weights.findIndex(w => w.date === iso); if (i >= 0) APP.state.weights.splice(i, 1); }
    upsertMeasurement(iso, vals);
    APP.ui.prEditDate = null;
    commit();
    toast(wEntry || mEntry ? "Kayıt güncellendi." : "Kayıt eklendi.", "ok");
  });

  // Son kayıtlar (kilo ve ölçüler tarih bazında birlikte).
  const dates = Array.from(new Set(APP.state.weights.map(w => w.date).concat(APP.state.measurements.map(m => m.date)))).sort().reverse().slice(0, 8);
  const list = h("div", { class: "list" });
  dates.forEach(d => {
    const w = APP.state.weights.find(x => x.date === d);
    const m = APP.state.measurements.find(x => x.date === d);
    const parts = [];
    if (w) parts.push(`${fmtNum(w.kg, 1)} kg`);
    if (m) MEASURES.forEach(([k, label]) => { if (m[k] != null) parts.push(`${label} ${fmtNum(m[k], 1)}`); });
    const edit = h("button", { type: "button", class: "btn btn-sm btn-ghost" }, "Düzenle");
    edit.addEventListener("click", () => { APP.ui.prEditDate = d; rerender(); window.scrollTo(0, 0); });
    const del = h("button", { type: "button", class: "btn btn-sm btn-ghost", attrs: { "aria-label": `${formatDate(d, true)} kaydını sil` } }, icon("trash"));
    del.addEventListener("click", async () => {
      if (!(await confirmDialog(`${formatDate(d, true)} tarihli kilo ve ölçü kaydı silinsin mi?`, "Sil"))) return;
      APP.state.weights = APP.state.weights.filter(x => x.date !== d);
      APP.state.measurements = APP.state.measurements.filter(x => x.date !== d);
      if (APP.ui.prEditDate === d) APP.ui.prEditDate = null;
      commit();
      toast("Kayıt silindi.", "ok");
    });
    list.append(h("div", { class: "list-item" },
      h("div", { class: "li-main" }, h("div", { class: "li-title", text: formatDate(d, true) }), h("div", { class: "li-sub", text: parts.join(" · ") || "—" })),
      h("div", { class: "li-actions" }, edit, del)));
  });

  return card({ title: "Kilo ve vücut ölçüsü kaydı", sub: "Her tarih için tek kayıt tutulur; aynı tarihi seçersen mevcut kaydı düzenlersin." },
    form, dates.length ? h("h3", { class: "small muted sub-head", text: "Son kayıtlar" }) : null, dates.length ? list : null);
}

function renderReview(root) {
  clear(root);
  if (!APP.state.profile) return;

  if (!APP.ui.reviewWeek) APP.ui.reviewWeek = startOfWeek(todayISO());
  const currentWeekStart = startOfWeek(todayISO());
  let weekStart = startOfWeek(APP.ui.reviewWeek);
  if (weekStart > currentWeekStart) weekStart = currentWeekStart;
  APP.ui.reviewWeek = weekStart;

  const weekEnd = addDays(weekStart, 6);
  const heading = h("h2", { class: "card-title" }, prWeekTitle(weekStart));
  const prevBtn = h("button", { class: "btn btn-ghost", type: "button" }, h("span", {}, "Önceki hafta"));
  const nextBtn = h("button", { class: "btn btn-ghost", type: "button" }, h("span", {}, "Sonraki hafta"));
  if (weekStart >= currentWeekStart) nextBtn.disabled = true;

  prevBtn.addEventListener("click", () => {
    APP.ui.reviewWeek = addDays(weekStart, -7);
    rerender();
  });
  nextBtn.addEventListener("click", () => {
    APP.ui.reviewWeek = addDays(weekStart, 7);
    rerender();
  });

  root.appendChild(h("div", { class: "row" },
    prevBtn,
    heading,
    h("span", { class: "spacer" }),
    nextBtn
  ));

  const r = weeklyReview(weekStart) || {};
  if (!r.enough) {
    root.appendChild(emptyState("Bu hafta için kayıt yok", "Değerlendirme yalnızca girdiğin kayıtlara dayanır."));
    return;
  }

  const planned = prPick(r, "plannedSessions", "planned", "scheduled", "expectedSessions");
  const completed = prPick(r, "completedSessions", "done", "completed", "finished", "workouts");
  const recorded = prPick(r, "recordedDays", "daysRecorded", "loggedDays", "entryDays");
  const weightAvg = prPick(r, "weightAvg", "avgWeight", "weightAverage");
  const weightChange = prPick(r, "weightChange", "weightDelta", "deltaWeight", "changeVsPrev", "kiloChange");
  const sleepAvg = prPick(r, "sleepAvg", "avgSleep", "sleepAverage");
  const stepsAvg = prPick(r, "stepsAvg", "avgSteps", "stepsAverage");

  root.appendChild(h("div", { class: "stats" },
    prStat("Planlanan seans", planned == null ? "—" : fmtNum(planned, 0)),
    prStat("Tamamlanan seans", completed == null ? "—" : fmtNum(completed, 0)),
    prStat("Kayıt girilen gün", recorded == null ? "—" : `${fmtNum(recorded, 0)} / 7`),
    prStat("Kilo ortalaması", weightAvg == null ? "—" : `${fmtNum(weightAvg, 1)} kg`, prWeightChangeText(weightChange)),
    prStat("Uyku ortalaması", sleepAvg == null ? "Yetersiz veri" : `${fmtNum(sleepAvg, 1)} saat`),
    prStat("Adım ortalaması", stepsAvg == null ? "Yetersiz veri" : `${fmtNum(stepsAvg, 0)} adım`)
  ));

  const summary = h("div", { class: "stack" });
  let summaryList = Array.isArray(r.summary) ? r.summary : (r.summary ? [r.summary] : []);
  if (summaryList.length === 0) summaryList = ["Bu hafta için özet üretilemedi."];
  for (const s of summaryList) {
    const p = h("p", {}, String(s));
    if (s && String(s).trim()) summary.appendChild(p);
  }
  root.appendChild(card({ title: "Özet" }, summary));

  const insufficient = Array.isArray(r.insufficient) ? r.insufficient : (r.insufficient ? [r.insufficient] : []);
  if (insufficient.length > 0) {
    const insList = h("div", { class: "list" });
    for (const item of insufficient) {
      insList.appendChild(h("div", { class: "list-item" }, h("div", { class: "li-main muted" }, String(item))));
    }
    root.appendChild(card({ title: "Veri yetersiz olan alanlar" }, insList));
  }

  const suggestions = Array.isArray(r.suggestions) ? r.suggestions.slice(0, 3) : [];
  const sugCard = card({ title: "Gelecek hafta için öneriler" });
  if (suggestions.length === 0) {
    sugCard.appendChild(h("p", { class: "muted" }, "Öneri yok."));
  } else {
    const ol = h("ol");
    for (const s of suggestions) ol.appendChild(h("li", {}, String(s)));
    sugCard.appendChild(ol);
  }
  root.appendChild(sugCard);

  root.appendChild(h("p", { class: "muted small" }, "Bu değerlendirme yalnızca kayıtlarına dayalı kurallarla üretilir; yapay zekâ analizi veya sağlık değerlendirmesi değildir. Kaydı olmayan günlerden sonuç çıkarılmaz."));
}

function prWeekTitle(weekStartIso) {
  const start = parseISO(weekStartIso);
  const end = parseISO(addDays(weekStartIso, 6));
  return `${start.getDate()} ${prMonthsShort[start.getMonth()]} – ${end.getDate()} ${prMonthsShort[end.getMonth()]} ${end.getFullYear()}`;
}

function prPick(obj, ...keys) {
  if (!obj) return null;
  for (const k of keys) {
    if (obj[k] !== undefined && obj[k] !== null) return obj[k];
  }
  return null;
}

function prWeightChangeText(change) {
  const n = Number(change);
  if (change === null || change === undefined || Number.isNaN(n)) return "—";
  const sign = n > 0 ? "+" : "";
  return `${sign}${fmtNum(n, 1)} kg`;
}

// Grafik genişliği görünüm alanına göre seçilir; böylece eksen yazıları her ekranda ~11 px kalır.
function prChartWidth() {
  const view = document.getElementById("view");
  const w = view ? view.clientWidth - 66 : 640;
  return Math.max(280, Math.min(1000, Math.round(w || 640)));
}

// Anahtar yalnızca bu cihazın tarayıcısında, ayrı bir anahtarda saklanır; yedeğe dahil edilmez.
const AI_KEY_STORAGE = "fitnessApp.geminiKey";
const AI_BASE = "https://generativelanguage.googleapis.com/v1beta";
const AI_SYSTEM = [
  "Sen Türkçe konuşan, sakin ve pratik bir fitness asistanısın. Kullanıcı kişisel bir antrenman ve beslenme takip uygulaması kullanıyor.",
  "Hareketlerin nasıl yapılacağını adım adım, doğru form, sık yapılan hatalar ve güvenlik ipuçlarıyla anlat.",
  "Kısa ve net ol; gerekirse madde işaretleri kullan. Bilmediğin bir şeyi uydurma.",
  "Tıbbi teşhis veya tedavi önerme. Ağrı, yaralanma, hastalık, gebelik veya ilaç gibi konularda bir hekime ya da fizyoterapiste danışmasını öner.",
  "Aşırı kalori kısıtlaması, takviye dozları veya ilaç konusunda kesin yönlendirme yapma."
].join(" ");

function aiGetKey() {
  try { return localStorage.getItem(AI_KEY_STORAGE) || ""; } catch (e) { return ""; }
}

function aiSetKey(k) {
  try {
    if (k) localStorage.setItem(AI_KEY_STORAGE, k); else localStorage.removeItem(AI_KEY_STORAGE);
    return true;
  } catch (e) { return false; }
}

// Bazı tarayıcılar (özellikle iPhone) özel başlıklı istekleri kesebildiği için sırayla üç gönderim yöntemi denenir:
// 1) anahtar başlıkta + JSON, 2) anahtar adreste + JSON, 3) anahtar adreste + düz metin gövde (ön kontrol isteği gerektirmez).
async function aiRequest(path, key, body) {
  const url = `${AI_BASE}/${path}`;
  const withKey = url + (url.includes("?") ? "&" : "?") + "key=" + encodeURIComponent(key);
  const json = body ? JSON.stringify(body) : undefined;
  const attempts = [
    { url, headers: Object.assign({ "x-goog-api-key": key }, body ? { "Content-Type": "application/json" } : {}) },
    { url: withKey, headers: body ? { "Content-Type": "application/json" } : {} }
  ];
  if (body) attempts.push({ url: withKey, headers: { "Content-Type": "text/plain;charset=UTF-8" } });
  let res = null;
  const errors = [];
  for (let i = 0; i < attempts.length && !res; i++) {
    const a = attempts[i];
    const ctrl = new AbortController();
    const timer = setTimeout(() => ctrl.abort(), 90000);
    try {
      res = await fetch(a.url, { method: body ? "POST" : "GET", headers: a.headers, body: json, signal: ctrl.signal, cache: "no-store" });
      if (i > 0) APP.ui.aiTransport = i;
    } catch (e) {
      errors.push(`${i + 1}. yöntem: ${e && e.name === "AbortError" ? "zaman aşımı (90 sn)" : (e && (e.name + ": " + e.message)) || "bilinmeyen hata"}`);
      if (e && e.name === "AbortError") break;
    } finally {
      clearTimeout(timer);
    }
  }
  if (!res) {
    const base = navigator.onLine === false ? "İnternet bağlantısı yok." : "Google'a ulaşılamadı.";
    throw new Error(`${base} Ayrıntı: ${errors.join(" · ")}`);
  }
  let data = null;
  try { data = await res.json(); } catch (e) { data = null; }
  if (!res.ok) {
    const err = (data && data.error) || {};
    const msg = err.message ? String(err.message) : "";
    const reason = JSON.stringify(err.details || "").match(/"reason":"([A-Z_]+)"/);
    const detail = ` (Kod ${res.status}${reason ? ", " + reason[1] : err.status ? ", " + err.status : ""}${msg ? ": " + msg.slice(0, 160) : ""})`;
    if ((res.status === 400 && /api key/i.test(msg)) || res.status === 401) throw new Error("Anahtar kabul edilmedi. AI Studio'dan kopyaladığın anahtarı kontrol et veya yeni bir anahtar oluştur." + detail);
    if (res.status === 403) throw new Error("Bu anahtarın Gemini API'ye erişim izni yok. AI Studio'da yeni bir anahtar oluşturmayı dene." + detail);
    if (res.status === 429) throw new Error("Ücretsiz kullanım sınırına ulaşıldı veya bu model için ücretsiz kota yok. Bir süre bekle ya da ayarlardan başka bir model seç." + detail);
    if (res.status === 404) throw new Error("Seçili model kullanılamıyor. Asistan ayarlarından başka bir model seç." + detail);
    if (res.status >= 500) throw new Error("Google tarafında geçici bir sorun var. Biraz sonra tekrar dene." + detail);
    throw new Error("İstek başarısız oldu." + detail);
  }
  return data;
}

// Ayarlardaki "Bağlantıyı test et": model listesi ve kısa bir deneme mesajı.
async function aiDiagnose() {
  const key = aiGetKey();
  const lines = [];
  lines.push(`Anahtar biçimi: ${key.startsWith("AQ.") ? "yeni (AQ.)" : key.startsWith("AIza") ? "eski (AIza)" : "bilinmiyor"}, ${key.length} karakter`);
  lines.push(`Seçili model: ${APP.state.settings.aiModel || "—"}`);
  try {
    const models = await aiListModels(key);
    lines.push(`Model listesi: başarılı (${models.length} uygun model)`);
  } catch (e) { lines.push(`Model listesi: HATA — ${e.message}`); }
  try {
    APP.ui.aiTransport = 0;
    const data = await aiRequest(`${APP.state.settings.aiModel}:generateContent`, key, { contents: [{ role: "user", parts: [{ text: "Sadece 'tamam' yaz." }] }] });
    const txt = data && data.candidates && data.candidates[0] && data.candidates[0].content ? (data.candidates[0].content.parts || []).map(p => p.text || "").join("") : "";
    lines.push(`Deneme mesajı: başarılı (${APP.ui.aiTransport + 1}. yöntemle) — yanıt: "${txt.trim().slice(0, 40)}"`);
  } catch (e) { lines.push(`Deneme mesajı: HATA — ${e.message}`); }
  return lines;
}

// Metin üretebilen "flash" modellerini, en yeni ve genel amaçlı olan önce gelecek şekilde döndürür.
async function aiListModels(key) {
  const data = await aiRequest("models?pageSize=200", key);
  const models = (data.models || []).filter(m => (m.supportedGenerationMethods || []).includes("generateContent")
    && /flash/i.test(m.name) && !/image|tts|audio|live|embed|vision|robotics|computer|native/i.test(m.name));
  const ver = (n) => { const m = n.match(/(\d+(?:\.\d+)?)/); return m ? Number(m[1]) : 0; };
  models.sort((a, b) => {
    const la = /latest/.test(a.name) ? 1 : 0, lb = /latest/.test(b.name) ? 1 : 0;
    if (la !== lb) return lb - la;
    const pa = /preview|exp/.test(a.name) ? 1 : 0, pb = /preview|exp/.test(b.name) ? 1 : 0;
    if (pa !== pb) return pa - pb;
    const lia = /lite/.test(a.name) ? 1 : 0, lib = /lite/.test(b.name) ? 1 : 0;
    if (lia !== lib) return lia - lib;
    return ver(b.name) - ver(a.name);
  });
  return models.map(m => ({ name: m.name, label: m.displayName || m.name.replace("models/", "") }));
}

function aiProfileContext() {
  const p = APP.state.profile;
  if (!p || !APP.state.settings.aiShareProfile) return "";
  const goal = (GOALS.find(g => g[0] === p.goal) || [])[1];
  const exp = (EXPERIENCE.find(g => g[0] === p.experience) || [])[1];
  const eq = (p.equipment || []).map(id => (EQUIPMENT.find(e => e[0] === id) || [])[1]).filter(Boolean);
  return `Kullanıcı bilgisi (kullanıcı paylaşmayı seçti): hedef ${goal || "-"}, deneyim ${exp || "-"}, antrenman yeri ${p.location === "gym" ? "spor salonu" : "ev"}`
    + (eq.length ? `, ekipman: ${eq.join(", ")}` : "")
    + (p.limitations ? `, belirttiği hareket kısıtı: ${p.limitations}` : "") + ".";
}

async function aiSend(text) {
  const key = aiGetKey();
  const chat = APP.ui.aiChat || (APP.ui.aiChat = []);
  chat.push({ role: "user", text });
  APP.ui.aiBusy = true;
  aiRenderMessages();
  try {
    const ctx = aiProfileContext();
    const body = {
      systemInstruction: { parts: [{ text: AI_SYSTEM + (ctx ? " " + ctx : "") }] },
      contents: chat.slice(-20).map(m => ({ role: m.role, parts: [{ text: m.text }] })),
      generationConfig: { temperature: 0.6, maxOutputTokens: 1200 }
    };
    const data = await aiRequest(`${APP.state.settings.aiModel}:generateContent`, key, body);
    const cand = data && data.candidates && data.candidates[0];
    const out = cand && cand.content && cand.content.parts ? cand.content.parts.map(p => p.text || "").join("").trim() : "";
    if (!out) {
      const reason = cand && cand.finishReason;
      chat.push({ role: "model", text: reason === "SAFETY" ? "Bu soruya güvenlik nedeniyle yanıt verilemedi. Soruyu farklı ifade etmeyi dene." : "Boş yanıt geldi. Tekrar dene.", error: true });
    } else {
      chat.push({ role: "model", text: out });
    }
  } catch (e) {
    chat.push({ role: "model", text: e.message, error: true });
  }
  APP.ui.aiBusy = false;
  aiRenderMessages();
}

// Basit ve güvenli biçimlendirme: **kalın**, madde ve numaralı listeler, # başlıklar. HTML yorumlanmaz.
function aiFormat(text) {
  const wrap = h("div", { class: "ai-text" });
  const inline = (line) => {
    const parts = String(line).split(/(\*\*[^*]+\*\*)/g).filter(Boolean);
    return parts.map(p => (/^\*\*[^*]+\*\*$/.test(p) ? h("strong", { text: p.slice(2, -2) }) : p.replace(/\*(\S[^*]*)\*/g, "$1")));
  };
  let list = null, listType = null;
  String(text).split(/\r?\n/).forEach(raw => {
    const line = raw.trimEnd();
    const bullet = line.match(/^\s*[-*•]\s+(.*)$/);
    const num = line.match(/^\s*(\d+)[.)]\s+(.*)$/);
    if (bullet || num) {
      const type = bullet ? "ul" : "ol";
      if (!list || listType !== type) { list = h(type, {}); listType = type; wrap.appendChild(list); }
      list.appendChild(h("li", {}, inline(bullet ? bullet[1] : num[2])));
      return;
    }
    list = null; listType = null;
    if (!line.trim()) return;
    const head = line.match(/^#{1,6}\s+(.*)$/);
    wrap.appendChild(head ? h("p", { class: "ai-head" }, h("strong", {}, inline(head[1]))) : h("p", {}, inline(line)));
  });
  return wrap;
}

function aiRenderMessages() {
  const box = document.getElementById("ai-messages");
  if (!box) return;
  clear(box);
  const chat = APP.ui.aiChat || [];
  if (!chat.length) {
    box.appendChild(h("div", { class: "ai-empty" },
      h("p", { class: "muted", text: "Bir soru sor ya da aşağıdaki önerilerden birini seç." })));
  }
  chat.forEach(m => box.appendChild(h("div", { class: `ai-msg ${m.role === "user" ? "me" : "bot"}${m.error ? " err" : ""}` },
    m.role === "user" ? h("p", { text: m.text }) : aiFormat(m.text))));
  if (APP.ui.aiBusy) box.appendChild(h("div", { class: "ai-msg bot typing" }, h("p", { class: "muted", text: "Yazıyor…" })));
  box.scrollTop = box.scrollHeight;
  const send = document.getElementById("ai-send");
  if (send) send.disabled = !!APP.ui.aiBusy;
}

function aiSetupCard(onDone) {
  const keyInput = h("input", { class: "input", type: "password", id: "ai-key", placeholder: "AIza…", attrs: { autocomplete: "off", spellcheck: "false" } });
  const status = h("p", { class: "small", attrs: { "aria-live": "polite" } });
  const saveBtn = h("button", { type: "submit", class: "btn btn-primary" }, "Anahtarı kaydet ve dene");
  const form = h("form", { class: "stack", attrs: { novalidate: "" } },
    h("ol", { class: "ai-steps" },
      h("li", {}, "Google hesabınla ", h("a", { attrs: { href: "https://aistudio.google.com/apikey", target: "_blank", rel: "noopener noreferrer" } }, "aistudio.google.com/apikey"), " adresine gir."),
      h("li", {}, "\"Create API key\" (API anahtarı oluştur) düğmesine bas ve oluşan anahtarı kopyala."),
      h("li", {}, "Anahtarı aşağıya yapıştırıp kaydet.")),
    field({ label: "Gemini API anahtarı", input: keyInput, hint: "Anahtar yalnızca bu cihazda saklanır, yedeğe dahil edilmez ve kimseyle paylaşılmaz." }),
    h("div", { class: "form-actions" }, saveBtn),
    status);
  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    clearFieldErrors(form);
    const key = keyInput.value.trim();
    if (key.length < 20 || /\s/.test(key)) { setFieldError(keyInput, "Anahtarı eksiksiz yapıştır."); keyInput.focus(); return; }
    saveBtn.disabled = true;
    status.textContent = "Anahtar deneniyor…";
    try {
      const models = await aiListModels(key);
      if (!models.length) throw new Error("Bu anahtarla kullanılabilir bir Flash modeli bulunamadı.");
      if (!aiSetKey(key)) throw new Error("Tarayıcı depolamasına yazılamadı.");
      APP.state.settings.aiModel = models[0].name;
      APP.ui.aiModels = models;
      saveState();
      toast("Asistan hazır.", "ok");
      onDone();
    } catch (err) {
      status.textContent = "";
      setFieldError(keyInput, err.message);
      saveBtn.disabled = false;
    }
  });
  return card({ title: "Asistanı kur (bir kez)", sub: "Asistan, Google'ın Gemini modelini senin ücretsiz anahtarınla kullanır." },
    form,
    h("div", { class: "notice notice-warn" },
      h("p", { text: "Ücretsiz kullanımda Google, gönderdiğin soruları ve yanıtları modellerini geliştirmek için kullanabilir. Kişisel sağlık bilgisi veya özel bilgi paylaşma." })));
}

function renderAssistant(root) {
  if (!aiGetKey() || !APP.state.settings.aiModel) {
    root.appendChild(aiSetupCard(() => rerender()));
    return;
  }
  const quick = ["Squat nasıl doğru yapılır?", "Bench press'te sık yapılan hatalar neler?", "Antrenman öncesi 5 dakikalık ısınma öner.",
    "Yeterli proteini nasıl alırım?", "Barfiks çekemiyorum, nasıl başlarım?"];
  const input = h("textarea", { class: "input", id: "ai-input", rows: 2, maxlength: 2000, placeholder: "Sorunu yaz… (Enter: gönder, Shift+Enter: yeni satır)",
    attrs: { "aria-label": "Asistana mesaj" } });
  if (APP.ui.aiDraft) { input.value = APP.ui.aiDraft; APP.ui.aiDraft = null; }
  const sendBtn = h("button", { type: "submit", class: "btn btn-primary", id: "ai-send", attrs: { "aria-label": "Gönder" } }, icon("send"), "Gönder");
  const form = h("form", { class: "ai-compose" }, input, sendBtn);
  const submit = () => {
    const t = input.value.trim();
    if (!t || APP.ui.aiBusy) return;
    input.value = "";
    aiSend(t);
  };
  form.addEventListener("submit", (e) => { e.preventDefault(); submit(); });
  input.addEventListener("keydown", (e) => { if (e.key === "Enter" && !e.shiftKey && !e.isComposing) { e.preventDefault(); submit(); } });

  const chips = h("div", { class: "chips ai-quick" }, quick.map(q => h("button", { type: "button", class: "chip-btn",
    on: { click: () => { if (!APP.ui.aiBusy) aiSend(q); } } }, q)));
  const newBtn = h("button", { type: "button", class: "btn btn-sm btn-ghost" }, "Yeni sohbet");
  newBtn.addEventListener("click", () => { APP.ui.aiChat = []; aiRenderMessages(); input.focus(); });

  root.appendChild(card({ title: "Fitness asistanı", sub: "Hareket tekniği, ısınma, beslenme gibi genel sorular için. Tıbbi tavsiye vermez.", actions: [newBtn], cls: "ai-card" },
    h("div", { class: "ai-messages", id: "ai-messages", attrs: { role: "log", "aria-live": "polite" } }),
    chips, form,
    h("p", { class: "muted small", text: "Yanıtlar yapay zekâ tarafından üretilir ve hatalı olabilir. Ağrı veya sağlık sorununda bir uzmana danış. Sohbet sayfa yenilenince silinir." })));
  aiRenderMessages();
  if (input.value) input.focus();

  // Ayarlar
  const models = APP.ui.aiModels || [{ name: APP.state.settings.aiModel, label: APP.state.settings.aiModel.replace("models/", "") }];
  const modelSel = selectInput({ id: "ai-model", value: APP.state.settings.aiModel, options: models.map(m => [m.name, m.label]) });
  modelSel.addEventListener("change", () => { APP.state.settings.aiModel = modelSel.value; saveState(); toast("Model değiştirildi.", "ok"); });
  const refresh = h("button", { type: "button", class: "btn btn-sm" }, "Model listesini yenile");
  refresh.addEventListener("click", async () => {
    refresh.disabled = true;
    try { APP.ui.aiModels = await aiListModels(aiGetKey()); rerender(); }
    catch (e) { toast(e.message, "err"); refresh.disabled = false; }
  });
  const diagOut = h("ul", { class: "small ai-diag", attrs: { "aria-live": "polite" } });
  const diagBtn = h("button", { type: "button", class: "btn btn-sm" }, "Bağlantıyı test et");
  diagBtn.addEventListener("click", async () => {
    diagBtn.disabled = true;
    clear(diagOut);
    diagOut.appendChild(h("li", { text: "Test ediliyor…" }));
    const lines = await aiDiagnose();
    clear(diagOut);
    lines.forEach(l => diagOut.appendChild(h("li", { text: l })));

  const share = h("input", { type: "checkbox", id: "ai-share", checked: APP.state.settings.aiShareProfile ? true : undefined });

  removeBtn.addEventListener("click", async () => {
    if (!(await confirmDialog("Gemini anahtarın bu cihazdan silinecek. Asistanı tekrar kullanmak için yeniden girmen gerekir.", "Sil"))) return;
    aiSetKey("");
    APP.state.settings.aiModel = null;
    APP.ui.aiChat = [];
    saveState();
    rerender();
  });
  root.appendChild(h("details", { class: "card ai-settings" },
    h("summary", { class: "card-title", text: "Asistan ayarları" }),
    h("div", { class: "stack" },
      field({ label: "Model", input: modelSel, hint: "Ücretsiz kullanımda Flash modelleri önerilir." }),
      h("div", { class: "row" }, refresh, diagBtn),
      diagOut,
      h("label", { class: "check", for: "ai-share" }, share, "Hedefimi, deneyimimi, ekipmanımı ve hareket kısıtımı asistanla paylaş"),
      h("p", { class: "muted small", text: "Kapalıyken yalnızca yazdığın mesajlar gönderilir. Kilo, ölçü ve günlük kayıtların hiçbir durumda gönderilmez." }),
      h("div", { class: "row" }, removeBtn))));
}

let guideState = { index: 0, prevFocus: null };

function openGuide(startIndex) {
  guideState.index = startIndex || 0;
  guideState.prevFocus = document.activeElement;
  renderGuide();
  document.addEventListener("keydown", guideKeydown);
}

function closeGuide() {
  const root = document.getElementById("guide-root");
  if (root) clear(root);
  document.body.classList.remove("guide-open");
  document.removeEventListener("keydown", guideKeydown);
  if (APP.state && !APP.state.settings.guideSeen) {
    APP.state.settings.guideSeen = true;
    saveState();
  }
  if (guideState.prevFocus && guideState.prevFocus.focus) guideState.prevFocus.focus();
}

function guideKeydown(e) {
  if (e.key === "Escape") { e.preventDefault(); closeGuide(); }
  else if (e.key === "ArrowRight") guideGo(1);
  else if (e.key === "ArrowLeft") guideGo(-1);
  else if (e.key === "Tab") {
    // Odak kılavuz içinde kalsın.
    const box = document.querySelector(".guide-box");
    if (!box) return;
    const items = [...box.querySelectorAll("button")].filter(b => !b.disabled);
    if (!items.length) return;
    const first = items[0], last = items[items.length - 1];
    if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
    else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
  }
}

function guideGo(delta) {
  const next = guideState.index + delta;
  if (next < 0) return;
  if (next >= GUIDE_SLIDES.length) { closeGuide(); return; }
  guideState.index = next;
  renderGuide();
}

function renderGuide() {
  const root = document.getElementById("guide-root");
  if (!root) return;
  clear(root);
  document.body.classList.add("guide-open");
  const i = guideState.index;
  const s = GUIDE_SLIDES[i];
  const last = i === GUIDE_SLIDES.length - 1;
  const nextBtn = h("button", { type: "button", class: "btn btn-primary", on: { click: () => guideGo(1) } },
    last ? "Başla" : "İleri", icon(last ? "check" : "chevron-right"));
  const box = h("div", { class: "guide-box", attrs: { role: "dialog", "aria-modal": "true", "aria-labelledby": "guide-title" } },
    h("div", { class: "guide-top" },
      h("span", { class: "muted small", text: `${i + 1} / ${GUIDE_SLIDES.length}` }),
      h("button", { type: "button", class: "btn btn-ghost btn-sm", on: { click: closeGuide } }, last ? "Kapat" : "Geç")),
    h("div", { class: "guide-icon", attrs: { "aria-hidden": "true" } }, icon(s.icon)),
    h("h2", { class: "guide-title", id: "guide-title", text: s.title }),
    h("ul", { class: "guide-lines" }, s.lines.map(t => h("li", { text: t }))),
    h("div", { class: "guide-dots", attrs: { "aria-hidden": "true" } },
      GUIDE_SLIDES.map((_, k) => h("span", { class: k === i ? "on" : "" }))),
    h("div", { class: "guide-actions" },
      h("button", { type: "button", class: "btn", disabled: i === 0 ? true : undefined, on: { click: () => guideGo(-1) } }, icon("chevron-left"), "Geri"),
      h("span", { class: "spacer" }),
      nextBtn));
  root.appendChild(h("div", { class: "guide-overlay", on: { click: (e) => { if (e.target === e.currentTarget) closeGuide(); } } }, box));
  nextBtn.focus();
}

// İlk açılışta (profil yokken) kılavuzu bir kez göster. CORE'un init'inden sonra çalışır.
document.addEventListener("DOMContentLoaded", () => {
  if (APP.state && !APP.state.profile && !APP.state.settings.guideSeen) openGuide(0);
});
</script>
