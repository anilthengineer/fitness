    id: "pr-weight-kg",
    value: existingEntry ? existingEntry.kg : "",
    min: 30,
    max: 300,
    step: "0.1",
    placeholder: "Örn. 78,5"
  });
  const waistInput = numberInput({
    id: "pr-weight-waist",
    value: existingEntry && existingEntry.waistCm != null ? existingEntry.waistCm : "",
    min: 40,
    max: 200,
    step: "0.1",
    placeholder: "İsteğe bağlı"
  });
  const saveBtn = h("button", { class: "btn btn-primary", type: "submit" }, existingEntry ? "Kaydı güncelle" : "Kaydet");

  weightForm.appendChild(field({
    label: "Tarih",
    input: dateInput,
    hint: "Aynı tarihteki kayıt varsa güncellenir."
  }));
  weightForm.appendChild(field({
    label: "Kilo (kg)",
    input: kgInput,
    hint: "30–300 arası"
  }));
  weightForm.appendChild(field({
    label: "Bel çevresi (cm)",
    input: waistInput,
    hint: "İsteğe bağlı, 40–200 arası"
  }));
  const actions = h("div", { class: "form-actions" }, saveBtn);
  weightForm.appendChild(actions);

  function prPrefillWeightDate(iso) {
    if (!iso || iso > to) return;
    dateInput.value = iso;
    const entry = (APP.state.weights || []).find(w => w.date === iso) || null;
    kgInput.value = entry ? String(entry.kg) : "";
    waistInput.value = entry && entry.waistCm != null ? String(entry.waistCm) : "";
    saveBtn.textContent = entry ? "Kaydı güncelle" : "Kaydet";
    clearFieldErrors(weightForm);
  }

  dateInput.addEventListener("change", () => {
    APP.ui.prEditDate = null;
    if (dateInput.value && dateInput.value <= to) {
      APP.ui.date = dateInput.value;
      prPrefillWeightDate(dateInput.value);
    } else {
      kgInput.value = "";
      waistInput.value = "";
      saveBtn.textContent = "Kaydet";
    }
  });

  weightForm.addEventListener("submit", (e) => {
    e.preventDefault();
    clearFieldErrors(weightForm);

    const iso = dateInput.value;
    if (!iso || !/^\d{4}-\d{2}-\d{2}$/.test(iso) || iso > to) {
      setFieldError(dateInput, "Bugünden sonraki tarih girilemez.");
      return;
    }

    const kg = parseNum(kgInput.value);
    if (kg === null || Number.isNaN(kg) || kg < 30 || kg > 300) {
      setFieldError(kgInput, "Kilo 30–300 kg aralığında olmalı.");
      return;
    }

    let waistCm = null;
    const waistRaw = waistInput.value == null ? "" : String(waistInput.value).trim();
    if (waistRaw !== "") {
      waistCm = parseNum(waistRaw);
      if (waistCm === null || Number.isNaN(waistCm) || waistCm < 40 || waistCm > 200) {
        setFieldError(waistInput, "Bel çevresi 40–200 cm aralığında olmalı.");
        return;
      }
    }

    const exists = (APP.state.weights || []).some(w => w.date === iso);
    upsertWeight(iso, Number(kg), waistCm);
    APP.ui.prEditDate = null;
    APP.ui.date = iso;
    commit();
    toast(exists ? "Kilo kaydı güncellendi." : "Kilo kaydı eklendi.", "ok");
  });

  const latest10 = (APP.state.weights || []).slice(-10).reverse();
  const list = h("div", { class: "list" });
  if (latest10.length === 0) {
    list.appendChild(h("div", { class: "list-item" }, h("div", { class: "li-main" }, h("div", { class: "li-title" }, "Kayıt yok"), h("div", { class: "li-sub muted" }, "Yukarıdan ilk kaydını ekleyebilirsin."))));
  } else {
    for (const w of latest10) {
      const item = h("div", { class: "list-item" },
        h("div", { class: "li-main" },
          h("div", { class: "li-title" }, `${formatDate(w.date, true)} — ${fmtNum(w.kg, 1)} kg`),
          h("div", { class: "li-sub muted" }, `Bel: ${w.waistCm == null ? "—" : fmtNum(w.waistCm, 1) + " cm"}`)
        ),
        h("div", { class: "li-actions" })
      );
      const editBtn = h("button", { class: "btn btn-sm btn-ghost", type: "button", attrs: { "aria-label": "Kaydı düzenle" } }, h("span", {}, "Düzenle"));
      editBtn.addEventListener("click", () => {
        APP.ui.prEditDate = w.date;
        APP.ui.date = w.date;
        rerender();
      });
      const delBtn = h("button", { class: "btn btn-sm btn-danger", type: "button", attrs: { "aria-label": "Kaydı sil" } }, h("span", {}, "Sil"));
      delBtn.addEventListener("click", async () => {
        const ok = await confirmDialog(`${formatDate(w.date, true)} tarihli kilo kaydı silinsin mi?`, "Sil");
        if (!ok) return;
        const idx = (APP.state.weights || []).findIndex(x => x.date === w.date);
        if (idx >= 0) {
          APP.state.weights.splice(idx, 1);
          if (APP.ui.prEditDate === w.date) APP.ui.prEditDate = null;
          commit();
          toast("Kayıt silindi.", "ok");
        }
      });
      item.querySelector(".li-actions").appendChild(editBtn);
      item.querySelector(".li-actions").appendChild(delBtn);
      list.appendChild(item);
    }
  }

  root.appendChild(card({ title: "Kilo ve bel çevresi kaydı", sub: "Aynı tarihte yalnızca bir kayıt tutulur." }, weightForm, prChartNote("Son 10 kayıt:"), list));

  const weightPoints = entries.map(w => ({ date: w.date, value: w.kg }));
  const avg7Points = entries
    .map(w => ({ date: w.date, value: avg7Weight(w.date) }))
    .filter(p => p.value != null && Number.isFinite(Number(p.value)));

  const lastWeight = entries.length ? entries[entries.length - 1] : null;
  const avg7Today = avg7Weight(to);
  const weightCard = card({ title: "Kilo", sub: "Kayıt olmayan günler grafikte boş bırakılır." },
    lineChart(weightPoints, {
      unit: "kg",
      label: "Kilo",
      series2: avg7Points.length ? avg7Points : null,
      label2: "7 günlük ortalama",
      decimals: 1
    }),
    h("div", { class: "stats" },
      prStat("Son kayıt", lastWeight ? `${fmtNum(lastWeight.kg, 1)} kg` : "—", lastWeight ? formatDate(lastWeight.date) : "Bu aralıkta kayıt yok"),
      prStat("7 günlük ortalama", avg7Today != null ? `${fmtNum(avg7Today, 1)} kg` : "Yetersiz veri", avg7Today == null ? "Son 7 günde en az 3 kayıt gerekir" : ""),
      prStat("Hedef kilo", APP.state.profile.targetWeightKg != null ? `${fmtNum(APP.state.profile.targetWeightKg, 1)} kg` : "—")

  root.appendChild(weightCard);

  const waistPoints = entries.filter(w => w.waistCm != null).map(w => ({ date: w.date, value: w.waistCm }));
  if (waistPoints.length > 0) {

  root.appendChild(card({ title: "Haftalık tamamlanan antrenman", sub: "Hafta başına tamamlanan seans." }, barChart(weekSessions, { label: "Tamamlanan seans", unit: "seans", decimals: 0 })));

  const doneExerciseIds = [];
  const seenEx = new Set();
  (APP.state.sessions || []).filter(s => s && s.status === "done" && Array.isArray(s.exercises)).forEach(session => {
    session.exercises.forEach(ex => {
      if (!ex || !ex.exerciseId) return;
      if (!seenEx.has(ex.exerciseId)) {
        seenEx.add(ex.exerciseId);
        doneExerciseIds.push(ex.exerciseId);
      }
    });
  });

  let exerciseOptions = doneExerciseIds
    .map(id => getExercise(id))
    .filter(Boolean)
    .map(ex => [ex.id, ex.name]);

  if (exerciseOptions.length === 0) {
    root.appendChild(card({ title: "Hareket gelişimi", sub: "Tamamlanan seanslardaki ağırlık ve tekrar geçmişi." }, emptyState("Antrenman geçmişi yok", "Önce bir seansı tamamla; sonra gelişimini burada gör.")));
  } else {

      id: "pr-exercise",
      options: exerciseOptions,
      value: APP.ui.prExercise
    });
    exSelect.setAttribute("aria-label", "Hareket seç");
    exSelect.addEventListener("change", () => {
      APP.ui.prExercise = exSelect.value;
      rerender();
    });

    const history = exerciseHistory(APP.ui.prExercise) || [];
    const weighted = history.filter(x => x.topWeight != null && Number.isFinite(Number(x.topWeight)));
    const bodyOnly = history.length > 0 && weighted.length === 0;

    let chart;
    let table = null;

    if (history.length === 0) {
      chart = emptyState("Bu hareket için kayıt yok", "Tamamlanan seanslarda bu hareket girmemiş.");
    } else {
      const pts = bodyOnly
        ? history.filter(x => x.totalReps != null).map(x => ({ date: x.date, value: Number(x.totalReps) }))
        : weighted.map(x => ({ date: x.date, value: Number(x.topWeight) }));

      const chartOpts = bodyOnly
        ? { unit: "tekrar", label: "Toplam tekrar", decimals: 0 }
        : {
            unit: "kg",
            label: "En yüksek ağırlık",
            decimals: 1,
            titleForPoint: p => {
              const row = history.find(x => x.date === p.date) || {};
              const reps = row.repsAtTop != null ? Number(row.repsAtTop) : Number(p.value);
              return `${fmtNum(p.value, 1)} kg × ${fmtNum(reps, 0)}`;
            }
          };

      chart = lineChart(pts, chartOpts);

      const rows = history.map(row => h("tr", {},
        h("td", {}, formatDate(row.date)),
        h("td", {}, row.topWeight == null ? "—" : `${fmtNum(row.topWeight, 1)} kg`),
        h("td", {}, row.repsAtTop == null ? "—" : fmtNum(row.repsAtTop, 0)),
        h("td", {}, row.totalReps == null ? "—" : fmtNum(row.totalReps, 0))
      ));
      table = h("div", { class: "table-wrap" }, h("table", { class: "table" },
        h("thead", {}, h("tr", {},
          h("th", {}, "Tarih"),
          h("th", {}, "En yüksek ağırlık"),
          h("th", {}, "O ağırlıkta tekrar"),
          h("th", {}, "Toplam tekrar")
        )),
        h("tbody", {}, rows)
      ));
    }

    root.appendChild(card({ title: "Hareket gelişimi", sub: "Tamamlanan seanslardaki en yüksek ağırlık ve tekrar." },
      exSelect,
      chart,
      table,
      prChartNote("Farklı tekrar sayılarındaki ağırlıklar eşdeğer performans sayılmaz; ağırlığı ve tekrarı birlikte değerlendir.")
    ));
  }

  const metricDefs = [
    { field: "waterMl", title: "Su", unit: "ml", decimals: 0 },
    { field: "steps", title: "Adım", unit: "adım", decimals: 0 },
    { field: "sleepHours", title: "Uyku", unit: "saat", decimals: 1 }
  ];

  for (const m of metricDefs) {
    const series = (metricSeries(m.field, from, to) || []).map(x => ({ date: x.date, value: Number(x.value) }));
    let avgLine = "Kayıt olmayan günler grafikte boş bırakılır.";
    if (series.length > 0) {
      const avg = series.reduce((s, p) => s + p.value, 0) / series.length;
      avgLine = `Kayıt olmayan günler grafikte boş bırakılır. ${series.length} günlük kayıt, ortalama ${fmtNum(avg, m.decimals)} ${m.unit}.`;
    }
    root.appendChild(card({ title: m.title, sub: "Günlük kayıtlar." },
      lineChart(series, { unit: m.unit, label: m.title, decimals: m.decimals }),
      prChartNote(avgLine)
    ));
  }
}

function renderReview(root) {
  clear(root);
  if (!APP.state.profile) return;

  if (!APP.ui.reviewWeek) APP.ui.reviewWeek = startOfWeek(todayISO());
  const currentWeekStart = startOfWeek(todayISO());
  let weekStart = startOfWeek(APP.ui.reviewWeek);
  if (weekStart > currentWeekStart) weekStart = currentWeekStart;
  APP.ui.reviewWeek = weekStart;

  const weekEnd = addDays(weekStart, 6);
  const heading = h("h2", { class: "card-title" }, prWeekTitle(weekStart));
  const prevBtn = h("button", { class: "btn btn-ghost", type: "button" }, h("span", {}, "Önceki hafta"));
  const nextBtn = h("button", { class: "btn btn-ghost", type: "button" }, h("span", {}, "Sonraki hafta"));
  if (weekStart >= currentWeekStart) nextBtn.disabled = true;

  prevBtn.addEventListener("click", () => {
    APP.ui.reviewWeek = addDays(weekStart, -7);
    rerender();
  });
  nextBtn.addEventListener("click", () => {
    APP.ui.reviewWeek = addDays(weekStart, 7);
    rerender();
  });

  root.appendChild(h("div", { class: "row" },
    prevBtn,
    heading,
    h("span", { class: "spacer" }),
    nextBtn
  ));

  const r = weeklyReview(weekStart) || {};
  if (!r.enough) {
    root.appendChild(emptyState("Bu hafta için kayıt yok", "Değerlendirme yalnızca girdiğin kayıtlara dayanır."));
    return;
  }

  const planned = prPick(r, "plannedSessions", "planned", "scheduled", "expectedSessions");
  const completed = prPick(r, "completedSessions", "done", "completed", "finished", "workouts");
  const recorded = prPick(r, "recordedDays", "daysRecorded", "loggedDays", "entryDays");
  const weightAvg = prPick(r, "weightAvg", "avgWeight", "weightAverage");
  const weightChange = prPick(r, "weightChange", "weightDelta", "deltaWeight", "changeVsPrev", "kiloChange");
  const sleepAvg = prPick(r, "sleepAvg", "avgSleep", "sleepAverage");
  const stepsAvg = prPick(r, "stepsAvg", "avgSteps", "stepsAverage");

  root.appendChild(h("div", { class: "stats" },
    prStat("Planlanan seans", planned == null ? "—" : fmtNum(planned, 0)),
    prStat("Tamamlanan seans", completed == null ? "—" : fmtNum(completed, 0)),
    prStat("Kayıt girilen gün", recorded == null ? "—" : `${fmtNum(recorded, 0)} / 7`),
    prStat("Kilo ortalaması", weightAvg == null ? "—" : `${fmtNum(weightAvg, 1)} kg`, prWeightChangeText(weightChange)),
    prStat("Uyku ortalaması", sleepAvg == null ? "Yetersiz veri" : `${fmtNum(sleepAvg, 1)} saat`),
    prStat("Adım ortalaması", stepsAvg == null ? "Yetersiz veri" : `${fmtNum(stepsAvg, 0)} adım`)
  ));

  const summary = h("div", { class: "stack" });
  let summaryList = Array.isArray(r.summary) ? r.summary : (r.summary ? [r.summary] : []);
  if (summaryList.length === 0) summaryList = ["Bu hafta için özet üretilemedi."];
  for (const s of summaryList) {
    const p = h("p", {}, String(s));
    if (s && String(s).trim()) summary.appendChild(p);
  }
  root.appendChild(card({ title: "Özet" }, summary));

  const insufficient = Array.isArray(r.insufficient) ? r.insufficient : (r.insufficient ? [r.insufficient] : []);
  if (insufficient.length > 0) {
    const insList = h("div", { class: "list" });
    for (const item of insufficient) {
      insList.appendChild(h("div", { class: "list-item" }, h("div", { class: "li-main muted" }, String(item))));
    }
    root.appendChild(card({ title: "Veri yetersiz olan alanlar" }, insList));
  }

  const suggestions = Array.isArray(r.suggestions) ? r.suggestions.slice(0, 3) : [];
  const sugCard = card({ title: "Gelecek hafta için öneriler" });
  if (suggestions.length === 0) {
    sugCard.appendChild(h("p", { class: "muted" }, "Öneri yok."));
  } else {
    const ol = h("ol");
    for (const s of suggestions) ol.appendChild(h("li", {}, String(s)));
    sugCard.appendChild(ol);
  }
  root.appendChild(sugCard);

  root.appendChild(h("p", { class: "muted small" }, "Bu değerlendirme yalnızca kayıtlarına dayalı kurallarla üretilir; yapay zekâ analizi veya sağlık değerlendirmesi değildir. Kaydı olmayan günlerden sonuç çıkarılmaz."));
}

function prWeekTitle(weekStartIso) {
  const start = parseISO(weekStartIso);
  const end = parseISO(addDays(weekStartIso, 6));
  return `${start.getDate()} ${prMonthsShort[start.getMonth()]} – ${end.getDate()} ${prMonthsShort[end.getMonth()]} ${end.getFullYear()}`;
}

function prPick(obj, ...keys) {
  if (!obj) return null;
  for (const k of keys) {
    if (obj[k] !== undefined && obj[k] !== null) return obj[k];
  }
  return null;
}

function prWeightChangeText(change) {
  const n = Number(change);
  if (change === null || change === undefined || Number.isNaN(n)) return "—";
  const sign = n > 0 ? "+" : "";
  return `${sign}${fmtNum(n, 1)} kg`;
}

// Grafik genişliği görünüm alanına göre seçilir; böylece eksen yazıları her ekranda ~11 px kalır.
function prChartWidth() {
  const view = document.getElementById("view");
  const w = view ? view.clientWidth - 66 : 640;
  return Math.max(280, Math.min(1000, Math.round(w || 640)));
}
