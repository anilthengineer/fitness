<!doctype html>
<html lang="tr" data-theme="system">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Fitness</title>
<style>
:root,
[data-theme="light"] {
  --bg: #f4f6f5;
  --surface: #ffffff;
  --surface-2: #edf1ef;
  --border: #d8dfda;
  --text: #17201b;
  --text-muted: #5a6a61;
  --accent: #2e7d5b;
  --accent-strong: #1c5d3f;
  --accent-contrast: #ffffff;
  --accent-soft: #e4f0ea;
  --info: #2b6cb0;
  --warn: #b45309;
  --danger: #c62828;
  --focus: #1f6feb;
  --radius: 12px;
  --shadow: 0 1px 2px rgba(16, 24, 20, 0.08), 0 1px 3px rgba(16, 24, 20, 0.1);
}

[data-theme="dark"] {
  --bg: #0f1412;
  --surface: #151b18;
  --surface-2: #1f2823;
  --border: #2c3830;
  --text: #e6ece8;
  --text-muted: #a7b4ab;
  --accent: #4ea57f;
  --accent-strong: #8ee6b5;
  --accent-contrast: #08130d;
  --accent-soft: #173228;
  --info: #7fb3e6;
  --warn: #f2b25c;
  --danger: #e5484d;
  --focus: #7fb3e6;
  --radius: 12px;
  --shadow: 0 1px 2px rgba(0, 0, 0, 0.55), 0 1px 3px rgba(0, 0, 0, 0.4);
}

[data-theme="system"] {
  --bg: #f4f6f5;
  --surface: #ffffff;
  --surface-2: #edf1ef;
  --border: #d8dfda;
  --text: #17201b;
  --text-muted: #5a6a61;
  --accent: #2e7d5b;
  --accent-strong: #1c5d3f;
  --accent-contrast: #ffffff;
  --accent-soft: #e4f0ea;
  --info: #2b6cb0;
  --warn: #b45309;
  --danger: #c62828;
  --focus: #1f6feb;
  --radius: 12px;
  --shadow: 0 1px 2px rgba(16, 24, 20, 0.08), 0 1px 3px rgba(16, 24, 20, 0.1);
}

@media (prefers-color-scheme: dark) {
  [data-theme="system"] {
    --bg: #0f1412;
    --surface: #151b18;
    --surface-2: #1f2823;
    --border: #2c3830;
    --text: #e6ece8;
    --text-muted: #a7b4ab;
    --accent: #4ea57f;
    --accent-strong: #8ee6b5;
    --accent-contrast: #08130d;
    --accent-soft: #173228;
    --info: #7fb3e6;
    --warn: #f2b25c;
    --danger: #e5484d;
    --focus: #7fb3e6;
    --radius: 12px;
    --shadow: 0 1px 2px rgba(0, 0, 0, 0.55), 0 1px 3px rgba(0, 0, 0, 0.4);
  }
}

*,
*::before,
*::after {
  box-sizing: border-box;
}

html {
  font-size: 16px;
}

body {
  margin: 0;
  min-width: 320px;
  overflow-x: hidden;
  background: var(--bg);
  color: var(--text);
  font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  font-size: 16px;
  line-height: 1.5;
  -webkit-text-size-adjust: 100%;
}

.mono {
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
}

button,
input,
select,
textarea {
  font: inherit;
  color: inherit;
}

a,
button,
input,
select,
textarea,
[role="tab"],
.tab,
label.chip input,
.seg label input {
  touch-action: manipulation;
}

:focus-visible {
  outline: 3px solid var(--focus);
  outline-offset: 2px;
}

.chips input:focus-visible,
.seg input:focus-visible {
  outline: none;
}

.chip input:focus-visible + span,
.seg input:focus-visible + span {
  outline: 3px solid var(--focus);
  outline-offset: 2px;
}

.skip-link {
  position: fixed;
  left: 12px;
  top: -100px;
  z-index: 100;
  background: var(--surface);
  color: var(--text);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 10px 14px;
  box-shadow: var(--shadow);
  text-decoration: none;
}

.skip-link:focus-visible {
  top: 12px;
}

.app {
  min-height: 100dvh;
  background: var(--bg);
}

.sidebar {
  display: none;
}

.main-col {
  min-width: 0;
  width: 100%;
}

.bottom-nav {
  display: none;
}

.topbar {
  position: sticky;
  top: 0;
  z-index: 20;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  min-width: 0;
  padding: 12px 20px;
  background: var(--bg);
}

.topbar-title {
  margin: 0;
  min-width: 0;
  font-size: 1.25rem;
  line-height: 1.3;
  overflow-wrap: anywhere;
}

.topbar-actions {
  display: flex;
  align-items: center;
  gap: 4px;
  flex: none;
}

.view {
  max-width: 1100px;
  margin: 0 auto;
  padding: 16px;
  display: flex;
  flex-direction: column;
  gap: 16px;
  min-width: 0;
  width: 100%;
}

@media (min-width: 900px) {
  .app {
    display: grid;
    grid-template-columns: 240px minmax(0, 1fr);
  }

  .sidebar {
    display: flex;
    flex-direction: column;
    position: sticky;
    top: 0;
    align-self: start;
    height: 100dvh;
    background: var(--surface);
    border-right: 1px solid var(--border);
  }

  .brand {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 16px 16px 10px;
    font-weight: 700;
  }

  .brand svg {
    width: 24px;
    height: 24px;
    flex: none;
  }

  .side-nav {
    display: flex;
    flex-direction: column;
    gap: 2px;
    padding: 8px;
  }

  .bottom-nav {
    display: none;
  }

  .view {
    padding: 20px;
  }
}

.nav-item {
  display: flex;
  align-items: center;
  gap: 10px;
  width: 100%;
  min-height: 40px;
  padding: 10px 12px;
  border: 0;
  border-radius: 10px;
  background: transparent;
  color: var(--text);
  font: inherit;
  text-align: left;
  cursor: pointer;
}

.nav-item svg {
  width: 20px;
  height: 20px;
  flex: none;
}

.nav-label {
  min-width: 0;
  overflow-wrap: anywhere;
}

.nav-item:hover {
  background: var(--surface-2);
}

.nav-item[aria-current="page"] {
  background: var(--accent-soft);
  color: var(--accent-strong);
  font-weight: 600;
}

.bottom-nav {
  position: fixed;
  left: 0;
  right: 0;
  bottom: 0;
  z-index: 30;
  display: grid;
  grid-template-columns: repeat(5, minmax(0, 1fr));
  gap: 2px;
  padding: 6px 6px calc(6px + env(safe-area-inset-bottom));
  background: var(--surface);
  border-top: 1px solid var(--border);
}

.bottom-nav .nav-item {
  flex-direction: column;
  justify-content: center;
  align-items: center;
  gap: 4px;
  min-height: 56px;
  padding: 8px 4px;
  border-radius: 10px;
  font-size: 0.7rem;
  line-height: 1.15;
}

.bottom-nav .nav-item svg {
  width: 22px;
  height: 22px;
}

.bottom-nav .nav-label {
  max-width: 100%;
  overflow-wrap: anywhere;
  text-align: center;
}

body.onboarding-mode .sidebar,
body.onboarding-mode .bottom-nav,
body.onboarding-mode .topbar-actions {
  display: none;
}

body.onboarding-mode .app {
  display: block;
}

body.onboarding-mode .main-col {
  width: 100%;
}

.card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 16px;
  box-shadow: var(--shadow);
  min-width: 0;
}

.card-head {
  display: flex;
  flex-wrap: wrap;
  align-items: flex-start;
  gap: 4px 8px;
  margin-bottom: 10px;
}

.card-title {
  margin: 0;
  font-size: 1.05rem;
  line-height: 1.3;
  overflow-wrap: anywhere;
}

.card-sub {
  margin: 2px 0 0;
  color: var(--text-muted);
  font-size: 0.875rem;
}

.grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(min(300px, 100%), 1fr));
  gap: 16px;
  min-width: 0;
}

.grid > * {
  min-width: 0;
}

.grid-2 {
  display: grid;
  grid-template-columns: 1fr;
  gap: 16px;
  min-width: 0;
}

@media (min-width: 700px) {
  .grid-2 {
    grid-template-columns: repeat(2, minmax(0, 1fr));
  }
}

.row {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 8px;
  min-width: 0;
}

.stack {
  display: flex;
  flex-direction: column;
  gap: 12px;
  min-width: 0;
}

.spacer {
  flex: 1;
}

.muted {
  color: var(--text-muted);
}

.small {
  font-size: 0.875rem;
}

.divider {
  height: 1px;
  margin: 8px 0;
  background: var(--border);
}

.badge {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  min-width: 0;
  padding: 2px 8px;
  border-radius: 999px;
  background: var(--surface-2);
  color: var(--text-muted);
  font-size: 0.75rem;
  line-height: 1.4;
  white-space: nowrap;
}

.badge-ok {
  background: var(--accent-soft);
  color: var(--accent-strong);
}

.badge-warn {
  background: var(--surface-2);
  border: 1px solid var(--warn);
  color: var(--warn);
}

.badge-info {
  background: var(--surface-2);
  border: 1px solid var(--info);
  color: var(--info);
}

.notice {
  padding: 12px;
  border-left: 4px solid var(--info);
  border-radius: var(--radius);
  background: var(--surface-2);
  min-width: 0;
}

@media (min-width: 768px) {
  .notice {
    background: color-mix(in srgb, var(--info) 9%, var(--surface));
  }
}

.notice-warn {
  border-left-color: var(--warn);
  background: var(--surface-2);
}

@media (min-width: 768px) {
  .notice-warn {
    background: color-mix(in srgb, var(--warn) 10%, var(--surface));
  }
}

.notice-info {
  border-left-color: var(--info);
  background: var(--surface-2);
}

@media (min-width: 768px) {
  .notice-info {
    background: color-mix(in srgb, var(--info) 9%, var(--surface));
  }
}

.empty {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 6px;
  padding: 24px;
  border: 1px dashed var(--border);
  border-radius: var(--radius);
  text-align: center;
  min-width: 0;
}

.empty-title {
  font-weight: 600;
}

.empty-text {
  color: var(--text-muted);
}

.kv {
  display: grid;
  grid-template-columns: auto 1fr;
  gap: 4px 16px;
  margin: 0;
  min-width: 0;
}

.kv dt {
  color: var(--text-muted);
  min-width: 0;
  overflow-wrap: anywhere;
}

.kv dd {
  margin: 0;
  min-width: 0;
  overflow-wrap: anywhere;
}

.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  min-height: 40px;
  padding: 8px 14px;
  border: 1px solid var(--border);
  border-radius: 10px;
  background: var(--surface-2);
  color: var(--text);
  font: inherit;
  line-height: 1.3;
  cursor: pointer;
  min-width: 0;
}

.btn svg {
  width: 18px;
  height: 18px;
  flex: none;
}

.btn:hover:not(:disabled) {
  background: var(--border);
}

.btn:active:not(:disabled) {
  transform: translateY(1px);
}

.btn:disabled {
  opacity: 0.55;
  cursor: not-allowed;
}

.btn-primary {
  background: var(--accent);
  color: var(--accent-contrast);
  border-color: transparent;
}

.btn-primary:hover:not(:disabled) {
  background: var(--accent-strong);
}

.btn-danger {
  background: var(--danger);
  color: #fff;
  border-color: transparent;
}

.btn-danger:hover:not(:disabled) {
  filter: brightness(0.93);
}

.btn-ghost {
  background: transparent;
  border-color: transparent;
}

.btn-ghost:hover:not(:disabled) {
  background: var(--surface-2);
}

.btn-sm {
  min-height: 34px;
  padding: 4px 10px;
  font-size: 0.875rem;
}

.btn-block {
  width: 100%;
}

.icon-btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 40px;
  height: 40px;
  padding: 0;
  border: 0;
  border-radius: 10px;
  background: transparent;
  color: var(--text);
  cursor: pointer;
}

.icon-btn svg {
  width: 22px;
  height: 22px;
  flex: none;
}

.icon-btn:hover:not(:disabled) {
  background: var(--surface-2);
}

.icon-btn:disabled {
  opacity: 0.55;
  cursor: not-allowed;
}

.form {
  display: grid;
  grid-template-columns: 1fr;
  gap: 12px 16px;
  min-width: 0;
}

@media (min-width: 700px) {
  .form {
    grid-template-columns: repeat(2, minmax(0, 1fr));
  }
}

.field {
  display: flex;
  flex-direction: column;
  gap: 4px;
  min-width: 0;
}

.field.wide {
  grid-column: 1 / -1;
}

.field label {
  font-size: 0.9rem;
  font-weight: 600;
}

.hint {
  margin: 0;
  color: var(--text-muted);
  font-size: 0.8rem;
}

.error {
  display: block;
  margin: 0;
  color: var(--danger);
  font-size: 0.85rem;
}

.error[hidden] {
  display: none;
}

.input {
  width: 100%;
  min-height: 42px;
  padding: 8px 10px;
  border: 1px solid var(--border);
  border-radius: 8px;
  background: var(--bg);
  color: var(--text);
  font: inherit;
  line-height: 1.4;
  min-width: 0;
}

textarea.input {
  min-height: 80px;
  resize: vertical;
}

select.input {
  appearance: none;
  background-image: linear-gradient(45deg, transparent 50%, var(--text-muted) 50%),
    linear-gradient(135deg, var(--text-muted) 50%, transparent 50%);
  background-position: calc(100% - 16px) 50%, calc(100% - 10px) 50%;
  background-size: 6px 6px, 6px 6px;
  background-repeat: no-repeat;
  padding-right: 28px;
}

.input[aria-invalid="true"] {
  border-color: var(--danger);
}

.check {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  min-width: 0;
}

.check input[type="checkbox"],
.check input[type="radio"] {
  width: 20px;
  height: 20px;
  margin: 0;
  accent-color: var(--accent);
}

.chip-group,
.seg {
  border: 0;
  padding: 0;
  margin: 0;
  min-width: 0;
}

.chip-group legend,
.seg legend {
  padding: 0;
  margin-bottom: 6px;
  font-size: 0.9rem;
  font-weight: 600;
}

.chips {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
}

.chips label,
.chip-group label.chip,
.seg label {
  position: relative;
  display: inline-flex;
  min-width: 0;
  cursor: pointer;
}

.chips input,
.chip-group input,
.seg input {
  position: absolute;
  inset: 0;
  width: 1px;
  height: 1px;
  margin: 0;
  opacity: 0;
  pointer-events: none;
}

.chips span,
.chip-group label.chip span,
.seg label span {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 6px 12px;
  border: 1px solid var(--border);
  border-radius: 999px;
  background: var(--surface);
  color: var(--text);
  line-height: 1.3;
  overflow-wrap: anywhere;
}

.chip-group input:checked + span,
.seg input:checked + span {
  background: var(--accent-soft);
  border-color: var(--accent);
  color: var(--accent-strong);
  font-weight: 600;
}

.form-actions {
  display: flex;
  flex-wrap: wrap;
  justify-content: flex-end;
  gap: 8px;
  grid-column: 1 / -1;
  min-width: 0;
}

.stats {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
  gap: 12px;
  min-width: 0;
}

.stat {
  background: var(--surface-2);
  border-radius: var(--radius);
  padding: 12px;
  min-width: 0;
}

.stat-label {
  color: var(--text-muted);
  font-size: 0.8rem;
}

.stat-value {
  font-size: 1.4rem;
  font-weight: 600;
  line-height: 1.25;
  font-variant-numeric: tabular-nums;
  overflow-wrap: anywhere;
}

.stat-sub {
  color: var(--text-muted);
  font-size: 0.8rem;
}

.meter {
  height: 8px;
  border-radius: 999px;
  background: var(--surface-2);
  overflow: hidden;
  width: 100%;
}

.meter-bar {
  height: 100%;
  background: var(--accent);
  transition: width 180ms ease;
}

.meter.over .meter-bar {
  background: var(--warn);
}

.table-wrap {
  width: 100%;
  overflow-x: auto;
  min-width: 0;
}

.table {
  width: 100%;
  border-collapse: collapse;
  text-align: left;
}

.table th,
.table td {
  padding: 8px;
  border-bottom: 1px solid var(--border);
  vertical-align: top;
  min-width: 0;
}

.table th {
  color: var(--text-muted);
  font-size: 0.8rem;
  font-weight: 600;
}

.table td {
  overflow-wrap: anywhere;
}

.list {
  list-style: none;
  padding: 0;
  margin: 0;
  min-width: 0;
}

.list-item {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 10px 0;
  border-bottom: 1px solid var(--border);
  min-width: 0;
}

.list-item:last-child {
  border-bottom: 0;
}

.li-main {
  flex: 1;
  min-width: 0;
}

.li-title {
  font-weight: 600;
  overflow-wrap: anywhere;
}

.li-sub {
  color: var(--text-muted);
  font-size: 0.85rem;
}

.li-actions {
  display: flex;
  flex-shrink: 0;
  align-items: center;
  gap: 4px;
  min-width: 0;
  flex-wrap: wrap;
}

.tabs {
  display: flex;
  gap: 4px;
  overflow-x: auto;
  border-bottom: 1px solid var(--border);
  min-width: 0;
}

.tab {
  appearance: none;
  border: 0;
  border-bottom: 3px solid transparent;
  background: transparent;
  color: var(--text-muted);
  padding: 10px 14px;
  min-height: 40px;
  font: inherit;
  cursor: pointer;
  white-space: nowrap;
}

.tab[aria-selected="true"] {
  color: var(--accent-strong);
  border-bottom-color: var(--accent);
  font-weight: 600;
}

.date-pager {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 8px;
  min-width: 0;
}

.date-pager input[type="date"] {
  width: auto;
  min-height: 40px;
}

.ex-card {
  background: var(--surface-2);
  border: 1px solid var(--border);
  border-radius: calc(var(--radius) - 4px);
  padding: 12px;
  min-width: 0;
}

.ex-head {
  display: flex;
  flex-wrap: wrap;
  align-items: flex-start;
  justify-content: space-between;
  gap: 8px;
  margin-bottom: 8px;
}

.set-table {
  display: flex;
  flex-direction: column;
  gap: 6px;
  min-width: 0;
}

.set-row {
  display: grid;
  grid-template-columns: 2.2rem 1fr 1fr auto auto;
  align-items: center;
  gap: 8px;
  min-width: 0;
}

.set-row > * {
  min-width: 0;
}

.set-row .input {
  min-height: 36px;
  padding: 6px 8px;
}

.set-row.done {
  background: var(--accent-soft);
  border-radius: 8px;
  padding: 4px;
  margin: -4px;
}

.timer {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 8px;
  min-width: 0;
}

.timer-display {
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
  font-size: 2rem;
  line-height: 1.1;
  min-width: 5ch;
  text-align: center;
  font-variant-numeric: tabular-nums;
}

.prev-perf {
  color: var(--text-muted);
  font-size: 0.85rem;
}

.suggest {
  padding: 10px 12px;
  border-left: 4px solid var(--accent);
  border-radius: var(--radius);
  background: var(--surface-2);
  min-width: 0;
}

@media (min-width: 768px) {
  .suggest {
    background: color-mix(in srgb, var(--accent) 10%, var(--surface));
  }
}

.chart {
  width: 100%;
  min-width: 0;
}

.chart svg {
  display: block;
  width: 100%;
  height: auto;
}

.ch-grid {
  stroke: var(--border);
  stroke-width: 1;
}

.ch-axis {
  stroke: var(--text-muted);
}

.ch-label {
  fill: var(--text-muted);
  font-size: 11px;
}

.ch-line {
  fill: none;
  stroke: var(--accent);
  stroke-width: 2.5;
}

.ch-line-2 {
  fill: none;
  stroke: var(--info);
  stroke-width: 2;
  stroke-dasharray: 5 4;
}

.ch-dot {
  fill: var(--accent);
}

.ch-bar {
  fill: var(--accent);
  opacity: 0.85;
}

.ch-legend {
  display: flex;
  flex-wrap: wrap;
  gap: 12px;
  color: var(--text-muted);
  font-size: 0.875rem;
}

.ch-legend span {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  min-width: 0;
}

.ch-legend span::before {
  content: "";
  width: 10px;
  height: 10px;
  border-radius: 2px;
  background: var(--accent);
  flex: none;
}

.ch-legend span:nth-child(2)::before {
  background: var(--info);
}

.toast-wrap {
  position: fixed;
  right: 16px;
  left: 16px;
  bottom: calc(80px + env(safe-area-inset-bottom));
  z-index: 50;
  display: flex;
  flex-direction: column;
  gap: 8px;
  pointer-events: none;
}

@media (min-width: 900px) {
  .toast-wrap {
    left: auto;
    right: 16px;
    bottom: 16px;
    width: min(340px, calc(100vw - 32px));
  }
}

.toast {
  background: var(--surface);
  border: 1px solid var(--border);
  border-left: 4px solid var(--info);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
  padding: 10px 14px;
  min-width: 0;
}

.toast.ok {
  border-left-color: var(--accent);
}

.toast.err {
  border-left-color: var(--danger);
}

.toast.info {
  border-left-color: var(--info);
}

dialog.dialog {
  border: none;
  border-radius: 14px;
  padding: 20px;
  background: var(--surface);
  color: var(--text);
  max-width: min(420px, 92vw);
  width: auto;
}

dialog.dialog::backdrop {
  background: rgba(0, 0, 0, 0.45);
}

.dialog-actions {
  display: flex;
  justify-content: flex-end;
  gap: 8px;
  margin-top: 16px;
  flex-wrap: wrap;
}

@media (prefers-reduced-motion: reduce) {
  *,
  *::before,
  *::after {
    animation-duration: 0.01ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: 0.01ms !important;
    scroll-behavior: auto !important;
  }
}

/* Düzeltme: alt menü yalnızca mobilde; içerik alt menünün arkasında kalmasın. */
@media (max-width: 899.98px) {
  .view {
    padding-bottom: calc(96px + env(safe-area-inset-bottom));
  }
  body.onboarding-mode .view {
    padding-bottom: 24px;
  }
}

@media (min-width: 900px) {
  .bottom-nav {
    display: none;
  }
}

body.onboarding-mode .view {
  max-width: 820px;
}

/* ===================== v2: görsel iyileştirmeler ve yeni bileşenler ===================== */
:root, [data-theme="light"], [data-theme="system"] { --radius: 14px; --hero-a: #2e7d5b; --hero-b: #3f9b72; }
[data-theme="dark"] { --radius: 14px; --hero-a: #1d4d39; --hero-b: #2a6b4f; }
@media (prefers-color-scheme: dark) { [data-theme="system"] { --hero-a: #1d4d39; --hero-b: #2a6b4f; } }

.topbar { border-bottom: 1px solid var(--border); }
.card { transition: box-shadow 160ms ease; }
.card-title { font-size: 1.1rem; letter-spacing: -0.01em; }
.sub-head { margin: 14px 0 6px; font-weight: 600; }
.linklike { background: none; border: 0; padding: 0; color: var(--accent-strong); font: inherit; font-weight: 600; cursor: pointer; text-align: left; }
.linklike:hover { text-decoration: underline; }
.table tr.selected td { background: var(--accent-soft); }
.table td.up { color: var(--accent-strong); font-weight: 600; }
.table td.down { color: var(--warn); font-weight: 600; }

/* Hoş geldin alanı ve sihirbaz */
.welcome { display: grid; grid-template-columns: auto 1fr; gap: 12px 16px; align-items: center; padding: 20px;
  border-radius: var(--radius); color: #fff; background: linear-gradient(135deg, var(--hero-a), var(--hero-b)); }
.welcome .row { grid-column: 1 / -1; }
.welcome .muted { color: rgba(255, 255, 255, 0.88); margin: 4px 0 0; }
.welcome-mark { width: 56px; height: 56px; border-radius: 16px; display: grid; place-items: center; background: rgba(255, 255, 255, 0.16); }
.welcome-mark svg { width: 32px; height: 32px; }
.welcome-title { margin: 0; font-size: 1.5rem; letter-spacing: -0.02em; }
.welcome .btn { background: rgba(255, 255, 255, 0.16); border-color: rgba(255, 255, 255, 0.28); color: #fff; }
.welcome .btn:hover:not(:disabled) { background: rgba(255, 255, 255, 0.26); }
.stepper { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; }
.stepper li { display: flex; flex-direction: column; align-items: center; gap: 6px; text-align: center; color: var(--text-muted); font-size: 0.8rem; position: relative; }
.stepper li::after { content: ""; position: absolute; top: 15px; left: calc(50% + 20px); right: calc(-50% + 20px); height: 2px; background: var(--border); }
.stepper li:last-child::after { display: none; }
.stepper li.done::after { background: var(--accent); }
.step-dot { width: 32px; height: 32px; border-radius: 50%; display: grid; place-items: center; font-weight: 700; border: 2px solid var(--border); background: var(--surface); }
.step-dot svg { width: 16px; height: 16px; }
.stepper li.current { color: var(--text); font-weight: 600; }
.stepper li.current .step-dot { border-color: var(--accent); color: var(--accent-strong); background: var(--accent-soft); }
.stepper li.done .step-dot { border-color: var(--accent); background: var(--accent); color: var(--accent-contrast); }
@media (max-width: 520px) { .step-label { font-size: 0.7rem; } }
.wizard-card { padding: 20px; }
.wizard-actions { justify-content: stretch; }
.pf-section { border: 0; padding: 0; margin: 0 0 8px; }
.pf-legend { font-weight: 700; font-size: 1rem; padding: 0; margin-bottom: 2px; }

/* Bugün: selamlama */
.hello { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 12px; padding: 16px 18px;
  border-radius: var(--radius); color: #fff; background: linear-gradient(135deg, var(--hero-a), var(--hero-b)); }
.hello p { margin: 0; }
.hello-greet { font-size: 1.35rem; font-weight: 700; letter-spacing: -0.02em; }
.hello-date { color: rgba(255, 255, 255, 0.85); font-size: 0.9rem; }
.hello-chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip-pill { padding: 4px 10px; border-radius: 999px; background: rgba(255, 255, 255, 0.16); font-size: 0.82rem; }

/* Plan */
.plan-day { font-weight: 700; }
.plan-rest { padding: 10px 16px; background: var(--surface-2); box-shadow: none; }
.plan-head { margin-bottom: 8px; }
.add-row select { flex: 1 1 220px; min-width: 0; width: auto; }
.prev-perf svg { width: 15px; height: 15px; vertical-align: -2px; color: var(--warn); }

/* Kılavuz */
body.guide-open { overflow: hidden; }
.guide-overlay { position: fixed; inset: 0; z-index: 80; background: rgba(0, 0, 0, 0.55); display: grid; place-items: center; padding: 16px; }
.guide-box { width: min(480px, 100%); max-height: calc(100dvh - 32px); overflow: auto; background: var(--surface); color: var(--text);
  border-radius: 20px; padding: 18px 20px 20px; box-shadow: 0 20px 60px rgba(0, 0, 0, 0.35); display: flex; flex-direction: column; gap: 10px; }
.guide-top { display: flex; justify-content: space-between; align-items: center; }
.guide-icon { width: 64px; height: 64px; border-radius: 18px; display: grid; place-items: center; margin: 4px auto 0;

.guide-icon svg { width: 34px; height: 34px; }
.guide-title { margin: 4px 0 0; text-align: center; font-size: 1.3rem; }
.guide-lines { margin: 0; padding-left: 20px; display: flex; flex-direction: column; gap: 8px; line-height: 1.5; }
.guide-dots { display: flex; justify-content: center; gap: 6px; margin-top: 4px; }
.guide-dots span { width: 8px; height: 8px; border-radius: 50%; background: var(--border); }
.guide-dots span.on { width: 22px; border-radius: 999px; background: var(--accent); }
.guide-actions { display: flex; gap: 8px; align-items: center; margin-top: 4px; }

.measure-help summary { cursor: pointer; color: var(--accent-strong); font-weight: 600; font-size: 0.9rem; }

.ai-empty { margin: auto; text-align: center; }

.ai-msg p { margin: 0 0 6px; }
.ai-msg p:last-child { margin-bottom: 0; }
.ai-msg.me { align-self: flex-end; background: var(--accent); color: var(--accent-contrast); border-bottom-right-radius: 4px; }
.ai-msg.bot { align-self: flex-start; background: var(--surface); border: 1px solid var(--border); border-bottom-left-radius: 4px; }
.ai-msg.err { border-color: var(--warn); }
.ai-text ul, .ai-text ol { margin: 4px 0 8px; padding-left: 20px; }
.ai-text li { margin: 2px 0; }
.ai-head { margin-top: 6px; }
.ai-compose { display: flex; gap: 8px; align-items: flex-end; }
.ai-compose textarea { flex: 1; min-height: 46px; resize: vertical; }
.ai-quick { gap: 6px; }
.chip-btn { border: 1px solid var(--border); background: var(--surface); color: var(--text); border-radius: 999px; padding: 6px 12px; font: inherit; font-size: 0.85rem; cursor: pointer; }
.chip-btn:hover { border-color: var(--accent); color: var(--accent-strong); }
.ai-steps { margin: 0; padding-left: 20px; display: flex; flex-direction: column; gap: 6px; }

.ai-settings summary { cursor: pointer; list-style: revert; margin-bottom: 4px; }
.ai-settings[open] summary { margin-bottom: 12px; }
@media (prefers-reduced-motion: reduce) { .card { transition: none; } }

function appendHChildren(el, children) {
  for (const child of children) {
    if (Array.isArray(child)) {

    } else if (child === null || child === undefined || child === false) {
      continue;
    } else if (typeof child === "string" || typeof child === "number") {
      el.appendChild(document.createTextNode(String(child)));
    } else {
      el.appendChild(child);
    }
  }

function pad2(n) {
  return String(n).padStart(2, "0");
}

function todayISO() {
  return toISO(new Date());
}

function toISO(d) {
  return `${d.getFullYear()}-${pad2(d.getMonth() + 1)}-${pad2(d.getDate())}`;
}

function parseISO(iso) {
  if (typeof iso !== "string" || !/^\d{4}-\d{2}-\d{2}$/.test(iso)) return new Date(NaN);
  const [y, m, d] = iso.split("-").map(Number);
  return new Date(y, m - 1, d);
}

function addDays(iso, n) {
  const d = parseISO(iso);
  if (Number.isNaN(d.getTime())) return iso;
  d.setDate(d.getDate() + n);
  return toISO(d);
}

function weekdayISO(iso) {
  const d = parseISO(iso);
  if (Number.isNaN(d.getTime())) return 0;
  const g = d.getDay();
  return g === 0 ? 7 : g;
}

function startOfWeek(iso) {
  const d = parseISO(iso);
  if (Number.isNaN(d.getTime())) return iso;
  const wd = weekdayISO(iso);
  d.setDate(d.getDate() - ((wd === 0 ? 7 : wd) - 1));
  return toISO(d);
}

function daysBetween(aIso, bIso) {
  const a = parseISO(aIso).getTime();
  const b = parseISO(bIso).getTime();
  if (Number.isNaN(a) || Number.isNaN(b)) return 0;
  return Math.round((b - a) / 86400000);
}

function formatDate(iso, long = false) {
  const d = parseISO(iso);
  if (Number.isNaN(d.getTime())) return "—";
  const months = ["Ocak", "Şubat", "Mart", "Nisan", "Mayıs", "Haziran", "Temmuz", "Ağustos", "Eylül", "Ekim", "Kasım", "Aralık"];
  const monthsShort = ["Oca", "Şub", "Mar", "Nis", "May", "Haz", "Tem", "Ağu", "Eyl", "Eki", "Kas", "Ara"];
  const wd = d.getDay() === 0 ? 7 : d.getDay();
  if (long) return `${d.getDate()} ${months[d.getMonth()]} ${d.getFullYear()}, ${WEEKDAYS[wd]}`;
  return `${d.getDate()} ${monthsShort[d.getMonth()]} ${WEEKDAYS_SHORT[wd]}`;
}

function uid(prefix = "id") {
  const t = Date.now().toString(36);
  const r = Math.random().toString(36).slice(2, 8);
  return `${prefix}_${t}_${r}`;
}

function fmtNum(n, digits = 0) {
  if (n === null || n === undefined || n === "") return "—";
  const x = typeof n === "number" ? n : Number(n);
  if (!Number.isFinite(x)) return "—";
  return x.toLocaleString("tr-TR", { minimumFractionDigits: 0, maximumFractionDigits: digits });
}

function round(n, digits = 0) {
  if (typeof n !== "number" || Number.isNaN(n) || !Number.isFinite(n)) return null;
  const f = Math.pow(10, digits);
  return Math.round((n + Number.EPSILON) * f) / f;
}

function clamp(n, min, max) {
  if (typeof n !== "number" || Number.isNaN(n)) return min;
  return Math.min(Math.max(n, min), max);
}

function parseNum(str) {
  if (str === null || str === undefined) return null;
  let s = String(str).trim();
  if (s === "") return null;
  s = s.replace(",", ".");
  if (!/^-?\d+(\.\d+)?$/.test(s)) return NaN;
  return Number(s);
}

function defaultState() {
  return {
    schemaVersion: SCHEMA_VERSION,
    profile: null,
    settings: { theme: "system" },
    nutrition: { targets: null },
    customFoods: [],
    days: {},
    weights: [],
    measurements: [],
    plan: null,
    sessions: [],
    customExercises: [],
    menu: null
  };
}

function isPlainObject(v) {
  return v !== null && typeof v === "object" && !Array.isArray(v);
}

function migrate(obj) {
  if (!isPlainObject(obj)) throw new Error("invalid");
  if (typeof obj.schemaVersion === "number" && obj.schemaVersion > SCHEMA_VERSION) throw new Error("newer");

  const state = defaultState();
  state.schemaVersion = typeof obj.schemaVersion === "number" ? obj.schemaVersion : SCHEMA_VERSION;

  state.profile = isPlainObject(obj.profile) ? obj.profile : null;

  const settings = isPlainObject(obj.settings) ? obj.settings : {};
  state.settings = {
    theme: ["system", "light", "dark"].includes(settings.theme) ? settings.theme : "system",
    guideSeen: settings.guideSeen === true,
    aiModel: typeof settings.aiModel === "string" ? settings.aiModel : null,
    aiShareProfile: settings.aiShareProfile === true
  };

  const nutrition = isPlainObject(obj.nutrition) ? obj.nutrition : {};
  state.nutrition = { targets: isPlainObject(nutrition.targets) ? nutrition.targets : null };

  state.customFoods = Array.isArray(obj.customFoods) ? obj.customFoods.slice() : [];
  state.days = isPlainObject(obj.days) ? obj.days : {};

  const dateOk = (d) => typeof d === "string" && /^\d{4}-\d{2}-\d{2}$/.test(d);
  const numOrNull = (v) => (v != null && v !== "" && Number.isFinite(Number(v)) && Number(v) > 0 ? Number(v) : null);
  const measByDate = {};
  if (Array.isArray(obj.measurements)) {
    for (const m of obj.measurements) {
      if (!isPlainObject(m) || !dateOk(m.date)) continue;
      const entry = { date: m.date };
      for (const [k] of MEASURES) entry[k] = numOrNull(m[k]);
      measByDate[m.date] = entry;
    }
  }
  if (Array.isArray(obj.weights)) {
    const byDate = {};
    for (const w of obj.weights) {
      if (!isPlainObject(w) || !dateOk(w.date)) continue;
      const kg = Number(w.kg);
      if (!Number.isFinite(kg) || kg <= 0) continue;
      byDate[w.date] = { date: w.date, kg };
      // Sürüm 1'de bel çevresi kilo kaydının içindeydi; ölçümlere taşınır.
      const waist = numOrNull(w.waistCm);
      if (waist != null) {
        if (!measByDate[w.date]) { measByDate[w.date] = { date: w.date }; for (const [k] of MEASURES) measByDate[w.date][k] = null; }
        if (measByDate[w.date].waistCm == null) measByDate[w.date].waistCm = waist;
      }
    }
    state.weights = Object.keys(byDate).sort().map((date) => byDate[date]);
  } else {
    state.weights = [];
  }
  state.measurements = Object.keys(measByDate).sort().map((d) => measByDate[d]);
  state.customExercises = Array.isArray(obj.customExercises) ? obj.customExercises.filter(isPlainObject) : [];
  if (state.profile) { delete state.profile.pregnancy; delete state.profile.medicalDiet; }
  state.schemaVersion = SCHEMA_VERSION;

  state.plan = isPlainObject(obj.plan) ? obj.plan : null;
  state.sessions = Array.isArray(obj.sessions) ? obj.sessions.slice() : [];
  state.menu = isPlainObject(obj.menu) ? obj.menu : null;

  return state;
}

const APP = {
  state: null,
  ui: {
    view: "today",
    date: todayISO(),
    tab: {},
    loadError: null
  }
};

function loadState() {
  let raw;
  try {
    raw = localStorage.getItem(STORAGE_KEY);
  } catch (e) {
    APP.ui.loadError = "Tarayıcı depolamasına erişilemiyor. Kayıtlar bu oturumda saklanamayabilir.";
    APP.state = defaultState();
    return;
  }

  if (raw === null || raw === "") {
    APP.state = defaultState();
    return;
  }

  let parsed;
  try {
    parsed = JSON.parse(raw);
  } catch (e) {
    try {
      localStorage.setItem("fitnessApp.corrupt-" + Date.now(), raw);
    } catch (e2) {}
    APP.ui.loadError = "Kayıtlı veriler okunamadı (bozuk olabilir). Eski veri ayrı bir anahtara yedeklendi; uygulama boş verilerle başladı. Yedekten geri yükleyebilirsin.";
    APP.state = defaultState();
    return;
  }

  if (isPlainObject(parsed) && typeof parsed.schemaVersion === "number" && parsed.schemaVersion > SCHEMA_VERSION) {
    APP.ui.loadError = "Kayıtlar bu uygulamanın daha yeni bir sürümüyle oluşturulmuş. Veri kaybını önlemek için kayıt yapılmayacak.";
    APP.ui.readOnly = true;
    APP.state = defaultState();
    return;
  }

  try {
    APP.state = migrate(parsed);
  } catch (e) {
    if (e && e.message === "newer") {
      APP.ui.loadError = "Kayıtlar bu uygulamanın daha yeni bir sürümüyle oluşturulmuş. Veri kaybını önlemek için kayıt yapılmayacak.";
      APP.ui.readOnly = true;
    } else {
      APP.ui.loadError = "Kayıtlı veriler okunamadı (bozuk olabilir). Eski veri ayrı bir anahtara yedeklendi; uygulama boş verilerle başladı. Yedekten geri yükleyebilirsin.";
      try {
        localStorage.setItem("fitnessApp.corrupt-" + Date.now(), raw);
      } catch (e2) {}
    }
    APP.state = defaultState();
  }
}

function saveState() {
  if (APP.ui.readOnly) {
    toast("Kayıtlar okunur; bu modda kayıt yapılamıyor.", "err");
    return false;
  }
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(APP.state));
    return true;
  } catch (e) {
    toast("Kayıt yapılamadı: tarayıcı depolaması dolu veya erişilemiyor. Yedek indirip yer açmayı dene.", "err");
    return false;
  }
}

function commit() {
  const ok = saveState();
  rerender();
  return ok;
}

function validateBackup(obj) {
  const errors = [];
  const add = (m) => { if (errors.length < 10) errors.push(m); };
  const dateRe = /^\d{4}-\d{2}-\d{2}$/;

  if (!isPlainObject(obj)) {
    add("Yedek dosyası geçersiz: veri bir nesne değil.");
    return errors;
  }

  if (typeof obj.schemaVersion !== "number" || !Number.isFinite(obj.schemaVersion)) {
    add("Yedek sürümü geçersiz.");
  } else if (obj.schemaVersion > SCHEMA_VERSION) {
    add("Yedek bu sürümden yeni.");
  }

  if (obj.profile !== null && obj.profile !== undefined) {
    if (!isPlainObject(obj.profile)) {
      add("Profil verisi geçersiz.");
    } else {
      const p = obj.profile;
      if (!Number.isFinite(Number(p.age))) add("Profil yaş alanı geçersiz.");
      if (!Number.isFinite(Number(p.heightCm))) add("Profil boy alanı geçersiz.");
      if (!Number.isFinite(Number(p.weightKg))) add("Profil kilo alanı geçersiz.");
    }
  }

  if (!isPlainObject(obj.days)) {
    add("Günlük kayıtlar geçersiz.");
  } else {
    for (const key of Object.keys(obj.days)) {
      if (!dateRe.test(key)) {
        add(`Gün anahtarı geçersiz: ${key}`);
        continue;
      }
      const day = obj.days[key];
      if (!isPlainObject(day) || !Array.isArray(day.meals)) {
        add(`Gün verisi geçersiz: ${key}`);
      }
      if (errors.length >= 10) break;
    }
  }

  if (!Array.isArray(obj.weights)) {
    add("Kilo kayıtları geçersiz.");
  } else {
    obj.weights.forEach((w, i) => {
      if (errors.length >= 10) return;
      if (!isPlainObject(w) || typeof w.date !== "string" || !dateRe.test(w.date) || !Number.isFinite(Number(w.kg)) || Number(w.kg) <= 0) {
        add(`Kilo kaydı #${i + 1} geçersiz.`);
      }
    });
  }

  if (!Array.isArray(obj.sessions)) {
    add("Antrenman kayıtları geçersiz.");
  } else {
    obj.sessions.forEach((s, i) => {
      if (errors.length >= 10) return;
      if (!isPlainObject(s) || !s.id || typeof s.date !== "string" || !dateRe.test(s.date) || !Array.isArray(s.exercises)) {
        add(`Antrenman kaydı #${i + 1} geçersiz.`);
      }
    });
  }

  if (!Array.isArray(obj.customFoods)) {
    add("Özel yiyecekler geçersiz.");
  } else {
    obj.customFoods.forEach((f, i) => {
      if (errors.length >= 10) return;
      if (!isPlainObject(f) || !f.id || typeof f.name !== "string" || !isPlainObject(f.per100)) {
        add(`Özel yiyecek #${i + 1} geçersiz.`);
        return;
      }
      const per100 = f.per100;
      if (!Number.isFinite(Number(per100.kcal)) || Number(per100.kcal) < 0 ||
          !Number.isFinite(Number(per100.p)) || Number(per100.p) < 0 ||
          !Number.isFinite(Number(per100.f)) || Number(per100.f) < 0 ||
          !Number.isFinite(Number(per100.c)) || Number(per100.c) < 0) {
        add(`Özel yiyecek #${i + 1} besin değeri geçersiz.`);
      }
    });
  }

  if (obj.plan !== null && obj.plan !== undefined) {
    if (!isPlainObject(obj.plan) || !Array.isArray(obj.plan.days) || obj.plan.days.length !== 7) {
      add("Plan verisi geçersiz.");
    }
  }

  if (obj.measurements !== undefined && !Array.isArray(obj.measurements)) add("Vücut ölçüleri geçersiz.");
  if (obj.customExercises !== undefined && !Array.isArray(obj.customExercises)) add("Kendi hareketlerin geçersiz.");

  if (obj.menu !== null && obj.menu !== undefined && !isPlainObject(obj.menu)) {
    add("Menü verisi geçersiz.");
  }

  return errors;
}

function exportBackup() {
  const payload = {
    app: "fitness",
    exportedAt: new Date().toISOString(),
    data: APP.state
  };
  const json = JSON.stringify(payload, null, 2);
  const blob = new Blob([json], { type: "application/json" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = `fitness-yedek-${todayISO()}.json`;
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
  toast("Yedek indirildi.", "ok");
}

function importBackup(file) {
  if (!file) return;
  file.text().then((raw) => {
    let parsed;
    try {
      parsed = JSON.parse(raw);
    } catch (e) {
      toast("Dosya okunamadı: geçerli bir JSON değil.", "err");
      return;
    }
    const data = parsed && parsed.app === "fitness" && parsed.data ? parsed.data : parsed;
    const errors = validateBackup(data);
    if (errors.length > 0) {
      toast(`${errors[0]} ${errors.length > 1 ? `(${errors.length} hata)` : ""}`, "err");
      return;
    }
    confirmDialog("Mevcut tüm kayıtların bu yedekteki verilerle değiştirilecek. Devam etmek istiyor musun?", "Geri yükle").then((ok) => {
      if (!ok) return;
      try {
        APP.state = migrate(data);
      } catch (e) {
        toast("Geri yükleme yapılamadı: yedek geçersiz.", "err");
        return;
      }
      if (saveState()) {
        applyTheme();
        toast("Yedek geri yüklendi.", "ok");
        navigate("today");
      }
    });
  }).catch(() => {
    toast("Dosya okunamadı: geçerli bir JSON değil.", "err");
  });
}

function toast(message, kind = "info") {
  const wrap = document.getElementById("toast-wrap");
  if (!wrap) return;
  const el = h("div", { class: `toast ${kind}`, role: "status", text: String(message) });
  wrap.appendChild(el);
  setTimeout(() => {
    if (el.parentNode) el.remove();
  }, 4000);
}

function confirmDialog(message, okLabel = "Onayla") {
  const dialog = document.getElementById("confirm-dialog");
  const msg = document.getElementById("confirm-msg");
  const ok = document.getElementById("confirm-ok");
  if (!dialog || !msg || !ok) return Promise.resolve(window.confirm(message));
  msg.textContent = message;
  ok.textContent = okLabel;
  if (typeof dialog.showModal !== "function") {
    return Promise.resolve(window.confirm(message));
  }
  // Sonuç doğrudan düğmelerden ve Escape'ten alınır; "close" olayına güvenilmez (gizli sekmede gecikebilir).
  return new Promise((resolve) => {
    const cancel = document.getElementById("confirm-cancel");
    const finish = (value) => {
      ok.removeEventListener("click", onOk);
      if (cancel) cancel.removeEventListener("click", onCancel);
      dialog.removeEventListener("cancel", onCancel);
      if (dialog.open) dialog.close(value ? "ok" : "cancel");
      resolve(value);
    };
    const onOk = (e) => { e.preventDefault(); finish(true); };
    const onCancel = (e) => { e.preventDefault(); finish(false); };
    ok.addEventListener("click", onOk);
    if (cancel) cancel.addEventListener("click", onCancel);
    dialog.addEventListener("cancel", onCancel);
    dialog.returnValue = "";
    dialog.showModal();
    if (cancel) cancel.focus();
  });
}

function applyTheme() {
  const theme = (APP.state && APP.state.settings && APP.state.settings.theme) || "system";
  document.documentElement.dataset.theme = theme;
  const btn = document.getElementById("theme-btn");
  if (!btn) return;
  clear(btn);
  const iconMap = { system: "auto", light: "sun", dark: "moon" };
  const labelMap = { system: "Tema: Sistem", light: "Tema: Açık", dark: "Tema: Koyu" };
  btn.appendChild(icon(iconMap[theme] || "auto"));
  const label = labelMap[theme] || labelMap.system;
  btn.setAttribute("aria-label", label);
  btn.title = label;
}

function cycleTheme() {
  const order = ["system", "light", "dark"];
  const cur = APP.state.settings.theme;
  const next = order[(order.indexOf(cur) + 1) % order.length];
  APP.state.settings.theme = next;
  saveState();
  applyTheme();
}

function buildNav() {
  const side = document.getElementById("side-nav");
  const bottom = document.getElementById("bottom-nav");
  if (side) clear(side);
  if (bottom) clear(bottom);
  const makeBtn = (item, compact) => h(
      "button",
      {
        class: "nav-item",
        type: "button",
        attrs: { "data-view": item.view },
        on: { click: () => navigate(item.view) }
      },
      icon(item.icon),
      h("span", { class: "nav-label", text: compact && item.short ? item.short : item.label })
    );
  for (const item of NAV) {
    if (side) side.appendChild(makeBtn(item));
    if (bottom && item.view !== "settings" && item.view !== "assistant") bottom.appendChild(makeBtn(item, true));
  }
  const settingsBtn = document.getElementById("settings-btn");
  if (settingsBtn) {
    clear(settingsBtn);
    settingsBtn.appendChild(icon("settings"));
    settingsBtn.onclick = () => navigate("settings");
  }
  const aiBtn = document.getElementById("assistant-btn");
  if (aiBtn) { clear(aiBtn); aiBtn.appendChild(icon("chat")); aiBtn.onclick = () => navigate("assistant"); }
  const helpBtn = document.getElementById("help-btn");
  if (helpBtn) { clear(helpBtn); helpBtn.appendChild(icon("help")); helpBtn.onclick = () => openGuide(); }
}

function navigate(view, tab) {
  const item = NAV.find((n) => n.view === view);
  if (!item) view = "today";
  APP.ui.view = view;
  if (tab !== undefined && tab !== null) APP.ui.tab[view] = tab;
  if (location.hash !== `#${view}`) location.hash = `#${view}`;
  rerender();
  window.scrollTo(0, 0);
  const target = document.getElementById("view");
  if (target) target.focus({ preventScroll: true });
}

function rerender() {
  const root = document.getElementById("view");
  if (!root) return;
  clear(root);

  // Uyarı, ekran çizildikten sonra en üste eklenir (ekranlar çizime başlarken alanı temizliyor).
  let notice = null;
  if (APP.ui.loadError) {
    notice = h(
      "div",
      { class: "notice notice-warn", role: "alert" },
      h("span", { text: APP.ui.loadError }),
      h("button", {
        class: "btn btn-sm",
        type: "button",
        on: { click: () => { APP.ui.loadError = null; rerender(); } }
      }, "Kapat")
    );
  }

  if (!APP.state.profile) {
    document.body.classList.add("onboarding-mode");
    const title = document.getElementById("view-title");
    if (title) title.textContent = "Hoş geldin";
    renderOnboarding(root);
    if (notice) root.prepend(notice);
    return;
  }

  document.body.classList.remove("onboarding-mode");
  const navItem = NAV.find((n) => n.view === APP.ui.view) || NAV[0];
  const titleEl = document.getElementById("view-title");
  if (titleEl) titleEl.textContent = navItem.label;
  document.querySelectorAll(".nav-item[aria-current='page']").forEach((b) => b.removeAttribute("aria-current"));
  document.querySelectorAll(`.nav-item[data-view="${navItem.view}"]`).forEach((b) => b.setAttribute("aria-current", "page"));
  document.title = `${navItem.label} · Fitness`;

  try {
    if (navItem.view === "today") renderToday(root);
    else if (navItem.view === "workout") renderWorkout(root);
    else if (navItem.view === "nutrition") renderNutrition(root);
    else if (navItem.view === "progress") renderProgress(root);
    else if (navItem.view === "review") renderReview(root);
    else if (navItem.view === "assistant") renderAssistant(root);
    else renderSettings(root);
    if (notice) root.prepend(notice);
  } catch (e) {
    console.error(e);
    root.appendChild(
      card(
        { title: "Bu bölüm görüntülenemedi" },
        h("p", { class: "muted", text: "Beklenmeyen bir hata oluştu. Sayfayı yenilemeyi dene; sorun sürerse yedek alıp verilerini kontrol et." })
      )
    );
  }
}

function getDay(iso) {
  if (!APP.state || !APP.state.days) return null;
  const day = APP.state.days[iso];
  return isPlainObject(day) ? day : null;
}

function ensureDay(iso) {
  if (!APP.state.days) APP.state.days = {};
  if (!APP.state.days[iso]) {
    APP.state.days[iso] = {
      waterMl: null,
      steps: null,
      sleepHours: null,
      energy: null,
      soreness: null,
      note: "",
      meals: []
    };
  }
  return APP.state.days[iso];
}

function currentWeight() {
  if (APP.state.weights && APP.state.weights.length > 0) {
    const last = APP.state.weights[APP.state.weights.length - 1];
    if (last && Number.isFinite(last.kg)) return last.kg;
  }
  if (APP.state.profile && Number.isFinite(APP.state.profile.weightKg)) return APP.state.profile.weightKg;
  return null;
}

function upsertWeight(date, kg) {
  const entry = { date, kg: Number(kg) };
  const idx = APP.state.weights.findIndex((x) => x.date === date);
  if (idx >= 0) APP.state.weights[idx] = entry;
  else APP.state.weights.push(entry);
  APP.state.weights.sort((a, b) => (a.date < b.date ? -1 : a.date > b.date ? 1 : 0));
}

// values: { waistCm, neckCm, ... } — null olanlar kaydedilmemiş sayılır. Hepsi boşsa o günün ölçümü silinir.
function upsertMeasurement(date, values) {
  const entry = { date };
  let any = false;
  for (const [k] of MEASURES) {
    const v = values[k];
    entry[k] = v != null && Number.isFinite(Number(v)) && Number(v) > 0 ? Number(v) : null;
    if (entry[k] != null) any = true;
  }
  const list = APP.state.measurements;
  const idx = list.findIndex((x) => x.date === date);
  if (!any) { if (idx >= 0) list.splice(idx, 1); return; }
  if (idx >= 0) list[idx] = entry; else list.push(entry);
  list.sort((a, b) => (a.date < b.date ? -1 : a.date > b.date ? 1 : 0));
}

function card({ title, sub, actions, cls } = {}, ...children) {
  const el = h("section", { class: cls ? `card ${cls}` : "card" });
  if (title || sub || actions) {
    const head = h("div", { class: "card-head" });
    if (title) head.appendChild(h("h2", { class: "card-title", text: title }));
    if (sub) head.appendChild(h("p", { class: "card-sub", text: sub }));
    if (actions) {
      const row = h("div", { class: "row" });
      appendHChildren(row, Array.isArray(actions) ? actions : [actions]);
      head.appendChild(row);
    }
    el.appendChild(head);
  }
  appendHChildren(el, children);
  return el;
}

function field({ label, input, hint, wide } = {}) {
  const wrap = h("div", { class: wide ? "field wide" : "field" });
  if (label) wrap.appendChild(h("label", { for: input.id, text: label }));
  wrap.appendChild(input);
  if (hint) {
    const hintEl = h("p", { id: input.id + "-hint", class: "hint", text: hint });
    wrap.appendChild(hintEl);
  }
  const errEl = h("p", { id: input.id + "-err", class: "error", role: "alert", hidden: true });
  wrap.appendChild(errEl);
  const describedBy = [];
  if (hint) describedBy.push(input.id + "-hint");
  describedBy.push(input.id + "-err");
  input.setAttribute("aria-describedby", describedBy.join(" "));
  return wrap;
}

function setFieldError(input, msg) {
  if (!input || !input.id) return;
  const err = document.getElementById(input.id + "-err");
  if (msg) {
    input.setAttribute("aria-invalid", "true");
    if (err) {
      err.textContent = String(msg);
      err.hidden = false;
    }
  } else {
    input.removeAttribute("aria-invalid");
    if (err) {
      err.textContent = "";
      err.hidden = true;
    }
  }
}

function clearFieldErrors(container) {
  if (!container) return;
  container.querySelectorAll("[aria-invalid]").forEach((el) => el.removeAttribute("aria-invalid"));
  container.querySelectorAll("p.error").forEach((el) => {
    el.textContent = "";
    el.hidden = true;
  });
}

function numberInput({ id, value, min, max, step, placeholder } = {}) {
  const el = h("input", {
    class: "input",
    id,
    type: "number",
    inputmode: "decimal",
    value: value === null || value === undefined ? "" : String(value),
    placeholder: placeholder || "",
    step: step || "any",
    min: min !== undefined && min !== null ? min : undefined,
    max: max !== undefined && max !== null ? max : undefined
  });
  return el;
}

function selectInput({ id, options = [], value } = {}) {
  const el = h("select", { class: "input", id });
  for (const [val, label] of options) {
    const opt = h("option", { value: val, text: label, selected: value === val ? true : undefined });
    el.appendChild(opt);
  }
  return el;
}

function textInput({ id, value, placeholder, maxlength } = {}) {
  return h("input", {
    class: "input",
    id,
    type: "text",
    value: value === null || value === undefined ? "" : String(value),
    placeholder: placeholder || "",
    maxlength: maxlength !== undefined && maxlength !== null ? maxlength : undefined
  });
}

function chipGroup({ name, options = [], values = [], legend } = {}) {
  const fs = h("fieldset", { class: "chip-group" });
  if (legend) fs.appendChild(h("legend", { text: legend }));
  const chips = h("div", { class: "chips" });
  for (const [val, label] of options) {
    const input = h("input", { type: "checkbox", name, value: val, checked: values.includes(val) ? true : undefined, id: `${name}_${String(val).replace(/[^a-zA-Z0-9_-]/g, "")}` });
    chips.appendChild(h("label", { class: "chip", for: input.id }, input, h("span", { text: label })));
  }
  fs.appendChild(chips);
  return fs;
}

function segGroup({ name, options = [], value, legend } = {}) {
  const fs = h("fieldset", { class: "seg" });
  if (legend) fs.appendChild(h("legend", { text: legend }));
  const chips = h("div", { class: "chips" });
  for (const [val, label] of options) {
    const input = h("input", { type: "radio", name, value: val, checked: value === val ? true : undefined, id: `${name}_seg_${String(val).replace(/[^a-zA-Z0-9_-]/g, "")}` });
    chips.appendChild(h("label", { class: "chip", for: input.id }, input, h("span", { text: label })));
  }
  fs.appendChild(chips);
  return fs;
}

function readChecks(container, name) {
  const out = [];
  if (!container) return out;
  container.querySelectorAll(`input[name="${name}"]:checked`).forEach((el) => out.push(el.value));
  return out;
}

function emptyState(title, text, actionButton = null) {
  const el = h("div", { class: "empty" },
    h("p", { class: "empty-title", text: title }),
    h("p", { class: "empty-text", text: text })
  );
  if (actionButton) el.appendChild(actionButton);
  return el;
}

function tabs(viewName, list = [], defaultId) {
  const current = APP.ui.tab[viewName] && list.some((x) => x[0] === APP.ui.tab[viewName]) ? APP.ui.tab[viewName] : defaultId;
  const el = h("div", { class: "tabs", role: "tablist" });
  for (const [id, label] of list) {
    const btn = h("button", {
      class: "tab",
      role: "tab",
      type: "button",
      attrs: { "aria-selected": id === current ? "true" : "false" },
      on: { click: () => { APP.ui.tab[viewName] = id; rerender(); } }
    }, h("span", { text: label }));
    el.appendChild(btn);
  }
  return { el, current };
}

function datePager() {
  const today = todayISO();
  const isToday = APP.ui.date === today;
  const prev = h("button", { class: "btn btn-sm", type: "button", attrs: { "aria-label": "Önceki gün" }, on: { click: () => { APP.ui.date = addDays(APP.ui.date, -1); rerender(); } } }, icon("chevron-left"));
  const dateInput = h("input", { class: "input", type: "date", attrs: { "aria-label": "Tarih seç" }, value: APP.ui.date, on: { change: (e) => { if (/^\d{4}-\d{2}-\d{2}$/.test(e.target.value)) { APP.ui.date = e.target.value; rerender(); } } } });
  const next = h("button", { class: "btn btn-sm", type: "button", attrs: { "aria-label": "Sonraki gün" }, on: { click: () => { APP.ui.date = addDays(APP.ui.date, 1); rerender(); } } }, icon("chevron-right"));
  const todayBtn = h("button", { class: "btn btn-sm", type: "button", disabled: isToday ? true : undefined, on: { click: () => { APP.ui.date = today; rerender(); } } }, "Bugün");
  const label = h("span", { class: "muted", text: formatDate(APP.ui.date, true) });
  return h("div", { class: "date-pager" }, prev, dateInput, next, todayBtn, label);
}

function init() {
  loadState();
  buildNav();
  applyTheme();

  const themeBtn = document.getElementById("theme-btn");
  if (themeBtn) themeBtn.onclick = () => cycleTheme();

  if (window.matchMedia) {
    const mq = window.matchMedia("(prefers-color-scheme: dark)");
    mq.addEventListener ? mq.addEventListener("change", () => applyTheme()) : mq.addListener(() => applyTheme());
  }

  window.addEventListener("hashchange", () => {
    const v = (location.hash || "").replace("#", "");
    if (v && v !== APP.ui.view) navigate(v);
  });

  const initialHash = (location.hash || "").replace("#", "");
  const initialView = NAV.some((n) => n.view === initialHash) ? initialHash : "today";
  APP.ui.view = initialView;
  rerender();
}
